  </div>);
}

// ═══ APERÇU + TÉLÉCHARGEMENT DE LA CARTE D'UN MEMBRE ═══
function MemberCardPreview({member,boissonsUrl,onClose}){
  const canvasRef=useRef(null);
  const [imgUrl,setImgUrl]=useState(null);
  const [err,setErr]=useState("");

  useEffect(()=>{
    let cancelled=false;
    generateMemberCardCanvas(member,boissonsUrl).then(canvas=>{
      if(cancelled)return;
      canvasRef.current=canvas;
      setImgUrl(canvas.toDataURL("image/png"));
    }).catch(e=>setErr(e.message||"Échec de la génération de la carte"));
    return()=>{cancelled=true;};
  },[member.id]);

  const downloadPNG=()=>{
    if(!canvasRef.current)return;
    const a=document.createElement("a");
    a.download="carte-"+(member.nom||"membre").replace(/\s+/g,"_")+".png";
    a.href=canvasRef.current.toDataURL("image/png");
    a.click();
  };
  const downloadPDF=()=>{
    if(!canvasRef.current)return;
    if(!window.jspdf){window.alert("⚠️ La bibliothèque PDF n'a pas pu se charger (vérifiez la connexion internet, puis rechargez complètement la page).");return;}
    const {jsPDF}=window.jspdf;
    // Page A4 Portrait, avec la carte au format CB exact (85,60 x 53,98 mm), centrée.
    const doc=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    const x=(210-CARD_MM_W)/2, y=(297-CARD_MM_H)/2;
    doc.addImage(canvasRef.current.toDataURL("image/jpeg",0.9),"JPEG",x,y,CARD_MM_W,CARD_MM_H);
    doc.save("carte-"+(member.nom||"membre").replace(/\s+/g,"_")+".pdf");
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:230,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:T.card,borderRadius:16,padding:18,width:"100%",maxWidth:440}}>
      <div style={{fontWeight:800,fontSize:16,marginBottom:12}}>🪪 Carte — {member.nom}</div>
      {err&&<div style={{color:T.red,fontSize:13,marginBottom:10}}>⚠️ {err}</div>}
      {imgUrl?<img src={imgUrl} style={{width:"100%",borderRadius:10,boxShadow:"0 2px 10px rgba(0,0,0,.15)",marginBottom:14}}/>
        :!err&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:30}}>⏳ Génération de la carte...</div>}
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button onClick={downloadPNG} disabled={!imgUrl} style={{flex:1,padding:"11px",background:imgUrl?T.dark:"#ccc",color:"white",border:"none",borderRadius:10,cursor:imgUrl?"pointer":"default",fontWeight:700,fontSize:13}}>
          📥 PNG
        </button>
        <button onClick={downloadPDF} disabled={!imgUrl} style={{flex:1,padding:"11px",background:imgUrl?"#5856D6":"#ccc",color:"white",border:"none",borderRadius:10,cursor:imgUrl?"pointer":"default",fontWeight:700,fontSize:13}}>
          📥 PDF
        </button>
      </div>
      <button onClick={onClose} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Fermer</button>
    </div>
  </div>);
}

function CombosAdmin({products,combos,setCombos,caisseUrl}){
  const [edit,setEdit]=useState(null); // combo en cours d'édition, ou {} pour nouveau
  const [busy,setBusy]=useState(false);

  const startNew=()=>setEdit({id:null,name:"",price:"",items:[],photo:""});
  const startEdit=c=>setEdit({id:c.id,name:c.name,price:c.price,items:c.items.map(it=>({...it})),photo:c.photo||""});

  const addItem=()=>{
    if(!products.length)return;
    setEdit(prev=>({...prev,items:[...prev.items,{productId:products[0].id,qty:1}]}));
  };
  const updateItem=(idx,field,val)=>setEdit(prev=>({...prev,items:prev.items.map((it,i)=>i===idx?{...it,[field]:val}:it)}));
  const removeItem=idx=>setEdit(prev=>({...prev,items:prev.items.filter((_,i)=>i!==idx)}));

  const handlePhoto=e=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setEdit(prev=>({...prev,photo:url})));
  };

  const save=async()=>{
    if(!edit.name||!edit.price||edit.items.length===0)return;
    setBusy(true);
    const id=edit.id||uid();
    // Même optimisation que pour les produits/portions : photo renvoyée seulement si
    // elle a changé, sinon "__KEEP__" garde celle déjà enregistrée côté serveur.
    const original=edit.id?combos.find(c=>c.id===edit.id):null;
    const photoChanged=!original||edit.photo!==(original.photo||"");
    let photoParam,extra={};
    if(photoChanged){
      const up=await uploadPhotoGeneric(caisseUrl,"uploadComboPhotoChunk",id,edit.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error);setBusy(false);return;}
      photoParam=up.photoParam;extra=up.photoChunks?{photoChunks:up.photoChunks}:{};
    }else{
      photoParam="__KEEP__";
    }
    const itemsStr=edit.items.map(it=>it.productId+":"+it.qty).join(",");
    const r=await apiWrite(caisseUrl,{action:"saveCombo",id,name:edit.name,price:+edit.price,items:itemsStr,photo:photoParam,...extra});
    if(r.ok){
      const newEntry={id,name:edit.name,price:+edit.price,items:edit.items.map(it=>({productId:it.productId,qty:+it.qty})),
        photo:photoChanged?(photoParam==="__CHUNKED__"?edit.photo:photoParam):(original?.photo||"")};
      setCombos(prev=>[...prev.filter(c=>c.id!==id),newEntry]);
      setEdit(null);
    }
    setBusy(false);
  };

  const del=async id=>{
    if(!window.confirm("Supprimer ce menu ?"))return;
    setCombos(prev=>prev.filter(c=>c.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteCombo",id});
  };

  const prodName=pid=>products.find(p=>p.id.toString()===pid.toString())?.name||"(produit supprimé)";

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <button onClick={startNew} style={{width:"100%",padding:"12px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,marginBottom:14}}>
      + Nouveau menu
    </button>
    {combos.map(c=>(
      <div key={c.id} style={{background:T.card,borderRadius:10,padding:"11px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
        {c.photo?<img src={c.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:26,flexShrink:0}}>🍽</span>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:T.dark}}>{c.name}</div>
          <div style={{fontSize:11,color:T.mid,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {fmt(c.price)} • {c.items.map(it=>it.qty+"× "+prodName(it.productId)).join(", ")}
          </div>
        </div>
        <button onClick={()=>startEdit(c)} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
        <button onClick={()=>del(c.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
      </div>
    ))}

    {edit&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>{edit.id?"✏️ Modifier le menu":"+ Nouveau menu"}</div>
        <input placeholder="Nom (ex: Menu Croque)" value={edit.name} onChange={e=>setEdit({...edit,name:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <input placeholder="Prix du menu" type="number" step="0.50" value={edit.price} onChange={e=>setEdit({...edit,price:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>

        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Photo du menu</label>
        {edit.photo&&<img src={edit.photo} style={{width:50,height:50,borderRadius:8,objectFit:"cover",marginBottom:6,display:"block"}}/>}
        <input type="file" accept="image/*" onChange={handlePhoto} style={{fontSize:12,color:T.mid,marginBottom:12}}/>

        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:6}}>Produits inclus</label>
        {edit.items.map((it,idx)=>(
          <div key={idx} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
            <select value={it.productId} onChange={e=>updateItem(idx,"productId",e.target.value)}
              style={{flex:1,padding:"8px",border:`1px solid ${T.border}`,borderRadius:7,fontSize:12}}>
              {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <input type="number" min="1" value={it.qty} onChange={e=>updateItem(idx,"qty",e.target.value)}
              style={{width:50,padding:"8px",border:`1px solid ${T.border}`,borderRadius:7,fontSize:12,textAlign:"center"}}/>
            <button onClick={()=>removeItem(idx)} style={{padding:"7px 9px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
          </div>
        ))}
        <button onClick={addItem} style={{width:"100%",padding:"9px",background:T.bg,border:`1px dashed ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:T.dark,marginBottom:14}}>
          + Ajouter un produit au menu
        </button>

        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEdit(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={save} disabled={busy||!edit.name||!edit.price||edit.items.length===0}
            style={{flex:2,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:busy?"default":"pointer",fontWeight:700}}>
            {busy?"⏳ Envoi...":"💾 Enregistrer"}
          </button>
        </div>
      </div>
    </div>}
  </div>);
}

// ═══ PANNEAU CONTENANT INLINE (sous le produit, dans l'écran Stock) ═══
function InlineContainerPanel({prod,siteId,caisseUrl,containers,setContainers,reserve,setReserve,products,onSave,onClose}){
  const [busy,setBusy]=useState(false);
  const [editingRemaining,setEditingRemaining]=useState(false);
  const cont=containers.find(c=>c.site===siteId&&c.productId.toString()===prod.id.toString());
  const presets=parseContainers(prod.containers);
  const pct=cont?Math.max(0,Math.min(100,(cont.remaining/cont.size)*100)):0;
  const gaugeColor=prod.color||T.orange;

  const doOpen=async(choice)=>{
    setBusy(true);
    await openContainerApi(caisseUrl,siteId,prod,choice,setContainers);
    setBusy(false);
  };
  const doClose=async()=>{
    if(!window.confirm(`Terminer ${cont.label} ? Il reste ${cont.remaining}${prod.unit}, cette quantité sera déduite du stock pour corriger l'écart.`))return;
    setBusy(true);
    await closeContainerApi(caisseUrl,siteId,prod,setContainers);
    setBusy(false);
  };
  const doAdjust=async(newRemaining)=>{
    if(isNaN(newRemaining)||newRemaining<0||!cont)return;
    const delta=newRemaining-cont.remaining;
    setBusy(true);
    // Reflet immédiat sur le stock local (le serveur ajuste pareil de son côté).
    if(delta!==0){
      const upd=products.map(p=>p.id!==prod.id?p:{...p,stock:{...p.stock,[siteId]:Math.max(0,(p.stock[siteId]||0)+delta)}});
      onSave(upd);
    }
    await adjustContainerApi(caisseUrl,siteId,prod,newRemaining,setContainers);
    setBusy(false);setEditingRemaining(false);
  };
  // Corrige directement le NOMBRE de contenants d'une taille donnée en réserve (pas
  // d'estimation à partir du stock en cl — que la vraie valeur saisie ici ou via
  // Entrée rapide).
  const doSetReserve=async(choice,newCount)=>{
    if(isNaN(newCount)||newCount<0)return;
    setBusy(true);
    const r=await apiWrite(caisseUrl,{action:"setReserveCount",site:siteId,id:prod.id,label:choice.label,size:choice.size,count:newCount});
    if(r.ok){
      setReserve(prev=>{
        const exists=prev.some(x=>x.site===siteId&&x.productId.toString()===prod.id.toString()&&x.label===choice.label&&x.size===choice.size);
        if(exists)return prev.map(x=>(x.site===siteId&&x.productId.toString()===prod.id.toString()&&x.label===choice.label&&x.size===choice.size)?{...x,count:newCount}:x);
        return[...prev,{site:siteId,productId:prod.id,label:choice.label,size:choice.size,count:newCount}];
      });
    }
    setBusy(false);
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
    onClick={e=>e.target===e.currentTarget&&onClose&&onClose()}>
    <div style={{background:"white",borderRadius:16,padding:"14px 16px",width:"100%",maxWidth:380,maxHeight:"85vh",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      {prod.photo?<img src={prod.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover"}}/>:<span style={{fontSize:26}}>{prod.emoji}</span>}
      <div style={{flex:1,marginLeft:10,fontSize:14,fontWeight:800,color:T.dark}}>{prod.name}</div>
      {onClose&&<button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:T.mid}}>✕</button>}
    </div>
    <div style={{fontSize:10,fontWeight:700,color:T.mid,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>🧴 Contenant</div>

    {/* Nombre de contenants en réserve, par taille — valeur réelle et modifiable
        directement, jamais une estimation calculée à partir du stock en cl. */}
    {presets.map((c,i)=>{
      const n=containerAvailable(reserve,0,siteId,prod.id,c.label,c.size);
      const isOpenOne=cont&&cont.label===c.label&&cont.size===c.size;
      return(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 0",borderBottom:i<presets.length-1?`1px solid ${T.border}`:"none"}}>
        <span style={{fontSize:12,color:T.dark,fontWeight:600}}>{c.label}</span>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <input type="number" min="0" key={prod.id+"_"+c.label+"_"+n} defaultValue={n}
            onBlur={e=>{const v=parseInt(e.target.value,10);if(!isNaN(v)&&v!==n)doSetReserve(c,v);}}
            onKeyDown={e=>{if(e.key==="Enter")e.target.blur();}}
            disabled={busy}
            style={{width:46,padding:"3px 5px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:12,textAlign:"center"}}/>
          <span style={{fontSize:10,color:T.mid}}>en stock</span>
          {!isOpenOne&&<button disabled={busy||n===0} onClick={()=>doOpen(c)}
            style={{padding:"5px 9px",background:n===0?"#ccc":T.green,color:"white",border:"none",borderRadius:7,cursor:(busy||n===0)?"default":"pointer",fontWeight:600,fontSize:11}}>
            Ouvrir
          </button>}
        </div>
      </div>);
    })}

    {cont&&<div style={{marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:12,fontWeight:700,color:T.dark}}>🔓 {cont.label} — ouvert</span>
        {editingRemaining?
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <input type="number" defaultValue={cont.remaining} autoFocus
              onBlur={e=>doAdjust(parseInt(e.target.value,10))}
              onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape")setEditingRemaining(false);}}
              style={{width:60,padding:"3px 6px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:12,textAlign:"center"}}/>
            <span style={{fontSize:11,color:T.mid}}>/{cont.size}{prod.unit}</span>
          </div>
          :<button onClick={()=>setEditingRemaining(true)} disabled={busy} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:T.blue,fontWeight:600}}>
            {cont.remaining}/{cont.size}{prod.unit} ✏️
          </button>}
      </div>
      <div style={{height:10,background:T.border,borderRadius:5,overflow:"hidden",marginBottom:6}}>
        <div style={{height:"100%",width:pct+"%",background:gaugeColor,transition:"width .3s"}}/>
      </div>
      <div style={{fontSize:10,color:T.mid,marginBottom:8}}>Ouvert le {cont.openedAt} — touchez le chiffre pour corriger directement la jauge</div>
      <button onClick={doClose} disabled={busy} style={{width:"100%",padding:"8px",background:busy?"#eee":T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:busy?"default":"pointer",fontWeight:600,fontSize:12,color:T.dark}}>
        {busy?"⏳...":"🏁 Terminer ce contenant"}
      </button>
    </div>}
    </div>
  </div>);
}

function StockList({products,sites,siteId,setSiteId,caisseUrl,onSave,containers,setContainers,reserve,setReserve}){
  const stockC=v=>v===0?"#FF3B30":v<=5?T.orange:v<=10?"#EAB308":T.green;
  const [containerModalFor,setContainerModalFor]=useState(null); // produit dont la popup contenant est ouverte
  const updateQty=async(prod,site,newQty)=>{
    const upd=products.map(p=>p.id!==prod.id?p:{...p,stock:{...p.stock,[site]:Math.max(0,newQty)}});
    onSave(upd);if(caisseUrl)await apiWrite(caisseUrl,{action:"updateStock",id:prod.id,site,qty:Math.max(0,newQty),mode:"set"});
  };
  const cats=[...new Set(products.map(p=>p.cat))];
  return(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{padding:"10px 14px",background:T.card,borderBottom:`1px solid ${T.border}`,display:"flex",gap:7,overflowX:"auto",flexShrink:0}}>
      {sites.map(s=><button key={s.id} onClick={()=>setSiteId(s.id)} style={{flexShrink:0,padding:"7px 14px",borderRadius:20,
        border:`2px solid ${siteId===s.id?s.color:T.border}`,background:siteId===s.id?s.color:T.card,
        color:siteId===s.id?"white":T.dark,fontWeight:600,fontSize:12,cursor:"pointer"}}>{s.name}</button>)}
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>
      {products.filter(p=>(p.stock[siteId]||0)<=5).length>0&&<div style={{background:"#FFF3E0",border:`1px solid ${T.orange}`,borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:13}}>
        ⚠️ {products.filter(p=>(p.stock[siteId]||0)<=5).length} produit(s) en stock faible
      </div>}
      {cats.map(cat=><div key={cat} style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:T.mid,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{cat}</div>
        <div style={{background:T.card,borderRadius:12,border:`1px solid ${T.border}`,overflow:"hidden"}}>
          {products.filter(p=>p.cat===cat).flatMap((prod,idx,arr)=>{
            const needsContainerPanel=prod.sellByVolume&&parseContainers(prod.containers).length>0;
            const cont=needsContainerPanel?containers.find(c=>c.site===siteId&&c.productId.toString()===prod.id.toString()):null;
            const gaugePct=cont?Math.max(0,Math.min(100,(cont.remaining/cont.size)*100)):0;
            const gaugeColor=prod.color||T.orange;
            const stk=prod.stock[siteId]||0;
            return [<div key={prod.id} style={{display:"flex",alignItems:"center",padding:"11px 14px",borderBottom:idx<arr.length-1&&!needsContainerPanel?`1px solid ${T.border}`:"none",gap:10}}>
              {needsContainerPanel
                ?<button onClick={()=>setContainerModalFor(prod)} style={{padding:0,border:`2px solid ${gaugeColor}`,borderRadius:8,cursor:"pointer",background:"none",flexShrink:0}}>
                  {prod.photo?<img src={prod.photo} style={{width:26,height:26,borderRadius:5,objectFit:"cover",display:"block"}}/>:<span style={{fontSize:20,display:"block",width:26,height:26,textAlign:"center",lineHeight:"26px"}}>{prod.emoji}</span>}
                </button>
                :(prod.photo?<img src={prod.photo} style={{width:28,height:28,borderRadius:6,objectFit:"cover",flexShrink:0}}/>
                  :<span style={{fontSize:22,flexShrink:0}}>{prod.emoji}</span>)}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{prod.name}</div>
                <div style={{fontSize:11,color:T.mid}}>{fmt(prod.price)}{prod.sellByVolume?" • au "+prod.unit:""}</div>
              </div>
              <div style={{display:"flex",gap:3,marginRight:6}}>
                {sites.map(s=><div key={s.id} title={s.name} style={{width:24,height:24,borderRadius:5,
                  background:s.id===siteId?s.color:"rgba(0,0,0,0.06)",
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,
                  color:s.id===siteId?"white":T.mid}}>{prod.stock[s.id]||0}</div>)}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <button onClick={()=>updateQty(prod,siteId,stk-1)} style={{width:24,height:24,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:14,flexShrink:0}}>−</button>
                <input key={prod.id+"_"+stk} type="number" defaultValue={stk}
                  onBlur={e=>{const v=parseInt(e.target.value,10);if(!isNaN(v)&&v!==stk)updateQty(prod,siteId,v);}}
                  onKeyDown={e=>{if(e.key==="Enter")e.target.blur();}}
                  style={{width:46,fontSize:14,fontWeight:800,textAlign:"center",color:stockC(stk),
                    border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 0",outline:"none",flexShrink:0}}/>
                <button onClick={()=>updateQty(prod,siteId,stk+1)} style={{width:24,height:24,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:14,flexShrink:0}}>+</button>
                <div title="Total tous sites" style={{width:40,height:24,borderRadius:5,marginLeft:4,flexShrink:0,
                  background:T.dark,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:"white"}}>
                  {Object.values(prod.stock||{}).reduce((a,b)=>a+(+b||0),0)}
                </div>
              </div>
            </div>,
            // Résumé compact du contenant : une jauge avec le texte écrit à
            // l'intérieur, cliquable pour ouvrir la popup de gestion complète —
            // prend beaucoup moins de place que l'ancien bloc toujours déplié.
            needsContainerPanel&&<button key={prod.id+"_cp"} onClick={()=>setContainerModalFor(prod)}
              style={{display:"block",width:"100%",padding:"0 14px 10px",border:"none",background:"none",cursor:"pointer",
                borderBottom:idx<arr.length-1?`1px solid ${T.border}`:"none",paddingBottom:10}}>
              <div style={{position:"relative",height:26,borderRadius:7,overflow:"hidden",background:T.bg,border:`1px solid ${T.border}`}}>
                {cont&&<div style={{position:"absolute",inset:0,width:gaugePct+"%",background:gaugeColor,opacity:.55}}/>}
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",gap:5,fontSize:11,fontWeight:700,color:T.dark}}>
                  <span>🧴</span>
                  <span>{cont?`${cont.label} — ${cont.remaining}/${cont.size}${prod.unit}`:"Aucun contenant ouvert — toucher pour gérer"}</span>
                </div>
              </div>
            </button>];
          })}
        </div>
      </div>)}
    </div>
    {containerModalFor&&<InlineContainerPanel prod={containerModalFor} siteId={siteId} caisseUrl={caisseUrl}
      containers={containers} setContainers={setContainers} reserve={reserve} setReserve={setReserve} products={products} onSave={onSave}
      onClose={()=>setContainerModalFor(null)}/>}
  </div>);
}

function StockEntry({products,sites,caisseUrl,onSave}){
  const videoRef=useRef(null);const readerRef=useRef(null);const camIdRef=useRef(null);
  const [scannedProd,setScannedProd]=useState(null);
  const [site,setSite]=useState(sites[0]?.id||"s1");
  const [qty,setQty]=useState("");const [msg,setMsg]=useState("");const [scanning,setScanning]=useState(false);
  const [contCounts,setContCounts]=useState({}); // label -> nombre de contenants reçus
  const [validating,setValidating]=useState(false); // anti double-clic
  const [search,setSearch]=useState(""); // recherche par nom, en plus du scan

  useEffect(()=>{if(scanning)startCam();return()=>stopCam();},[scanning]);
  const startCam=async(constraints)=>{
    // ZXing plutôt que l'API BarcodeDetector native, absente sur iPhone/iPad (Safari)
    // et peu fiable sur beaucoup d'Android — cause du scan qui s'ouvrait sans jamais détecter.
    if(!window.ZXing){setMsg("Caméra non disponible sur cet appareil — utilisez la liste ci-dessous");return;}
    try{
      const hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]);
      const reader=new ZXing.BrowserMultiFormatReader(hints);
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        constraints||getPreferredCameraConstraints()||SCANNER_VIDEO_CONSTRAINTS, videoRef.current,
        (result)=>{
          if(!result)return;
          stopCam();setScanning(false);
          const code=result.getText();
          const p=products.find(pr=>pr.barcode&&pr.barcode.toString()===code.trim());
          if(p){setScannedProd(p);setContCounts({});}else setMsg("⚠ Produit non trouvé: "+code);
        }
      );
      const track=videoRef.current?.srcObject?.getVideoTracks?.()[0];
      if(track)camIdRef.current=track.getSettings().deviceId;
    }catch{setMsg("Caméra non disponible");LS.set("anf87_preferred_camera",null);}
  };
  const stopCam=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };

  const validate=async()=>{
    if(!scannedProd||!qty||validating)return;
    setValidating(true);
    const newQty=(scannedProd.stock[site]||0)+(+qty);
    const upd=products.map(p=>p.id!==scannedProd.id?p:{...p,stock:{...p.stock,[site]:newQty}});
    onSave(upd);
    if(caisseUrl)await apiWrite(caisseUrl,{action:"updateStock",id:scannedProd.id,site,qty:+qty,mode:"delta"});
    // Si le total vient du tableau de contenants (Nombre par taille), on enregistre
    // AUSSI la réserve précise de chaque type reçu — pour que l'écran Contenants
    // sache exactement combien de fûts/bouteilles/cubis de CHAQUE taille il reste,
    // plutôt qu'un calcul dérivé du stock total (faux si les tailles sont mélangées).
    if(scannedProd.sellByVolume&&caisseUrl){
      const presets=parseContainers(scannedProd.containers);
      for(const c of presets){
        const n=parseInt(contCounts[c.label])||0;
        if(n>0)await apiWrite(caisseUrl,{action:"addToReserve",site,id:scannedProd.id,label:c.label,size:c.size,count:n});
      }
    }
    setMsg(`✅ +${qty} ${scannedProd.name} sur ${sites.find(s=>s.id===site)?.name}`);
    setScannedProd(null);setQty("");setContCounts({});setValidating(false);
    setTimeout(()=>setMsg(""),3000);
  };

  return(<div style={{flex:1,overflowY:"auto",padding:"14px"}}>
    <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:14}}>📥 Entrée rapide de stock</div>
    {/* Scan */}
    {scanning?(<div style={{marginBottom:14}}>
      <video ref={videoRef} onClick={()=>refocusVideo(videoRef.current)} style={{width:"100%",height:180,objectFit:"cover",borderRadius:12,background:"#000",cursor:"pointer"}} muted playsInline/>
      <div style={{fontSize:10,color:T.mid,textAlign:"center",marginTop:2}}>Image floue ? Touchez-la pour refaire la mise au point</div>
      <div style={{display:"flex",gap:6,marginTop:6}}>
        <button onClick={()=>switchCamera(videoRef.current,readerRef,camIdRef,startCam)} style={{flex:1,padding:"8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12}}>🔄 Autre caméra</button>
        <button onClick={()=>{stopCam();setScanning(false);}} style={{flex:1,padding:"8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:13}}>Annuler</button>
      </div>
    </div>):(
      <button onClick={()=>setScanning(true)} style={{width:"100%",padding:"14px",background:T.dark,color:"white",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:14,marginBottom:10}}>
        📷 Scanner le code-barres produit
      </button>
    )}
    {!scanning&&<>
      <div style={{fontSize:12,color:T.mid,textAlign:"center",margin:"6px 0 10px"}}>— ou choisir dans la liste / taper le nom du produit —</div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un produit…"
        style={{width:"100%",padding:"12px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:14,marginBottom:8,outline:"none",color:T.dark}}/>
      <div style={{maxHeight:260,overflowY:"auto",border:`1px solid ${T.border}`,borderRadius:10,marginBottom:14}}>
        {products.filter(p=>p.name.toLowerCase().includes(search.trim().toLowerCase())).map(p=>(
          <button key={p.id} onClick={()=>{setScannedProd(p);setMsg("");setContCounts({});setSearch("");}}
            style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"9px 12px",background:"white",border:"none",
              borderBottom:`1px solid ${T.border}`,cursor:"pointer",textAlign:"left"}}>
            {p.photo?<img src={p.photo} style={{width:32,height:32,borderRadius:7,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{p.emoji}</span>}
            <span style={{fontSize:13,color:T.dark}}>{p.name}</span>
          </button>
        ))}
        {products.filter(p=>p.name.toLowerCase().includes(search.trim().toLowerCase())).length===0&&
          <div style={{padding:"12px",fontSize:13,color:T.mid,textAlign:"center"}}>Aucun produit trouvé</div>}
      </div>
    </>}
    {msg&&<div style={{background:msg.startsWith("✅")?"#E8F5E9":"#FFF3E0",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:14,fontWeight:600,color:msg.startsWith("✅")?"#2E7D32":T.orange}}>{msg}</div>}
    {/* Produit trouvé */}
    {scannedProd&&<div style={{background:T.card,borderRadius:14,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        {scannedProd.photo?<img src={scannedProd.photo} style={{width:44,height:44,borderRadius:10,objectFit:"cover"}}/>:<span style={{fontSize:30}}>{scannedProd.emoji}</span>}
        <div><div style={{fontWeight:700,fontSize:15,color:T.dark}}>{scannedProd.name}</div>
          <div style={{fontSize:12,color:T.mid}}>{fmt(scannedProd.price)}</div></div>
      </div>
      <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Site de destination</label>
      <select value={site} onChange={e=>setSite(e.target.value)} style={{width:"100%",padding:"11px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:14,marginBottom:12,outline:"none"}}>
        {sites.map(s=><option key={s.id} value={s.id}>{s.name} (stock actuel: {scannedProd.stock[s.id]||0})</option>)}
      </select>
      {scannedProd.sellByVolume&&parseContainers(scannedProd.containers).length>0&&(()=>{
        const presets=parseContainers(scannedProd.containers);
        const total=presets.reduce((s,c)=>s+(parseInt(contCounts[c.label])||0)*c.size,0);
        return(<div style={{marginBottom:12}}>
          <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Contenants reçus (calcule automatiquement les cl)</label>
          <div style={{border:`1px solid ${T.border}`,borderRadius:10,overflow:"hidden",marginBottom:8}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 70px 70px",background:T.bg,padding:"6px 10px",fontSize:11,fontWeight:700,color:T.mid}}>
              <span>Contenant</span><span style={{textAlign:"center"}}>Nombre</span><span style={{textAlign:"right"}}>= cl</span>
            </div>
            {presets.map((c,i)=>(<div key={i} style={{display:"grid",gridTemplateColumns:"1fr 70px 70px",alignItems:"center",padding:"7px 10px",borderTop:`1px solid ${T.border}`}}>
              <span style={{fontSize:13,color:T.dark}}>{c.label} <span style={{color:T.mid,fontSize:11}}>({c.size}cl)</span></span>
              <input type="number" min="0" value={contCounts[c.label]||""} onChange={e=>setContCounts({...contCounts,[c.label]:e.target.value})}
                style={{width:"100%",padding:"5px",border:`1px solid ${T.border}`,borderRadius:6,textAlign:"center",fontSize:13}}/>
              <span style={{textAlign:"right",fontSize:13,fontWeight:600,color:T.dark}}>{(parseInt(contCounts[c.label])||0)*c.size}</span>
            </div>))}
          </div>
          <button disabled={total<=0} onClick={()=>{setQty(String(total));}}
            style={{width:"100%",padding:"10px",background:total>0?T.blue:"#ccc",color:"white",border:"none",borderRadius:9,cursor:total>0?"pointer":"default",fontWeight:700,fontSize:13}}>
            Utiliser ce total : {total}cl
          </button>
        </div>);
      })()}
      <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Quantité reçue{scannedProd.sellByVolume?" (cl, ou via le tableau ci-dessus)":""}</label>
      <input value={qty} onChange={e=>setQty(e.target.value)} type="number" min="1" placeholder="Ex: 24"
        style={{width:"100%",padding:"14px",fontSize:20,fontWeight:700,border:`2px solid ${T.border}`,borderRadius:10,marginBottom:12,outline:"none",textAlign:"right"}}/>
      <button onClick={validate} disabled={!qty||validating} style={{width:"100%",padding:"14px",background:validating?"#ccc":(qty?T.green:"#ccc"),color:"white",border:"none",borderRadius:12,cursor:validating?"default":"pointer",fontWeight:700,fontSize:15}}>
        {validating?"⏳ Validation...":"✓ Valider l'entrée"}
      </button>
    </div>}
  </div>);
}

function StockTransfer({products,sites,caisseUrl,onSave,reserve,setReserve}){
  const [from,setFrom]=useState(sites[0]?.id||"s1");
  const [to,setTo]=useState(sites[1]?.id||"s2");
  const [qtys,setQtys]=useState({});
  const [contCounts,setContCounts]=useState({}); // {productId: {labelContenant: nombre}}
  const [msg,setMsg]=useState("");
  const [transferring,setTransferring]=useState(false); // affiche l'animation le temps du transfert
  const fromSite=sites.find(s=>s.id===from), toSite=sites.find(s=>s.id===to);

  // Transfert par contenant (ex: 2 Fûts 20L) : recalcule automatiquement le total en
  // cl/g à partir du nombre de contenants de chaque taille, et l'applique au champ
  // quantité — pas besoin de faire le calcul soi-même.
  const setContainerCount=(p,label,val)=>{
    const newCount=Math.max(0,+val||0);
    const productCounts={...(contCounts[p.id]||{}),[label]:newCount};
    const allPresets=parseContainers(p.containers);
    const total=allPresets.reduce((s,c)=>s+((+productCounts[c.label]||0)*c.size),0);
    setContCounts(prev=>({...prev,[p.id]:productCounts}));
    setQtys(q=>({...q,[p.id]:Math.min(p.stock[from]||0,total)}));
  };

  const transfer=async()=>{
    const items=Object.entries(qtys).filter(([_,q])=>+q>0).map(([id,q])=>({id,qty:+q}));
    if(!items.length||transferring)return;
    setTransferring(true);
    const upd=products.map(p=>{const q=+qtys[p.id]||0;if(!q)return p;
      return{...p,stock:{...p.stock,[from]:Math.max(0,(p.stock[from]||0)-q),[to]:(p.stock[to]||0)+q}};});
    onSave(upd);
    if(caisseUrl){
      await apiWrite(caisseUrl,{action:"transferStock",from,to,items:JSON.stringify(items)});
      // Transfère aussi le nombre de contenants en réserve (pas seulement la
      // quantité en cl/g) : sans ça, "Ouvrir un fût" restait faussé sur les deux
      // sites après un transfert par contenant.
      for(const[pid,counts]of Object.entries(contCounts)){
        const prod=products.find(p=>p.id.toString()===pid.toString());
        if(!prod)continue;
        const allPresets=parseContainers(prod.containers);
        for(const c of allPresets){
          const n=+counts[c.label]||0;
          if(n<=0)continue;
          await apiWrite(caisseUrl,{action:"addToReserve",site:from,id:pid,label:c.label,size:c.size,count:-n});
          await apiWrite(caisseUrl,{action:"addToReserve",site:to,id:pid,label:c.label,size:c.size,count:n});
          setReserve&&setReserve(prev=>{
            let next=prev.slice();
            const applyDelta=(site,delta)=>{
              const idx=next.findIndex(r=>r.site===site&&r.productId.toString()===pid.toString()&&r.label===c.label&&r.size===c.size);
              if(idx>=0)next[idx]={...next[idx],count:Math.max(0,next[idx].count+delta)};
              else next.push({site,productId:pid,label:c.label,size:c.size,count:Math.max(0,delta)});
            };
            applyDelta(from,-n);applyDelta(to,n);
            return next;
          });
        }
      }
    }
    // On laisse le temps à l'animation (camion qui traverse) de se terminer visuellement
    // avant d'afficher la confirmation, plutôt que de la couper en plein milieu.
    setTimeout(()=>{
      setTransferring(false);
      setMsg(`✅ Transfert effectué: ${items.length} produit(s) de ${fromSite?.name} vers ${toSite?.name}`);
      setQtys({});setContCounts({});setTimeout(()=>setMsg(""),4000);
    },1300);
  };

  return(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    {/* En-tête FIXE : sites, bouton et animation restent toujours visibles, même en
        ayant fait défiler la liste des produits en dessous — avant ce correctif,
        l'animation (en haut) et le bouton (en bas de liste) n'étaient jamais visibles
        en même temps. */}
    <div style={{flexShrink:0,padding:"14px 14px 10px",borderBottom:`1px solid ${T.border}`,background:T.bg}}>
      <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:12}}>↔ Transfert multi-produits</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        {[["De (source)",from,setFrom,fromSite],["Vers (dest.)",to,setTo,toSite]].map(([label,val,setter,s],i)=>(
          <div key={i}>
            <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:5}}>{label}</label>
            <select value={val} onChange={e=>setter(e.target.value)}
              style={{width:"100%",padding:"10px",border:`1px solid ${s?.color||T.border}`,borderRadius:10,fontSize:13,outline:"none",
                background:s?.color||T.card,color:s?.color?"white":T.dark,fontWeight:s?.color?700:400}}>
              {sites.map(st=><option key={st.id} value={st.id} style={{background:"white",color:T.dark}}>{st.name}</option>)}
            </select>
          </div>
        ))}
      </div>
      {msg&&<div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:13,fontWeight:600,color:"#2E7D32"}}>{msg}</div>}
      {/* Bouton avec l'animation directement à l'intérieur — toujours au même endroit
          que le clic, plus besoin de chercher où regarde le camion. */}
      <button onClick={transfer} disabled={!Object.values(qtys).some(q=>+q>0)||transferring}
        style={{position:"relative",width:"100%",padding:"14px",overflow:"hidden",
          background:transferring?T.dark:(Object.values(qtys).some(q=>+q>0)?T.red:"#ccc"),color:"white",
          border:"none",borderRadius:12,cursor:transferring?"default":"pointer",fontWeight:700,fontSize:15}}>
        {transferring?<>
          <span style={{opacity:.7,fontSize:11}}>{fromSite?.name} → {toSite?.name}</span>
          <span className="transfer-truck">🚚</span>
        </>:"↔ Effectuer le transfert"}
      </button>
    </div>

    <div style={{flex:1,overflowY:"auto",padding:14}}>
      <div style={{fontWeight:700,fontSize:13,color:T.mid,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Quantités à transférer</div>
      {products.map(p=>{
        const avail=p.stock[from]||0;if(avail===0)return null;
        const presets=p.sellByVolume?parseContainers(p.containers):[];
        return(<div key={p.id} style={{background:T.card,borderRadius:10,border:`1px solid ${T.border}`,marginBottom:7,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px"}}>
            {p.photo?<img src={p.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{p.emoji}</span>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
              <div style={{fontSize:11,color:T.mid}}>Dispo: {avail}{p.sellByVolume?p.unit||"cl":""}</div>
            </div>
            <input value={qtys[p.id]||""} onChange={e=>{setQtys(q=>({...q,[p.id]:Math.min(avail,Math.max(0,+e.target.value||0))}));setContCounts(c=>({...c,[p.id]:{}}));}}
              type="number" min="0" max={avail} placeholder="0"
              style={{width:60,padding:"7px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:14,fontWeight:700,textAlign:"center",outline:"none"}}/>
          </div>
          {/* Transfert par contenant (ex: 2 Fûts 20L) — calcule automatiquement
              l'équivalent en cl/g dans le champ quantité ci-dessus, ET affiche le
              nombre actuellement en réserve sur le site source. */}
          {presets.length>0&&<div style={{padding:"0 14px 10px",display:"flex",flexWrap:"wrap",gap:8}}>
            {presets.map((c,i)=>{
              const avail_n=containerAvailable(reserve,0,from,p.id,c.label,c.size);
              return(<div key={i} style={{display:"flex",alignItems:"center",gap:5,background:T.bg,borderRadius:7,padding:"4px 8px"}}>
                <span style={{fontSize:11,color:T.mid}}>{c.label} <b style={{color:T.dark}}>({avail_n} dispo)</b></span>
                <input type="number" min="0" max={avail_n} value={contCounts[p.id]?.[c.label]||""} placeholder="0"
                  onChange={e=>setContainerCount(p,c.label,Math.min(avail_n,+e.target.value||0))}
                  style={{width:38,padding:"2px 4px",border:`1px solid ${T.border}`,borderRadius:5,fontSize:12,textAlign:"center"}}/>
              </div>);
            })}
          </div>}
        </div>);
      })}
    </div>
  </div>);
}

// ═══ REPORTS ═══
function ReportsScreen({sites,caisseUrl,products,setCart,setTab,onSaveProducts}){
  const [sales,setSales]=useState([]);const [loading,setLoading]=useState(false);const [period,setPeriod]=useState("today");
  const [viewMonth,setViewMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [selectedDay,setSelectedDay]=useState(null); // "dd/mm/yyyy" sélectionné dans le calendrier
  const [openSale,setOpenSale]=useState(null); // vente dont on affiche le détail
  const pad2=n=>String(n).padStart(2,"0");
  const todayD=new Date();
  const today=`${pad2(todayD.getDate())}/${pad2(todayD.getMonth()+1)}/${todayD.getFullYear()}`;
  useEffect(()=>{loadSales();},[]);
  const loadSales=async()=>{if(!caisseUrl)return;setLoading(true);
    const r=await api(caisseUrl,{action:"getSales"});if(r.ok)setSales(r.sales||[]);setLoading(false);};

  // Total € par jour (clé "dd/mm/yyyy"), pour l'affichage dans le calendrier.
  const totalsByDay=(()=>{
    const map={};
    sales.forEach(s=>{ map[s.date]=(map[s.date]||0)+(+s.total||0); });
    return map;
  })();

  const filtered=period==="today"?sales.filter(s=>s.date===today)
    :period==="calendar"&&selectedDay?sales.filter(s=>s.date===selectedDay)
    :period==="all"?sales:[];
  const totalCA=filtered.reduce((a,s)=>a+(+s.total||0),0);
  const bySite=sites.map(s=>({...s,ca:filtered.filter(v=>v.siteId===s.id).reduce((a,v)=>a+(+v.total||0),0),nb:filtered.filter(v=>v.siteId===s.id).length}));

  // Grille du mois affiché (calendrier)
  const calDays=(()=>{
    const {y,m}=viewMonth;
    const first=new Date(y,m,1);
    const startOffset=(first.getDay()+6)%7; // lundi=0
    const daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<startOffset;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    return cells;
  })();
  const monthLabel=new Date(viewMonth.y,viewMonth.m,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const dateKeyFor=d=>`${pad2(d)}/${pad2(viewMonth.m+1)}/${viewMonth.y}`;

  const reorder=sale=>{
    let items=[]; try{items=JSON.parse(sale.items||"[]");}catch{}
    const newCart=items.map(it=>{
      const prod=products.find(p=>p.id.toString()===it.id.toString());
      if(!prod)return null;
      // Pour un produit vendu au volume, it.qty stocké dans la vente est le total de
      // cl consommés (ex: 644cl), PAS un nombre d'unités — le prix du produit, lui,
      // est par portion de base (ex: 2,50€ les 25cl). Les traiter comme un simple
      // nombre d'unités multipliait le prix par le nombre de cl (644× au lieu de
      // ramener au cl d'abord) — d'où le montant totalement aberrant constaté.
      if(prod.sellByVolume){
        const vol=+it.qty||0;
        const unitPrice=(prod.price||0)/(prod.baseQty||1);
        return{id:prod.id+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),pid:prod.id,
          name:prod.name+" "+vol+(prod.unit||"cl"),price:+(unitPrice*vol).toFixed(2),qty:1,vol:vol,
          emoji:prod.emoji,photo:prod.photo,drink:prod.drink,free:false,unit:prod.unit||"cl"};
      }
      return{id:prod.id,pid:prod.id,name:prod.name,price:prod.price,qty:it.qty,emoji:prod.emoji,photo:prod.photo,drink:prod.drink,free:false,unit:"unité"};
    }).filter(Boolean);
    if(newCart.length===0){window.alert("⚠️ Aucun des produits de cette commande n'existe encore dans le catalogue.");return;}
    setCart(newCart);setTab("pos");setOpenSale(null);
  };

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
      <div style={{display:"flex",gap:7}}>
        {[["today","Aujourd'hui"],["calendar","📅 Calendrier"],["all","Tout"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setPeriod(v);if(v!=="calendar")setSelectedDay(null);}} style={{padding:"6px 14px",borderRadius:20,border:"none",
            background:period===v?T.red:T.card,color:period===v?"white":T.dark,fontSize:12,fontWeight:600,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
            {l}
          </button>
        ))}
      </div>
      <button onClick={loadSales} style={{padding:"6px 12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>{loading?"⏳":"↻"}</button>
    </div>
    {!caisseUrl&&<div style={{background:"#FFF3E0",borderRadius:10,padding:14,fontSize:13,marginBottom:12}}>⚙️ Configurez l'URL Apps Script dans Config.</div>}

    {period==="calendar"&&<>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <button onClick={()=>setViewMonth(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1})} style={{padding:"6px 12px",background:T.card,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:14}}>◀</button>
        <div style={{fontWeight:700,fontSize:14,color:T.dark,textTransform:"capitalize"}}>{monthLabel}</div>
        <button onClick={()=>setViewMonth(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1})} style={{padding:"6px 12px",background:T.card,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:14}}>▶</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {["L","M","M","J","V","S","D"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,color:T.mid,fontWeight:700}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:16}}>
        {calDays.map((d,i)=>{
          if(d===null)return <div key={i}/>;
          const key=dateKeyFor(d);
          const dayTotal=totalsByDay[key]||0;
          const isToday=key===today;
          const isSelected=key===selectedDay;
          return(<button key={i} onClick={()=>setSelectedDay(key)}
            style={{aspectRatio:"1",borderRadius:8,border:`1.5px solid ${isSelected?T.red:isToday?T.dark:T.border}`,
              background:isSelected?T.red:dayTotal>0?"#FFF3E0":T.card,cursor:"pointer",padding:2,
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:11,fontWeight:isToday?800:600,color:isSelected?"white":T.dark}}>{d}</span>
            {dayTotal>0&&<span style={{fontSize:8,fontWeight:700,color:isSelected?"white":T.orange}}>{fmt(dayTotal)}</span>}
          </button>);
        })}
      </div>
      {!selectedDay&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:20}}>Touchez un jour pour voir ses ventes.</div>}
    </>}

    {(period!=="calendar"||selectedDay)&&<>
      <div style={{background:T.red,borderRadius:14,padding:"18px 16px",marginBottom:14,color:"white"}}>
        <div style={{fontSize:11,opacity:.75,marginBottom:2}}>{period==="calendar"?selectedDay:"CHIFFRE D'AFFAIRES"}</div>
        <div style={{fontSize:36,fontWeight:900}}>{fmt(totalCA)}</div>
        <div style={{fontSize:12,opacity:.65}}>{filtered.length} vente(s)</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {bySite.map(s=><div key={s.id} style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:s.color,display:"inline-block"}}/>
            <span style={{fontSize:11,fontWeight:600,color:T.mid}}>{s.name}</span>
          </div>
          <div style={{fontSize:20,fontWeight:800,color:T.dark}}>{fmt(s.ca)}</div>
          <div style={{fontSize:11,color:T.mid}}>{s.nb} vente(s)</div>
        </div>)}
      </div>
      {filtered.slice(0,50).map(tx=>{
        let payType=null; try{payType=JSON.parse(tx.payment||"{}").type;}catch{}
        const isMatchOffert=payType==="matchOffert";
        return(<button key={tx.id} onClick={()=>setOpenSale(tx)} style={{width:"100%",textAlign:"left",background:isMatchOffert?"#E8F5E9":T.card,borderRadius:10,padding:"10px 14px",marginBottom:6,border:`1px solid ${isMatchOffert?"#A5D6A7":T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <div><div style={{fontSize:13,fontWeight:600,color:T.dark}}>{tx.time} • {sites.find(s=>s.id===tx.siteId)?.name||tx.siteId}</div>
          <div style={{fontSize:11,color:T.mid}}>{tx.caissier&&"👤 "+tx.caissier}{tx.member&&" • 🍺 "+tx.member}{isMatchOffert&&" • ⚽ Offert match"}</div></div>
        <div style={{fontWeight:800,color:isMatchOffert?T.green:T.red,fontSize:15}}>{isMatchOffert?"Offert":fmt(+tx.total)}</div>
      </button>);})}
    </>}

    {openSale&&<SaleDetailModal sale={openSale} sites={sites} products={products} caisseUrl={caisseUrl} onSaveProducts={onSaveProducts}
      onClose={()=>setOpenSale(null)} onReorder={reorder}
      onSaleUpdated={updated=>{ setSales(prev=>prev.map(s=>s.id===updated.id?{...s,...updated}:s)); setOpenSale(updated); }}
      onSaleDeleted={id=>{ setSales(prev=>prev.filter(s=>s.id!==id)); setOpenSale(null); }}/>}
  </div>);
}

// ═══ DÉTAIL D'UNE VENTE (avec photos des produits, et reprise en panier) ═══
function SaleDetailModal({sale,sites,products,caisseUrl,onSaveProducts,onClose,onReorder,onSaleUpdated,onSaleDeleted}){
  const [editMode,setEditMode]=useState(false);
  const [saving,setSaving]=useState(false);
  let items=[]; try{items=JSON.parse(sale.items||"[]");}catch{}
  const lines=items.map(it=>({...it,prod:products.find(p=>p.id.toString()===it.id.toString())}));
  const [editedQtys,setEditedQtys]=useState(()=>Object.fromEntries(lines.map((l,i)=>[i,l.qty])));
  let payType=null,payDetail=null; try{const pj=JSON.parse(sale.payment||"{}");payType=pj.type;payDetail=pj;}catch{}
  const [editedPayment,setEditedPayment]=useState(payType||"cash");
  const payLabel={cash:"💵 Espèces",cb:"💳 Carte Bleue",check:"📝 Chèque",split:"🔢 Note divisée",matchOffert:"⚽ Offert match",free_drinks:"🍺 Boissons offertes"}[payType]||"—";
  const paySimpleOptions=[["cash","💵 Espèces"],["cb","💳 Carte Bleue"],["check","📝 Chèque"],["matchOffert","⚽ Offert match"]];

  // Prix d'une ligne au tarif ACTUEL du catalogue : pour un produit au volume, qty
  // représente des cl (pas un nombre d'unités) — même logique que "Recommencer cette
  // commande", pour ne jamais reproduire l'erreur de calcul déjà rencontrée.
  const lineTotal=(prod,qty)=>{
    if(!prod)return 0;
    if(prod.sellByVolume)return((prod.price||0)/(prod.baseQty||1))*qty;
    return(prod.price||0)*qty;
  };
  const editedTotal=lines.reduce((s,l,i)=>s+lineTotal(l.prod,+editedQtys[i]||0),0);

  const startEdit=()=>{setEditedQtys(Object.fromEntries(lines.map((l,i)=>[i,l.qty])));setEditMode(true);};

  const saveEdits=async()=>{
    if(saving)return;setSaving(true);
    // Nouveau détail (on retire les lignes ramenées à 0) + nouveau total au tarif actuel.
    const newItems=lines.map((l,i)=>({id:l.id,qty:+editedQtys[i]||0})).filter(it=>it.qty>0);
    // Si le nouveau mode de paiement est "Offert match", le total devient 0€ — comme
    // pour n'importe quelle vente de ce type (le stock, lui, reste bien décompté).
    const newTotal=editedPayment==="matchOffert"?0:+editedTotal.toFixed(2);
    const nbItems=newItems.reduce((s,it)=>s+it.qty,0);

    // Écart de stock par produit : ce qui a changé entre l'ancien et le nouveau
    // contenu doit être répercuté sur le stock du SITE de cette vente (pas forcément
    // le site actuellement sélectionné dans l'appli).
    const deltaByProduct={};
    lines.forEach((l,i)=>{ deltaByProduct[l.id]=(deltaByProduct[l.id]||0)+((+l.qty||0)-(+editedQtys[i]||0)); });
    const deltaEntries=Object.entries(deltaByProduct).filter(([_,d])=>d!==0);

    if(caisseUrl){
      const newPayment=JSON.stringify(editedPayment==="matchOffert"?{type:"matchOffert"}:{type:editedPayment});
      const r=await apiWrite(caisseUrl,{action:"updateSale",id:sale.id,total:newTotal,items:JSON.stringify(newItems),nbItems,payment:newPayment});
      if(!r.ok){window.alert("⚠️ Échec de l'enregistrement : "+(r.error||"connexion")+". Rien n'a été modifié.");setSaving(false);return;}
      for(const[pid,delta]of deltaEntries){
        await apiWrite(caisseUrl,{action:"updateStock",id:pid,site:sale.siteId,qty:delta,mode:"delta"});
      }
    }
    // Reflet local immédiat du stock (le delta positif = on rend du stock, négatif = on en reprend).
    if(deltaEntries.length&&onSaveProducts){
      const upd=products.map(p=>{
        const d=deltaByProduct[p.id];
        if(!d)return p;
        return{...p,stock:{...p.stock,[sale.siteId]:Math.max(0,(p.stock[sale.siteId]||0)+d)}};
      });
      onSaveProducts(upd);
    }
    setSaving(false);setEditMode(false);
    onSaleUpdated&&onSaleUpdated({id:sale.id,total:newTotal,items:JSON.stringify(newItems),payment:JSON.stringify(editedPayment==="matchOffert"?{type:"matchOffert"}:{type:editedPayment})});
  };

  // Suppression complète de la vente : tous les articles qu'elle contenait sont
  // remis en stock (site d'origine) avant de supprimer la ligne — sinon le stock
  // resterait décompté pour une vente qui n'existe plus.
  const deleteSale=async()=>{
    if(saving)return;
    if(!window.confirm(`Supprimer définitivement cette vente du ${sale.date} ${sale.time} (${fmt(+sale.total)}) ?\n\nLe stock des articles qu'elle contenait sera remis en stock sur ${sites.find(s=>s.id===sale.siteId)?.name||sale.siteId}.`))return;
    setSaving(true);
    if(caisseUrl){
      for(const it of items){
        if(!it.id||!it.qty)continue;
        await apiWrite(caisseUrl,{action:"updateStock",id:it.id,site:sale.siteId,qty:+it.qty,mode:"delta"});
      }
      const r=await apiWrite(caisseUrl,{action:"deleteSale",id:sale.id});
      if(!r.ok){window.alert("⚠️ Échec de la suppression : "+(r.error||"connexion"));setSaving(false);return;}
    }
    if(onSaveProducts){
      const deltaByProduct={};
      items.forEach(it=>{ if(it.id&&it.qty)deltaByProduct[it.id]=(deltaByProduct[it.id]||0)+(+it.qty); });
      const upd=products.map(p=>{
        const d=deltaByProduct[p.id];
        if(!d)return p;
        return{...p,stock:{...p.stock,[sale.siteId]:(p.stock[sale.siteId]||0)+d}};
      });
      onSaveProducts(upd);
    }
    setSaving(false);
    onSaleDeleted&&onSaleDeleted(sale.id);
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:230,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}
    onClick={e=>e.target===e.currentTarget&&!saving&&onClose()}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
        <div>
          <div style={{fontWeight:800,fontSize:17,color:T.dark}}>{sale.date} — {sale.time}</div>
          <div style={{fontSize:12,color:T.mid}}>{sites.find(s=>s.id===sale.siteId)?.name||sale.siteId} • {payLabel}</div>
        </div>
        {!saving&&<button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:T.mid}}>✕</button>}
      </div>
      {sale.caissier&&<div style={{fontSize:11,color:T.mid,marginBottom:2}}>👤 Caissier : {sale.caissier}</div>}
      {sale.member&&<div style={{fontSize:11,color:T.mid,marginBottom:10}}>🍺 Boissons offertes à : {sale.member}</div>}
      {editMode&&<div style={{background:"#FFF3E0",borderRadius:8,padding:"8px 10px",marginTop:8,marginBottom:4,fontSize:11,color:"#E65100"}}>
        ✏️ Modification de cette vente — la date et l'heure d'origine sont conservées. Le total est recalculé au tarif actuel du catalogue.
      </div>}
      {editMode&&<div style={{marginTop:10}}>
        <label style={{fontSize:11,fontWeight:700,color:T.mid,textTransform:"uppercase",display:"block",marginBottom:6}}>Mode de paiement</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
          {paySimpleOptions.map(([v,l])=>(
            <button key={v} onClick={()=>setEditedPayment(v)} disabled={saving}
              style={{padding:"9px 6px",borderRadius:8,border:`1.5px solid ${editedPayment===v?T.blue:T.border}`,
                background:editedPayment===v?"#EEF0FF":T.card,color:editedPayment===v?T.blue:T.dark,cursor:saving?"default":"pointer",fontWeight:600,fontSize:12}}>
              {l}
            </button>
          ))}
        </div>
      </div>}

      <div style={{marginTop:12,marginBottom:12}}>
        {lines.length===0&&<div style={{fontSize:12,color:T.mid,fontStyle:"italic"}}>Détail des articles non disponible pour cette vente.</div>}
        {lines.map((l,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
            {l.prod?.photo?<img src={l.prod.photo} style={{width:38,height:38,borderRadius:8,objectFit:"cover",flexShrink:0}}/>
              :<span style={{fontSize:24,flexShrink:0}}>{l.prod?.emoji||"❓"}</span>}
            <div style={{flex:1,fontSize:13,color:T.dark}}>{l.prod?.name||"(produit supprimé, ID "+l.id+")"}</div>
            {editMode
              ?<div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" min="0" value={editedQtys[i]} disabled={!l.prod||saving}
                  onChange={e=>setEditedQtys(q=>({...q,[i]:Math.max(0,+e.target.value||0)}))}
                  style={{width:64,padding:"5px 6px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:13,textAlign:"center"}}/>
                {l.prod?.sellByVolume&&<span style={{fontSize:11,color:T.mid}}>{l.prod.unit||"cl"}</span>}
              </div>
              :<div style={{fontSize:13,fontWeight:700,color:T.dark}}>×{l.qty}</div>}
          </div>
        ))}
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:T.bg,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
        <span style={{fontSize:13,fontWeight:700,color:T.dark}}>Total{editMode?" (recalculé)":""}</span>
        <span style={{fontSize:20,fontWeight:900,color:T.red}}>{fmt(editMode?editedTotal:+sale.total)}</span>
      </div>

      {editMode?<>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <button onClick={()=>setEditMode(false)} disabled={saving} style={{flex:1,padding:"12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:saving?"default":"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={saveEdits} disabled={saving} style={{flex:2,padding:"12px",background:saving?"#ccc":T.green,color:"white",border:"none",borderRadius:10,cursor:saving?"default":"pointer",fontWeight:700}}>
            {saving?"⏳ Enregistrement...":"💾 Enregistrer les modifications"}
          </button>
        </div>
        <div style={{fontSize:10,color:T.mid,textAlign:"center"}}>Le stock est ajusté automatiquement selon l'écart avec la vente d'origine.</div>
      </>:<>
        <button onClick={startEdit} style={{width:"100%",padding:"12px",background:"#FF9F0A",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:14,marginBottom:8}}>
          ✏️ Modifier cette vente (même date)
        </button>
        <button onClick={()=>onReorder(sale)} disabled={lines.length===0}
          style={{width:"100%",padding:"12px",background:lines.length===0?"#ccc":T.blue,color:"white",border:"none",borderRadius:10,cursor:lines.length===0?"default":"pointer",fontWeight:700,fontSize:14,marginBottom:8}}>
          🔄 Recommencer cette commande (nouveau panier)
        </button>
        <div style={{fontSize:10,color:T.mid,textAlign:"center",marginBottom:10}}>Remet les mêmes produits dans le panier (aux prix actuels) — n'enregistre rien tant que vous n'encaissez pas.</div>
        <button onClick={deleteSale} disabled={saving} style={{width:"100%",padding:"11px",background:saving?"#eee":"#FFF0F0",border:"1px solid #FFCDD2",borderRadius:10,cursor:saving?"default":"pointer",fontWeight:700,fontSize:13,color:T.red,marginBottom:8}}>
          {saving?"⏳...":"🗑 Supprimer cette vente (remet le stock)"}
        </button>
        <button onClick={onClose} disabled={saving} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:saving?"default":"pointer",fontWeight:600}}>Fermer</button>
      </>}
    </div>
  </div>);
}
