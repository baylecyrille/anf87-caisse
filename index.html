// ═══ API ═══
// Paliers de vente au volume : "25:2.5,100:9,150:13" -> [{qty:25,price:2.5},...]
function parsePresets(str){
  if(!str)return[];
  return str.split(",").map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [q,p]=pair.split(":").map(x=>parseFloat((x||"").replace(",",".")));
    return{qty:q,price:p};
  }).filter(p=>p.qty>0&&p.price>=0);
}
// Tailles de contenant : "Fût 20L:2000,Fût 30L:3000" -> [{label:"Fût 20L",size:2000},...]
function parseContainers(str){
  if(!str)return[];
  return str.split(",").map(s=>s.trim()).filter(Boolean).map(pair=>{
    const idx=pair.lastIndexOf(":");
    if(idx===-1)return null;
    const label=pair.slice(0,idx).trim(), size=parseFloat(pair.slice(idx+1).replace(",","."));
    return{label,size};
  }).filter(c=>c&&c.label&&c.size>0);
}

const CARD_QR_BOX={x:708/1186,y:233/745,w:(1113-708)/1186,h:(622-233)/745};
// Génère la carte d'un membre (fond + QR code + nom + n° de licence) sur un canvas.
// Le QR code pointe vers exactement le même lien que les cartes physiques déjà
// utilisées (?person=Nom), donc compatible telle quelle avec le scan existant.
async function generateMemberCardCanvas(member,boissonsUrl){
  const bg=await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=CARD_BG_B64;
  });
  const canvas=document.createElement("canvas");
  canvas.width=bg.width;canvas.height=bg.height;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(bg,0,0);

  // QR code, avec une petite marge à l'intérieur de l'encart blanc.
  const qrUrl=(boissonsUrl||"").trim()+"?person="+encodeURIComponent(member.nom||"");
  const pad=0.08; // 8% de marge de chaque côté de l'encart
  const boxX=CARD_QR_BOX.x*canvas.width, boxY=CARD_QR_BOX.y*canvas.height;
  const boxW=CARD_QR_BOX.w*canvas.width, boxH=CARD_QR_BOX.h*canvas.height;
  const qrSize=Math.round(Math.min(boxW,boxH)*(1-2*pad));
  const qrCanvas=document.createElement("canvas");
  await QRCode.toCanvas(qrCanvas,qrUrl,{width:qrSize,margin:0,color:{dark:"#000000",light:"#ffffff"}});
  ctx.drawImage(qrCanvas,boxX+(boxW-qrSize)/2,boxY+(boxH-qrSize)/2,qrSize,qrSize);

  // Nom + n° de licence, dans la zone rouge en bas à gauche (sous l'écusson).
  const nameY=canvas.height*0.68, nameX=canvas.width*0.045;
  ctx.textBaseline="alphabetic";
  ctx.fillStyle="rgba(0,0,0,0.35)";
  ctx.font="bold "+Math.round(canvas.height*0.062)+"px Arial, sans-serif";
  ctx.fillText((member.nom||"").toUpperCase(),nameX+2,nameY+2);
  ctx.fillStyle="white";
  ctx.fillText((member.nom||"").toUpperCase(),nameX,nameY);
  if(member.numLicence){
    ctx.font=Math.round(canvas.height*0.032)+"px Arial, sans-serif";
    ctx.fillStyle="rgba(0,0,0,0.35)";
    ctx.fillText("Licence n° "+member.numLicence,nameX+1,nameY+canvas.height*0.055+1);
    ctx.fillStyle="rgba(255,255,255,0.9)";
    ctx.fillText("Licence n° "+member.numLicence,nameX,nameY+canvas.height*0.055);
  }
  return canvas;
}
const SCANNER_VIDEO_CONSTRAINTS={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720},
  advanced:[{focusMode:"continuous"}]}};
// Force une nouvelle tentative de mise au point (appui sur l'image) — utile sur les
// téléphones où la mise au point automatique en continu n'est pas fiable au démarrage.
// On bascule brièvement en mode manuel puis on revient en continu : ça déclenche une
// nouvelle recherche de netteté sur la plupart des pilotes caméra Android.
const refocusVideo=videoEl=>{
  try{
    const track=videoEl?.srcObject?.getVideoTracks?.()[0];
    if(!track||!track.getCapabilities)return;
    const caps=track.getCapabilities();
    if(caps.focusMode&&caps.focusMode.includes("continuous")){
      track.applyConstraints({advanced:[{focusMode:"manual"}]}).catch(()=>{})
        .then(()=>track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{}));
    }
  }catch{}
};
// Liste les caméras disponibles (les libellés précis ne sont visibles qu'après une
// 1ère autorisation caméra accordée). Utilisé par le bouton "Autre caméra" : sur les
// téléphones à plusieurs objectifs arrière (Samsung notamment), le navigateur choisit
// parfois un objectif grand-angle qui a du mal à faire le point de près — ce bouton
// permet de basculer manuellement sur un autre objectif jusqu'à trouver le bon.
async function listCameras(){
  try{
    const devices=await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d=>d.kind==="videoinput");
  }catch{return[];}
}
// Redémarre le lecteur ZXing sur la caméra suivante de la liste (cycle). currentIdRef
// doit contenir le deviceId actuellement utilisé (récupéré via getSettings()). Le
// choix est mémorisé sur CET appareil uniquement (localStorage) — volontairement pas
// lié au profil utilisateur : une même personne peut se connecter tantôt sur un
// téléphone, tantôt sur une tablette, et les objectifs disponibles diffèrent d'un
// appareil à l'autre (numéro 0/1 ne correspond pas au même objectif physique).
async function switchCamera(videoEl,readerRef,currentIdRef,restart){
  const cams=await listCameras();
  if(cams.length<2)return; // rien à changer, une seule caméra détectée
  const curIdx=cams.findIndex(c=>c.deviceId===currentIdRef.current);
  const next=cams[(curIdx+1)%cams.length];
  if(readerRef.current){try{readerRef.current.reset();}catch{}}
  const constraints={video:{deviceId:{exact:next.deviceId},width:{ideal:1280},height:{ideal:720},advanced:[{focusMode:"continuous"}]}};
  await restart(constraints);
  currentIdRef.current=next.deviceId;
  LS.set("anf87_preferred_camera",next.deviceId);
}
// Constraintes à utiliser en priorité pour démarrer un scan : la caméra mémorisée sur
// cet appareil, sinon le réglage par défaut.
const getPreferredCameraConstraints=()=>{
  const id=LS.get("anf87_preferred_camera");
  return id?{video:{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720},advanced:[{focusMode:"continuous"}]}}:null;
};
const containerCount=(stock,size)=>size>0?Math.floor(stock/size):0;
// Si une réserve précise a été enregistrée pour ce type de contenant (via Entrée
// rapide), on l'utilise. Sinon on affiche 0 — pas de calcul dérivé du stock total en
// cl, qui donnait un nombre trompeur : on veut le vrai compte, tel que saisi, ou "0
// pas encore renseigné" pour inciter à passer par Entrée rapide.
const preciseReserveCount=(reserve,siteId,productId,label,size)=>{
  const entry=(reserve||[]).find(r=>r.site===siteId&&r.productId.toString()===productId.toString()&&r.label===label&&r.size===size);
  return entry?entry.count:null;
};
const containerAvailable=(reserve,stock,siteId,productId,label,size)=>{
  const precise=preciseReserveCount(reserve,siteId,productId,label,size);
  return precise!=null?precise:0;
};

// Ouvre/ferme un contenant — utilisé à la fois depuis l'écran caisse (POS) et
// l'écran Stock > Contenants, pour ne pas dupliquer la logique réseau.
async function openContainerApi(caisseUrl,siteId,prod,choice,setContainers){
  const r=await apiWrite(caisseUrl,{action:"openContainer",site:siteId,id:prod.id,label:choice.label,size:choice.size});
  if(r.ok){
    const now=new Date();
    const dateStr=`${String(now.getDate()).padStart(2,"0")}/${String(now.getMonth()+1).padStart(2,"0")}/${now.getFullYear()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    setContainers(prev=>[...prev.filter(c=>!(c.site===siteId&&c.productId.toString()===prod.id.toString())),
      {site:siteId,productId:prod.id,label:choice.label,size:choice.size,remaining:choice.size,openedAt:dateStr}]);
  }
  return r;
}
async function closeContainerApi(caisseUrl,siteId,prod,setContainers){
  const r=await apiWrite(caisseUrl,{action:"closeContainer",site:siteId,id:prod.id});
  if(r.ok){
    setContainers(prev=>prev.filter(c=>!(c.site===siteId&&c.productId.toString()===prod.id.toString())));
  }
  return r;
}
// Corrige directement la jauge d'un contenant ouvert (ex: écart constaté à
// l'inventaire) — ajuste aussi le stock produit du même écart, côté serveur.
async function adjustContainerApi(caisseUrl,siteId,prod,newRemaining,setContainers){
  const r=await apiWrite(caisseUrl,{action:"adjustContainer",site:siteId,id:prod.id,remaining:newRemaining});
  if(r.ok){
    setContainers(prev=>prev.map(c=>(c.site===siteId&&c.productId.toString()===prod.id.toString())?{...c,remaining:newRemaining}:c));
  }
  return r;
}
// Redimensionne/compresse une photo côté navigateur avant stockage (400px max, JPEG
// 70%) — réutilisé pour les photos produit ET les photos de portion.
function resizePhotoFile(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=400;
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.7));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
// Recadre en carré CENTRÉ (style photo d'identité — le plus petit côté de la photo
// devient le côté du carré, centré sur l'image) puis réduit à une taille fixe et
// compresse — utilisé pour les photos de carte membre (Cartes Boissons).
function cropSquarePhoto(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const size=Math.min(img.width,img.height);
        const sx=(img.width-size)/2, sy=(img.height-size)/2;
        const outSize=320;
        const canvas=document.createElement("canvas");canvas.width=outSize;canvas.height=outSize;
        canvas.getContext("2d").drawImage(img,sx,sy,size,size,0,0,outSize,outSize);
        resolve(canvas.toDataURL("image/jpeg",0.75));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
// Envoie une photo en plusieurs petits morceaux (GET, le POST ne fonctionne pas de
// façon fiable sur ce déploiement) — "chunkAction" paramétrable pour réutiliser ce
// mécanisme aussi bien pour les photos produit que pour les photos de portion.
async function uploadPhotoGeneric(caisseUrl,chunkAction,id,photoDataUrl){
  if(!photoDataUrl||!caisseUrl)return{ok:true,photoParam:photoDataUrl||""};
  if(photoDataUrl.length<1200)return{ok:true,photoParam:photoDataUrl};
  const CHUNK=1200;
  const chunks=[];
  for(let i=0;i<photoDataUrl.length;i+=CHUNK)chunks.push(photoDataUrl.slice(i,i+CHUNK));
  for(let i=0;i<chunks.length;i++){
    const r=await api(caisseUrl,{action:chunkAction,id,idx:i,total:chunks.length,chunk:chunks[i]});
    if(!r.ok)return{ok:false,error:r.error||"échec de l'envoi de la photo (morceau "+(i+1)+"/"+chunks.length+")"};
  }
  return{ok:true,photoParam:"__CHUNKED__",photoChunks:chunks.length};
}
async function api(url,params){
  if(!url)return{ok:false,error:"URL non configurée"};
  // GET uniquement : sur ce déploiement, le POST vers l'URL Apps Script renvoie une
  // page de connexion Google (HTML) au lieu du JSON attendu — confirmé en testant
  // l'URL directement dans le navigateur. Le GET, lui, fonctionne de façon fiable.
  // C'est pour ça que les photos produits sont envoyées en plusieurs petits morceaux
  // (voir uploadPhotoChunks) plutôt qu'en un seul gros paramètre.
  const entries=Object.entries(params).map(([k,v])=>[k,String(v)]);
  const qs=entries.map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  try{
    const r=await fetch(url+"?"+qs,{redirect:"follow"});
    const text=await r.text();
    try{ return JSON.parse(text); }
    catch(e){
      // Le serveur n'a pas répondu en JSON (page Google de connexion/permission,
      // page d'erreur Apps Script...) — on le dit clairement au lieu de planter.
      return{ok:false,error:"Réponse non-JSON du serveur (vérifiez les droits d'accès du déploiement Apps Script — doit être \"Tous\")"};
    }
  }
  catch(e){return{ok:false,error:e.message};}
}
// Pour les écritures (save/delete/update/transfer) : si Google Sheets refuse ou que la
// connexion coupe, on prévient clairement au lieu de laisser la modif disparaître en
// silence au prochain rafraîchissement automatique.
async function apiWrite(url,params){
  const r=await api(url,params);
  // Garde-fou : une réponse "ok:true" mais qui ressemble à une LECTURE (un tableau
  // "products") pour une action d'ÉCRITURE signale que la requête n'a probablement
  // pas été traitée comme prévu par le serveur (le paramètre action a pu se perdre
  // en route) — sans ce contrôle, ça passerait pour un succès alors que rien n'a
  // été enregistré, et l'actualisation automatique donnerait l'impression d'avoir
  // "effacé" la modification.
  const isWriteAction=params&&typeof params.action==="string"&&params.action!=="getAll"&&params.action!=="getSales";
  const looksLikeReadResponse=r&&r.ok&&Array.isArray(r.products);
  if(r.ok&&isWriteAction&&looksLikeReadResponse){
    r.ok=false;
    r.error="réponse inattendue du serveur (la requête n'a peut-être pas été traitée comme une écriture)";
  }
  if(!r.ok){
    window.alert("⚠️ Échec de l'enregistrement sur Google Sheets :\n"+(r.error||"erreur inconnue")+
      "\n\nVérifiez votre connexion puis réessayez. Tant que ce n'est pas enregistré côté serveur, "+
      "l'actualisation automatique peut annuler ce changement à l'écran.");
  }
  return r;
}

// ═══ APP ROOT ═══
function App(){
  const [products,setProducts]=useState(LS.get("anf87_products")||DPRODS);
  const [sites,setSites]=useState(LS.get("anf87_sites")||DSITES);
  const [categories,setCats]=useState(LS.get("anf87_cats")||DCATS);
  const [users,setUsers]=useState(LS.get("anf87_users")||DUSERS);
  const [containers,setContainers]=useState(LS.get("anf87_containers")||[]); // fûts/bouteilles/cubis ouverts
  const [portions,setPortions]=useState(LS.get("anf87_portions")||[]); // paliers de vente (demis, pichets, gobelets...)
  const [combos,setCombos]=useState(LS.get("anf87_combos")||[]); // menus (plusieurs produits différents en une vente)
  const [accompaniments,setAccompaniments]=useState(LS.get("anf87_accompaniments")||[]); // gobelet/sucre/touillette... auto-décomptés
  const [reserve,setReserve]=useState(LS.get("anf87_reserve")||[]); // réserve précise de contenants par type (via Entrée rapide)
  const [siteId,setSiteId]=useState(LS.get("anf87_site")||"s1");
  const [tab,setTab]=useState("pos");
  const [cart,setCart]=useState([]);
  const [modal,setModal]=useState(null);
  const [currentUser,setCU]=useState(SS.get("anf87_user")||null);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(LS.get("anf87_lastsync")||null);
  const [syncError,setSyncError]=useState(null);
  const [volumeProd,setVolumeProd]=useState(null); // produit à vendre au verre
  const caisseUrl=LS.get("anf87_caisse_url")||"";
  const boissonsUrl=LS.get("anf87_url")||"";
  // Réglages partagés par tout le club (clé Affiliate SumUp, App ID) — stockés sur
  // Google Sheets pour suivre automatiquement sur tous les appareils, avec repli sur
  // localStorage tant qu'aucune synchro n'a encore eu lieu (1er lancement, hors-ligne).
  const [config,setConfig]=useState(LS.get("anf87_config")||{});
  const sumupKey=config.sumup_key!==undefined?config.sumup_key:(LS.get("anf87_sumup_key")||"");
  const sumupAppId=config.sumup_appid!==undefined?config.sumup_appid:(LS.get("anf87_sumup_appid")||"");
  const site=sites.find(s=>s.id===siteId)||sites[0]||{id:"s1",name:"Buvette",color:T.red};
  const isAdmin=!users.length||currentUser?.role==="admin";

  useEffect(()=>{ if(caisseUrl)syncAll(); },[caisseUrl]);

  // Actualisation auto : toutes les 20s + au retour au premier plan (multi-appareils)
  useEffect(()=>{
    if(!caisseUrl)return;
    const id=setInterval(()=>{ if(document.visibilityState==="visible")syncAll(); },20000);
    const onVis=()=>{ if(document.visibilityState==="visible")syncAll(); };
    document.addEventListener("visibilitychange",onVis);
    window.addEventListener("focus",onVis);
    return()=>{clearInterval(id);document.removeEventListener("visibilitychange",onVis);window.removeEventListener("focus",onVis);};
  },[caisseUrl]);

  async function syncAll(){
    setSyncing(true);
    const r=await api(caisseUrl,{action:"getAll"});
    if(r.ok){
      if(r.products?.length){const p=r.products;setProducts(p);LS.set("anf87_products",p);}
      if(r.sites?.length){setSites(r.sites);LS.set("anf87_sites",r.sites);}
      if(r.categories?.length){setCats(r.categories);LS.set("anf87_cats",r.categories);}
      if(r.users?.length){setUsers(r.users);LS.set("anf87_users",r.users);}
      // Contenants : synchronisé même si vide (un contenant qu'on vient de "Terminer"
      // ailleurs doit bien disparaître ici, pas juste rester affiché en cas de sync vide).
      setContainers(r.containers||[]);LS.set("anf87_containers",r.containers||[]);
      setPortions(r.portions||[]);LS.set("anf87_portions",r.portions||[]);
      setCombos(r.combos||[]);LS.set("anf87_combos",r.combos||[]);
      setAccompaniments(r.accompaniments||[]);LS.set("anf87_accompaniments",r.accompaniments||[]);
      setReserve(r.reserve||[]);LS.set("anf87_reserve",r.reserve||[]);
      setConfig(r.config||{});LS.set("anf87_config",r.config||{});
      const t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      setLastSync(t);LS.set("anf87_lastsync",t);
      setSyncError(null);
    } else {
      // On ne garde plus une coche périmée quand la synchro échoue réellement : le
      // problème doit être visible tout de suite plutôt que de faire croire que tout va bien.
      setSyncError(r.error||"échec de connexion");
    }
    setSyncing(false);
  }

  const saveProd=async arr=>{setProducts(arr);LS.set("anf87_products",arr);};
  const saveSites=async arr=>{setSites(arr);LS.set("anf87_sites",arr);};
  const saveCats=async arr=>{setCats(arr);LS.set("anf87_cats",arr);};
  const saveUsers=async arr=>{setUsers(arr);LS.set("anf87_users",arr);};

  const addToCart=p=>{
    if((p.stock[siteId]||0)<=0)return;
    if(p.sellByVolume){setVolumeProd(p);return;}
    setCart(prev=>{const ex=prev.find(i=>i.id===p.id);
      if(ex)return prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
      return[...prev,{id:p.id,pid:p.id,name:p.name,price:p.price,emoji:p.emoji,photo:p.photo,drink:p.drink,qty:1,free:false,unit:"unité"}];});
  };
  const addVolumeToCart=(prod,qty,unit,price)=>{
    // vol = quantité réellement servie (en cl/g/etc.) à décompter du stock du fût/cubi/paquet.
    // qty reste le nombre de "portions identiques" (pour les boutons +/- et le calcul du prix).
    // pid = l'ID RÉEL du produit (contrairement à id, qui est un identifiant unique de
    // ligne "prodId-horodatage" pour distinguer plusieurs services dans le panier) —
    // c'est pid qu'il faut envoyer au serveur pour que le décompte de stock trouve la
    // bonne ligne (avant ce correctif, le serveur recevait l'ID composite et ne
    // trouvait donc jamais le produit : le stock des ventes au cl n'était jamais décompté).
    setCart(prev=>[...prev,{id:prod.id+"-"+Date.now(),pid:prod.id,name:prod.name+" "+qty+unit,price,emoji:prod.emoji,photo:prod.photo,drink:prod.drink,qty:1,vol:qty,free:false,unit:unit}]);
    setVolumeProd(null);
  };
  // Un combo regroupe plusieurs PRODUITS DIFFÉRENTS en une seule ligne de panier
  // (ex: Croque + Frites). comboItems garde la liste des produits inclus (avec leur
  // quantité chacun) pour que le stock de CHAQUE produit soit décompté à la vente,
  // même si le combo lui-même n'existe pas dans le tableau Produits.
  const addComboToCart=combo=>{
    const items=combo.items.map(ci=>{
      const prod=products.find(p=>p.id.toString()===ci.productId.toString());
      return{pid:ci.productId,qty:ci.qty,prod};
    });
    const missing=items.find(it=>!it.prod);
    if(missing){window.alert("⚠️ Ce menu contient un produit qui n'existe plus, il ne peut pas être ajouté.");return;}
    const insuffisant=items.find(it=>(it.prod.stock[siteId]||0)<it.qty);
    if(insuffisant){window.alert("⚠️ Stock insuffisant pour ce menu (\""+insuffisant.prod.name+"\").");return;}
    // Un menu contenant au moins une boisson est éligible à la carte boissons
    // offertes (comme un produit boisson classique) — la valeur totale du menu
    // devient alors offrable.
    const containsDrink=items.some(it=>it.prod.drink);
    setCart(prev=>{
      const ex=prev.find(i=>i.pid===combo.id&&i.isCombo);
      if(ex)return prev.map(i=>i===ex?{...i,qty:i.qty+1}:i);
      return[...prev,{id:combo.id+"-"+Date.now(),pid:combo.id,isCombo:true,
        comboItems:items.map(it=>({pid:it.pid,qty:it.qty})),
        name:combo.name,price:combo.price,emoji:"🍽",photo:combo.photo,drink:containsDrink,qty:1,free:false,unit:"menu"}];
    });
  };
  const removeFromCart=id=>setCart(prev=>{const ex=prev.find(i=>i.id===id);
    if(!ex||ex.qty<=1)return prev.filter(i=>i.id!==id);
    return prev.map(i=>i.id===id?{...i,qty:i.qty-1}:i);});
  const addQtyToCart=id=>setCart(prev=>prev.map(i=>i.id===id?{...i,qty:i.qty+1}:i));
  const clearCart=()=>setCart([]);

  const cartTotal=cart.reduce((s,i)=>s+(i.free?0:i.price*i.qty),0);
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);

  const finalizeSale=async(payment,splitPart)=>{
    // Consos offertes match (joueurs/dirigeants/arbitres après un match) : la vente
    // est enregistrée à 0€ mais le stock est bien décompté normalement, comme pour
    // n'importe quelle consommation réellement servie.
    const total=payment?.type==="matchOffert"?0:(splitPart||cartTotal);
    // Pour un article vendu au volume (fût, cubi, paquet café...), on décompte qty*vol
    // (ex: 2 verres de 30cl = 60cl décomptés), pas juste qty (qui vaudrait 2).
    const stockAmount=item=>item.vol?item.qty*item.vol:item.qty;
    // Pour un combo (plusieurs produits DIFFÉRENTS en une ligne), on décompte le
    // stock de CHAQUE produit inclus, pas le combo lui-même (qui n'existe pas dans
    // le tableau Produits) — comboItems.qty × le nombre de combos commandés.
    const stockEntries=[];
    cart.forEach(item=>{
      if(item.noStock)return; // reçu virtuel de la part offerte (voir FreeDrinksModal) : déjà compté par la ligne d'origine
      if(item.comboItems){
        item.comboItems.forEach(ci=>stockEntries.push({id:ci.pid,qty:ci.qty*item.qty}));
      }else{
        const pid=item.pid||item.id;
        stockEntries.push({id:pid,qty:stockAmount(item)});
        // Accompagnements automatiques (gobelet, sucre, touillette...) : décomptés
        // en plus du produit vendu, sans ligne de panier ni impact sur le prix.
        // Basé sur item.qty (nb de services), pas stockAmount (qui inclut le volume
        // en cl pour les ventes au verre — un café ×2 consomme 2 gobelets, pas
        // "2×volume" gobelets).
        accompaniments.filter(a=>a.productId.toString()===pid.toString())
          .forEach(a=>stockEntries.push({id:a.assocId,qty:a.qty*item.qty}));
      }
    });
    // On ADDITIONNE toutes les entrées d'un même produit — il peut apparaître sur
    // plusieurs lignes (plusieurs services au verre, une ligne scindée par la carte
    // boissons, ou inclus dans plusieurs combos différents à la fois).
    const upd=products.map(p=>{
      const qtyTotal=stockEntries.filter(e=>e.id.toString()===p.id.toString()).reduce((s,e)=>s+e.qty,0);
      if(qtyTotal<=0)return p;
      return{...p,stock:{...p.stock,[siteId]:Math.max(0,(p.stock[siteId]||0)-qtyTotal)}};
    });
    setProducts(upd);LS.set("anf87_products",upd);
    if(caisseUrl){
      const member=cart.some(i=>i.free)?(LS.get("anf87_last_member")||""):"";
      const saleResult=await apiWrite(caisseUrl,{action:"saveSale",site:siteId,siteName:site.name,
        total:total.toFixed(2),payment:JSON.stringify(payment),
        items:JSON.stringify(stockEntries),
        member,nbItems:cartCount,caissier:currentUser?.name||"",splitPart:splitPart?"Oui":""});
      if(saleResult?.stockWarning){
        window.alert("⚠️ La vente est enregistrée, mais le stock n'a pas pu être décompté pour au moins un article :\n\n"+saleResult.stockWarning+"\n\nVérifiez l'ID du produit et le site dans Google Sheets.");
      }
      syncAll(); // reflète immédiatement le stock réel (utile à plusieurs caisses)
    }
    clearCart();setModal(null);
  };

  // ── Authentification ──
  if(users.length&&!currentUser){
    return <LoginScreen users={users} onLogin={u=>{setCU(u);SS.set("anf87_user",u);}}/>;
  }

  const navItems=isAdmin
    ?[["pos","🛒","Caisse"],["stock","📦","Stock"],["reports","📊","Rapports"],["admin","🔧","Admin"],["settings","⚙️","Config"]]
    :[["pos","🛒","Caisse"],["settings","⚙️","Config"]];

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:T.bg}}>
      {/* ── HEADER ── */}
      <div style={{background:T.dark,color:"white",padding:"0 16px",height:"var(--hdr)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>

      <div style={{flex:1,overflow:"hidden"}}>

      {modal==="scanner"&&<ScannerModal products={products} siteId={siteId} onFound={addToCart} onClose={()=>setModal(null)}/>}
      {modal==="boissons"&&<FreeDrinksModal cart={cart} setCart={setCart} boissonsUrl={boissonsUrl}
        onClose={()=>setModal("payment")} onFinalize={finalizeSale}/>}
      {modal==="split"&&<SplitModal total={cartTotal} onClose={()=>setModal("payment")} onComplete={(payments)=>{finalizeSale({type:"split",parts:payments});}}/>}
      {modal==="cart"&&<CartModal cart={cart} cartTotal={cartTotal} removeFromCart={removeFromCart} addQtyToCart={addQtyToCart} clearCart={clearCart}
        onClose={()=>setModal(null)} onEncaisser={()=>{setModal("payment");}}/>}
      {volumeProd&&<VolumeModal prod={volumeProd} onClose={()=>setVolumeProd(null)} onAdd={addVolumeToCart} portions={portions}/>}
    </div>
  );
}

// ═══ SÉLECTEUR SITE ═══
function SiteSelector({sites,siteId,onChange}){
  const [open,setOpen]=useState(false);
  const site=sites.find(s=>s.id===siteId)||sites[0];
  return(<div style={{position:"relative"}}>
    <button onClick={()=>setOpen(!open)} style={{display:"flex",alignItems:"center",gap:7,background:"rgba(255,255,255,0.1)",
      border:"1px solid rgba(255,255,255,0.2)",borderRadius:10,padding:"7px 12px",color:"white",cursor:"pointer"}}>
      <span style={{width:10,height:10,borderRadius:"50%",background:site?.color,display:"inline-block",flexShrink:0}}/>
      <span style={{fontSize:14,fontWeight:700}}>{site?.name}</span>
      <span style={{fontSize:11}}>▾</span>
    </button>
    {open&&<div style={{position:"absolute",top:"calc(100% + 6px)",right:0,background:T.card,borderRadius:14,
      boxShadow:"0 8px 32px rgba(0,0,0,0.2)",border:`1px solid ${T.border}`,zIndex:100,minWidth:190,overflow:"hidden"}}>
      {sites.map(s=><button key={s.id} onClick={()=>{onChange(s.id);setOpen(false);}}
        style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"13px 14px",
          background:s.id===siteId?T.bg:"none",border:"none",cursor:"pointer",color:T.dark,textAlign:"left"}}>
        <span style={{width:12,height:12,borderRadius:"50%",background:s.color,display:"inline-block",flexShrink:0}}/>
        <div><div style={{fontSize:14,fontWeight:600}}>{s.name}</div><div style={{fontSize:11,color:T.mid}}>{s.village}</div></div>
      </button>)}
    </div>}
  </div>);
}

// ═══ BANDEAU CONTENANTS (écran caisse, à côté du scanner) ═══
function ContainerStrip({products,siteId,containers,setContainers,caisseUrl,reserve}){
  const [busyId,setBusyId]=useState(null);
  const [pickerFor,setPickerFor]=useState(null); // produit dont on choisit la taille à ouvrir
  const [closeConfirm,setCloseConfirm]=useState(null); // {prod,cont}

  const volProducts=products.filter(p=>p.sellByVolume&&parseContainers(p.containers).length>0);
  if(volProducts.length===0)return null;
  const findCont=pid=>containers.find(c=>c.site===siteId&&c.productId.toString()===pid.toString());

  const doOpen=async(prod,choice)=>{
    setBusyId(prod.id);setPickerFor(null);
    await openContainerApi(caisseUrl,siteId,prod,choice,setContainers);
    setBusyId(null);
  };
  const doClose=async(prod,cont)=>{
    setBusyId(prod.id);
    await closeContainerApi(caisseUrl,siteId,prod,setContainers);
    setBusyId(null);setCloseConfirm(null);
  };

  return(<div style={{display:"flex",gap:7,overflowX:"auto",alignItems:"stretch"}}>
    {volProducts.map(prod=>{
      const cont=findCont(prod.id);
      const presets=parseContainers(prod.containers);
      // Contenants qu'on peut réellement ouvrir vu le stock actuel (pour ne pas
      // proposer "Ouvrir" si le stock est à 0 — et masquer complètement la carte si
      // le produit n'est ni ouvert, ni ouvrable).
      const availablePresets=presets.filter(c=>containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size)>0);
      if(!cont&&availablePresets.length===0)return null;
      const busy=busyId===prod.id;
      const pct=cont?Math.max(0,Math.min(100,(cont.remaining/cont.size)*100)):0;
      const gaugeColor=prod.color||T.orange; // couleur choisie pour ce produit (comme les sites)
      // Ligne dédiée "en réserve" : ce qui reste en stock au-delà du contenant
      // actuellement ouvert (pour toujours voir ce qui suit, même une fois entamé).
      const reserveLine=presets.map(c=>{
        const total=containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size);
        const openSame=cont&&cont.label===c.label&&cont.size===c.size;
        const n=openSame?Math.max(0,total-1):total;
        return n>0?`${n}× ${c.label}`:null;
      }).filter(Boolean).join(", ");
      return(<div key={prod.id} style={{flexShrink:0}}>
        <button disabled={busy}
          onClick={()=>cont?setCloseConfirm({prod,cont}):(availablePresets.length===1?doOpen(prod,availablePresets[0]):setPickerFor(prod.id))}
          style={{position:"relative",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",
            gap:6,padding:"5px 12px",minWidth:150,background:T.bg,border:`1.5px solid ${cont?gaugeColor:T.border}`,
            borderRadius:8,cursor:busy?"default":"pointer"}}>
          {cont&&<div style={{position:"absolute",inset:0,width:pct+"%",background:gaugeColor,opacity:.55,transition:"width .3s"}}/>}
          <span style={{position:"relative",fontSize:11,fontWeight:700,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:70}}>{prod.name}</span>
          {busy?<span style={{position:"relative",fontSize:10,color:T.mid}}>⏳...</span>
            :cont?<span style={{position:"relative",fontSize:10,fontWeight:700,color:T.dark,whiteSpace:"nowrap"}}>Terminer ({cont.remaining}{prod.unit})</span>
            :<span style={{position:"relative",fontSize:10,fontWeight:700,color:T.mid,whiteSpace:"nowrap"}}>
              {availablePresets.length===1?`Ouvrir (${containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,availablePresets[0].label,availablePresets[0].size)})`:"Ouvrir…"}
            </span>}
        </button>
        {reserveLine&&<div style={{fontSize:9,color:T.mid,marginTop:1,maxWidth:150,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>📦 {reserveLine}</div>}
      </div>);
    })}
    {/* Choix de la taille à ouvrir — en fenêtre centrée (pas en menu déroulant, qui
        se faisait couper par le défilement horizontal du bandeau et devenait
        invisible/incliquable). */}
    {pickerFor&&(()=>{
      const prod=volProducts.find(p=>p.id.toString()===pickerFor.toString());
      if(!prod)return null;
      const availablePresets=parseContainers(prod.containers).filter(c=>containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size)>0);
      return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
        onClick={e=>e.target===e.currentTarget&&setPickerFor(null)}>
        <div style={{background:T.card,borderRadius:16,padding:20,width:"100%",maxWidth:340}}>
          <div style={{fontWeight:800,fontSize:16,color:T.dark,marginBottom:12}}>{prod.emoji} Ouvrir — {prod.name}</div>
          {availablePresets.map((c,i)=><button key={i} onClick={()=>doOpen(prod,c)}
            style={{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",background:T.bg,border:`1px solid ${T.border}`,
              borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,color:T.dark,marginBottom:8}}>
            {c.label} <span style={{color:T.mid,fontWeight:500}}>({containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size)} en stock)</span>
          </button>)}
          <button onClick={()=>setPickerFor(null)} style={{width:"100%",padding:"11px",background:"none",border:"none",cursor:"pointer",fontWeight:600,color:T.mid}}>Annuler</button>
        </div>
      </div>);
    })()}
    {closeConfirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
      onClick={e=>e.target===e.currentTarget&&setCloseConfirm(null)}>
      <div style={{background:T.card,borderRadius:16,padding:22,width:"100%",maxWidth:360}}>
        <div style={{fontWeight:800,fontSize:16,color:T.dark,marginBottom:8}}>🏁 Terminer {closeConfirm.cont.label} ?</div>
        <div style={{fontSize:13,color:T.mid,lineHeight:1.5,marginBottom:14}}>
          Il reste <b>{closeConfirm.cont.remaining}{closeConfirm.prod.unit}</b> dans la jauge. Cette quantité sera
          déduite du stock de "{closeConfirm.prod.name}" pour corriger l'écart (pertes, verres renversés...).
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setCloseConfirm(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={()=>doClose(closeConfirm.prod,closeConfirm.cont)} style={{flex:1,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Confirmer</button>
        </div>
      </div>
    </div>}
  </div>);
}

function PosScreen({products,cart,siteId,categories,addToCart,removeFromCart,addQtyToCart,clearCart,addVolumeToCart,portions,combos,addComboToCart,cartTotal,cartCount,currentUser,openPayment,openScanner,openCart,containers,setContainers,caisseUrl,reserve}){
  const [cat,setCat]=useState("Tout");
  const [isLandscape,setLandscape]=useState(window.innerWidth>600&&window.orientation!==0);
  useEffect(()=>{const h=()=>setLandscape(window.innerWidth>600&&window.screen.orientation?.type?.includes("landscape")||window.innerWidth>window.innerHeight);
    window.addEventListener("resize",h);window.addEventListener("orientationchange",()=>setTimeout(h,100));return()=>{window.removeEventListener("resize",h);window.removeEventListener("orientationchange",h);};},[]);
  const cats=["Tout",...categories.map(c=>c.name),...(combos&&combos.length?["Menus"]:[])];
  const [reorderMode,setReorderMode]=useState(false);
  // L'ordre des produits est propre à chaque utilisateur connecté, et sauvegardé sur
  // Google Sheets (colonne "OrdreProduits" de la feuille Utilisateurs) pour qu'il
  // suive la personne sur n'importe quel appareil — pas juste sur celui-ci.
  const orderKey=currentUser?"anf87_product_order_"+currentUser.id:"anf87_product_order";
  const [customOrder,setCustomOrder]=useState(()=>{
    if(currentUser?.productOrder)return currentUser.productOrder.split(",").filter(Boolean);
    return LS.get(orderKey)||[];
  });
  useEffect(()=>{
    if(currentUser?.productOrder)setCustomOrder(currentUser.productOrder.split(",").filter(Boolean));
    else setCustomOrder(LS.get(orderKey)||[]);
  },[currentUser?.id]);
  // Les produits à 0€ (gobelet, sucre, touillette... utilisés uniquement comme
  // accompagnements automatiques) sont masqués par défaut de la grille caisse, pour
  // ne pas l'encombrer — un bouton permet de les faire réapparaître au besoin.
  const [showFree,setShowFree]=useState(false);
  const hiddenFreeCount=products.filter(p=>+p.price===0&&(cat==="Tout"||p.cat===cat)).length;
  const filteredRaw=products.filter(p=>(cat==="Tout"||p.cat===cat)&&(showFree||+p.price!==0));
  // Glisser-déposer pour réorganiser : on insère le produit déplacé juste à l'endroit
  // où le doigt est relâché, plutôt que de ne pouvoir échanger qu'avec le voisin direct.
  const [dragId,setDragId]=useState(null);
  const [dragOverId,setDragOverId]=useState(null);
  const dragIdRef=useRef(null),dragOverIdRef=useRef(null);
  const reorderTo=(sourceId,targetId)=>{
    const allIds=[...products.map(p=>p.id.toString()),...(combos||[]).map(c=>"combo-"+c.id)];
    let order=customOrder.length?[...customOrder]:allIds.slice();
    allIds.forEach(pid=>{if(!order.includes(pid))order.push(pid);});
    const from=order.indexOf(sourceId.toString());
    if(from===-1)return;
    order.splice(from,1);
    const to=order.indexOf(targetId.toString());
    order.splice(to===-1?order.length:to,0,sourceId.toString());
    setCustomOrder(order);
    LS.set(orderKey,order); // repli immédiat sur cet appareil, le temps que le serveur confirme
    if(caisseUrl&&currentUser){
      apiWrite(caisseUrl,{action:"saveProductOrder",userId:currentUser.id,order:order.join(",")});
    }
  };
  const startDrag=pid=>{
    if(!reorderMode)return;
    dragIdRef.current=pid.toString();setDragId(pid.toString());
    const move=ev=>{
      const pt=ev.touches?ev.touches[0]:ev;
      const el=document.elementFromPoint(pt.clientX,pt.clientY);
      const wrapper=el&&el.closest&&el.closest("[data-pid]");
      const overId=wrapper?wrapper.getAttribute("data-pid"):null;
      dragOverIdRef.current=overId;setDragOverId(overId);
    };
    const end=()=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",end);
      if(dragOverIdRef.current&&dragIdRef.current&&dragOverIdRef.current!==dragIdRef.current){
        reorderTo(dragIdRef.current,dragOverIdRef.current);
      }
      dragIdRef.current=null;dragOverIdRef.current=null;
      setDragId(null);setDragOverId(null);
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",end);
  };
  const cols=isLandscape?5:3;
  const stockC=v=>v===0?"#FF3B30":v<=5?T.orange:T.green;

  return(<div style={{height:"100%",display:"flex",overflow:"hidden"}}>
    {/* Catalogue */}
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Cats + scanner */}
      <div style={{padding:"10px 12px 8px",background:T.card,borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:8}}>
          <div style={{display:"flex",gap:7,overflowX:"auto",flex:1}}>
            {cats.map(c=><button key={c} onClick={()=>setCat(c)} style={{flexShrink:0,padding:"7px 16px",borderRadius:20,
              border:"none",background:cat===c?T.red:T.bg,color:cat===c?"white":T.dark,fontSize:13,fontWeight:600,cursor:"pointer"}}>{c}</button>)}
          </div>
          <button onClick={()=>setReorderMode(r=>!r)} title={reorderMode?"Terminer la réorganisation":"Réorganiser les produits"}
            style={{flexShrink:0,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",
              background:reorderMode?T.red:T.bg,color:reorderMode?"white":T.dark,border:`1px solid ${reorderMode?T.red:T.border}`,
              borderRadius:"50%",fontSize:15,cursor:"pointer"}}>
            {reorderMode?"✓":"↕"}
          </button>
          {hiddenFreeCount>0&&<button onClick={()=>setShowFree(s=>!s)} title={showFree?"Masquer les produits à 0€":"Afficher les produits à 0€ (accompagnements...)"}
            style={{flexShrink:0,position:"relative",width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",
              background:showFree?T.dark:T.bg,color:showFree?"white":T.dark,border:`1px solid ${showFree?T.dark:T.border}`,
              borderRadius:"50%",fontSize:15,cursor:"pointer"}}>
            {showFree?"🙈":"👁"}
            {!showFree&&<span style={{position:"absolute",top:-4,right:-4,background:T.red,color:"white",borderRadius:"50%",
              width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{hiddenFreeCount}</span>}
          </button>}
        </div>
        <div style={{display:"flex",gap:7,overflowX:"auto",alignItems:"stretch"}}>
          <button onClick={openScanner} style={{display:"flex",alignItems:"center",gap:7,padding:"8px 16px",flexShrink:0,
            background:T.dark,color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer"}}>
            📷 Scanner code-barres
          </button>
          <ContainerStrip products={products} siteId={siteId} containers={containers} setContainers={setContainers} caisseUrl={caisseUrl} reserve={reserve}/>
        </div>
      </div>

      {/* Grille produits */}
      <div style={{flex:1,overflowY:"auto",padding:10,display:"grid",
        gridTemplateColumns:`repeat(${cols},1fr)`,gap:9,alignContent:"start"}}>
        {(()=>{
        const buildProductTile=(p)=>{
          const stk=p.stock[siteId]||0;
          const isDrink=p.drink;
          const myPortions=p.sellByVolume?portions.filter(po=>po.productId.toString()===p.id.toString()):[];
          // Si des tailles de contenant sont configurées pour ce produit, il faut
          // qu'un contenant soit ouvert (écran Contenants / bandeau caisse) avant de
          // pouvoir le vendre — évite de vendre un fût qui n'est pas encore entamé.
          const needsContainer=p.sellByVolume&&parseContainers(p.containers).length>0;
          const containerOpen=!needsContainer||containers.some(c=>c.site===siteId&&c.productId.toString()===p.id.toString());
          const sellable=stk>0&&containerOpen;
          // Produit vendu au volume avec des portions configurées (ex: Demi/Pichet 1L/
          // Pichet 1,5L) : un bouton par portion, ajouté directement au panier sans
          // passer par la fenêtre de choix de quantité. Chaque portion a sa propre
          // photo (repli sur la photo du produit si non définie).
          if(myPortions.length>0){
            return myPortions.map((portion,pi)=>{
              const photo=portion.photo||p.photo;
              return(
              <div key={p.id+"-portion-"+portion.id} data-pid={p.id} onPointerDown={()=>startDrag(p.id)}
                style={{position:"relative",touchAction:reorderMode?"none":"auto",
                  opacity:dragId===p.id.toString()?0.35:1,
                  outline:reorderMode&&dragOverId===p.id.toString()&&dragId!==p.id.toString()?`3px dashed ${T.red}`:"none",
                  outlineOffset:2,borderRadius:14}}>
              <button onClick={()=>{if(reorderMode)return;sellable&&addVolumeToCart(p,portion.size,p.unit,portion.price);}} disabled={!sellable&&!reorderMode}
                style={photo?{position:"relative",width:"100%",height:132,borderRadius:14,overflow:"hidden",padding:0,
                    cursor:reorderMode?"grab":sellable?"pointer":"not-allowed",opacity:!sellable&&!reorderMode?.45:1,
                    border:`2px solid ${isDrink&&sellable?"#FF9F0A":T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}
                  :{width:"100%",background:isDrink?"#FFF8E1":T.card,border:`2px solid ${isDrink&&sellable?"#FF9F0A":T.border}`,
                    borderRadius:14,padding:"14px 8px",cursor:reorderMode?"grab":sellable?"pointer":"not-allowed",opacity:!sellable&&!reorderMode?.4:1,
                    textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}
                onMouseDown={e=>!reorderMode&&(e.currentTarget.style.transform="scale(0.94)")}
                onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>
                {photo?<>
                  <img src={photo} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
                  <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,0.8) 100%)"}}/>
                  {isDrink&&sellable&&<div style={{position:"absolute",top:6,left:6,background:T.orange,color:"white",fontSize:9,fontWeight:800,padding:"2px 6px",borderRadius:6}}>🍺 Offrable</div>}
                  <div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.55)",color:"white",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:6}}>
                    {!containerOpen?"🔒 Fermé":stk<=0?"RUPTURE":stk<=5?`⚠ ${stk}${p.unit}`:`${stk}${p.unit}`}
                  </div>
                  <div style={{position:"absolute",left:8,right:8,bottom:6,textAlign:"left"}}>
                    <div style={{fontSize:12,fontWeight:800,color:"white",textShadow:"0 1px 3px rgba(0,0,0,0.85)",lineHeight:1.2,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{portion.name} — {portion.size}{p.unit}</div>
                    <div style={{fontSize:14,fontWeight:900,color:"white",textShadow:"0 1px 3px rgba(0,0,0,0.85)"}}>{fmt(portion.price)}</div>

                  <div style={{fontSize:30,marginBottom:6}}>{p.emoji}</div>
                  {isDrink&&sellable&&<div style={{fontSize:10,color:T.orange,fontWeight:700,marginBottom:2}}>🍺 Offrable</div>}
                  <div style={{fontSize:12,fontWeight:700,color:T.dark,marginBottom:1,lineHeight:1.2}}>{portion.name}</div>
                  <div style={{fontSize:11,color:T.mid,marginBottom:3}}>{portion.size}{p.unit}</div>
                  <div style={{fontSize:13,fontWeight:800,color:T.red}}>{fmt(portion.price)}</div>
                  <div style={{fontSize:10,fontWeight:600,color:!containerOpen?T.orange:stockC(stk),marginTop:3}}>
                    {!containerOpen?"🔒 Contenant fermé":stk<=0?"RUPTURE":stk<=5?`⚠ ${stk}${p.unit}`:`${stk}${p.unit}`}
                  </div>
                </>}
              </button>
              {reorderMode&&<div style={{position:"absolute",top:4,right:4,width:24,height:24,borderRadius:6,background:"rgba(0,0,0,0.6)",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"white",pointerEvents:"none"}}>⠿</div>}
              </div>
              );
            });
          }
          return [(<div key={p.id} data-pid={p.id} onPointerDown={()=>startDrag(p.id)}
            style={{position:"relative",touchAction:reorderMode?"none":"auto",
              opacity:dragId===p.id.toString()?0.35:1,
              outline:reorderMode&&dragOverId===p.id.toString()&&dragId!==p.id.toString()?`3px dashed ${T.red}`:"none",
              outlineOffset:2,borderRadius:14}}>
          <button onClick={()=>{if(!reorderMode)addToCart(p);}} disabled={stk<=0&&!reorderMode}
            style={p.photo?{position:"relative",width:"100%",height:132,borderRadius:14,overflow:"hidden",padding:0,
                cursor:reorderMode?"grab":stk>0?"pointer":"not-allowed",opacity:stk<=0&&!reorderMode?.45:1,
                border:`2px solid ${isDrink&&stk>0?"#FF9F0A":T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}
              :{width:"100%",background:isDrink?"#FFF8E1":T.card,border:`2px solid ${isDrink&&stk>0?"#FF9F0A":T.border}`,
                borderRadius:14,padding:"14px 8px",cursor:reorderMode?"grab":stk>0?"pointer":"not-allowed",opacity:stk<=0&&!reorderMode?.4:1,
                textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}
            onMouseDown={e=>!reorderMode&&(e.currentTarget.style.transform="scale(0.94)")}
            onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>
            {p.photo?<>
              <img src={p.photo} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
              <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,0.8) 100%)"}}/>
              {p.drink&&stk>0&&<div style={{position:"absolute",top:6,left:6,background:T.orange,color:"white",fontSize:9,fontWeight:800,padding:"2px 6px",borderRadius:6}}>🍺 Offrable</div>}
              <div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.55)",color:"white",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:6}}>
                {stk<=0?"RUPTURE":stk<=5?`⚠ ${stk}`:stk<99?`${stk}`:"✓"}
              </div>
              <div style={{position:"absolute",left:8,right:8,bottom:6,textAlign:"left"}}>
                <div style={{fontSize:12,fontWeight:800,color:"white",textShadow:"0 1px 3px rgba(0,0,0,0.85)",lineHeight:1.2,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                  <div style={{fontSize:14,fontWeight:900,color:"white",textShadow:"0 1px 3px rgba(0,0,0,0.85)"}}>{fmt(p.price)}</div>
                  {p.sellByVolume&&<div style={{fontSize:9,color:"rgba(255,255,255,0.85)"}}>au {p.unit}</div>}
                </div>
              </div>
            </>:<>
              <div style={{fontSize:36,marginBottom:6}}>{p.emoji}</div>
              {p.drink&&stk>0&&<div style={{fontSize:10,color:T.orange,fontWeight:700,marginBottom:2}}>🍺 Offrable</div>}
              <div style={{fontSize:12,fontWeight:700,color:T.dark,marginBottom:3,lineHeight:1.2}}>{p.name}</div>
              <div style={{fontSize:13,fontWeight:800,color:T.red}}>{fmt(p.price)}</div>
              {p.sellByVolume&&<div style={{fontSize:10,color:T.mid,marginTop:2}}>au {p.unit}</div>}
              <div style={{fontSize:10,fontWeight:600,color:stockC(stk),marginTop:3}}>
                {stk<=0?"RUPTURE":stk<=5?`⚠ ${stk}`:stk<99?`${stk} dispo`:"✓"}
              </div>
            </>}
          </button>
          {reorderMode&&<div style={{position:"absolute",top:4,right:4,width:24,height:24,borderRadius:6,background:"rgba(0,0,0,0.6)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"white",pointerEvents:"none"}}>⠿</div>}
          </div>)];
        };
        const buildComboTile=(combo)=>{
          const cid="combo-"+combo.id;
          const stockOk=combo.items.every(it=>{
            const prod=products.find(p=>p.id.toString()===it.productId.toString());
            return prod&&(prod.stock[siteId]||0)>=it.qty;
          });
          return(<div key={cid} data-pid={cid} onPointerDown={()=>startDrag(cid)}
            style={{position:"relative",touchAction:reorderMode?"none":"auto",
              opacity:dragId===cid?0.35:1,
              outline:reorderMode&&dragOverId===cid&&dragId!==cid?`3px dashed ${T.red}`:"none",
              outlineOffset:2,borderRadius:14}}>
          <button onClick={()=>{if(reorderMode)return;stockOk&&addComboToCart(combo);}} disabled={!stockOk&&!reorderMode}
            style={combo.photo?{position:"relative",width:"100%",height:132,borderRadius:14,overflow:"hidden",padding:0,
                cursor:reorderMode?"grab":stockOk?"pointer":"not-allowed",opacity:stockOk||reorderMode?1:.45,
                border:`2px solid #5856D6`,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}
              :{width:"100%",background:"#EEF0FF",border:"2px solid #5856D6",borderRadius:14,padding:"14px 8px",
                cursor:reorderMode?"grab":stockOk?"pointer":"not-allowed",opacity:stockOk||reorderMode?1:.45,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}
            onMouseDown={e=>!reorderMode&&stockOk&&(e.currentTarget.style.transform="scale(0.94)")}

// ═══ VOLUME MODAL ═══
function VolumeModal({prod,onClose,onAdd,portions}){
  // Portions configurées (table dédiée, avec prix FIXE chacune, pas forcément
  // proportionnel — un pichet coûte souvent moins cher que 4x le prix du verre).
  const configured=(portions||[]).filter(po=>po.productId.toString()===prod.id.toString())
    .map(po=>({qty:po.size,price:po.price}));
  const presets=configured.length?configured:[1,2,3].map(m=>({qty:prod.baseQty*m,price:+(prod.price*m).toFixed(2)}));
  const [selectedIdx,setSelectedIdx]=useState(0);
  const [customQty,setCustomQty]=useState(null); // non-null dès qu'on ajuste manuellement (+/-)
  const selected=presets[selectedIdx]||presets[0];
  const qty=customQty!=null?customQty:(selected?.qty||prod.baseQty);
  // Hors palier configuré : calcul proportionnel au prix de base (prix / baseQty) du produit.
  const price=customQty!=null?+(prod.price*customQty/prod.baseQty).toFixed(2):(selected?.price||0);
  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:250,display:"flex",alignItems:"center",justifyContent:"center",padding:16};
  const adjust=d=>{const base=customQty!=null?customQty:qty; setCustomQty(Math.max(1,base+d));};
  return(<div style={ov}>
    <div style={{background:T.card,borderRadius:20,padding:24,width:"100%",maxWidth:340,textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:8}}>{prod.emoji}</div>
      <div style={{fontWeight:700,fontSize:18,color:T.dark,marginBottom:4}}>{prod.name}</div>
      <div style={{fontSize:13,color:T.mid,marginBottom:20}}>Vente au {prod.unit} — base {fmt(prod.price)} / {prod.baseQty}{prod.unit}</div>
      <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:14,flexWrap:"wrap"}}>
        {presets.map((p,i)=><button key={i} onClick={()=>{setSelectedIdx(i);setCustomQty(null);}}
          style={{padding:"8px 12px",background:customQty==null&&i===selectedIdx?T.red:T.bg,border:`1px solid ${customQty==null&&i===selectedIdx?T.red:T.border}`,
            borderRadius:10,cursor:"pointer",color:customQty==null&&i===selectedIdx?"white":T.dark,fontWeight:700,fontSize:13,textAlign:"center"}}>
          <div>{p.qty}{prod.unit}</div>
          <div style={{fontSize:11,opacity:.85}}>{fmt(p.price)}</div>
        </button>)}
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:14}}>
        <button onClick={()=>adjust(-1)} style={{width:46,height:46,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:22}}>−</button>
        <div>
          <div style={{fontSize:40,fontWeight:900,color:T.dark,lineHeight:1}}>{qty}</div>
          <div style={{fontSize:12,color:T.mid}}>{prod.unit}</div>
        </div>
        <button onClick={()=>adjust(1)} style={{width:46,height:46,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:22}}>+</button>
      </div>
      {customQty!=null&&<div style={{fontSize:11,color:T.mid,marginTop:-8,marginBottom:12}}>Quantité ajustée : prix calculé au prorata</div>}
      <div style={{background:T.bg,borderRadius:12,padding:"12px 20px",marginBottom:16,
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:15,color:T.dark,fontWeight:600}}>{qty} {prod.unit}</span>
        <span style={{fontSize:22,fontWeight:900,color:T.red}}>{fmt(price)}</span>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onClose} style={{flex:1,padding:"13px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:"pointer",fontWeight:600}}>Annuler</button>
        <button onClick={()=>onAdd(prod,qty,prod.unit,price)} style={{flex:2,padding:"13px",background:T.red,color:"white",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:15}}>
          + Ajouter {fmt(price)}
        </button>
      </div>
    </div>
  </div>);
}

function PaymentModal({cart,total,site,boissonsUrl,onClose,onDone,setCart,sumupKey,sumupAppId,openBoissons,openSplit}){
  const [step,setStep]=useState("select");
  const [given,setGiven]=useState("");const [checkN,setCheckN]=useState("");
  const [submitting,setSubmitting]=useState(false); // anti double-clic / double-encaissement
  const drinkItems=cart.filter(i=>i.drink);const freeItems=cart.filter(i=>i.free);
  const paidTotal=cart.reduce((s,i)=>s+(i.free?0:i.price*i.qty),0);
  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"};
  const sh={background:T.card,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:500,padding:"20px 18px 34px",maxHeight:"92vh",overflowY:"auto"};

  // Empêche de valider deux fois (double-clic, double-tap) : le bouton se bloque dès
  // le premier clic. onDone déclenche ensuite finalizeSale (async) qui referme cette
  // fenêtre une fois terminé — pas besoin de réarmer submitting après coup.
  const submit=payment=>{ if(submitting)return; setSubmitting(true); onDone(payment); };
  const handleSumUp=()=>{
    if(submitting)return; setSubmitting(true);
    if(!sumupKey){
      window.alert("⚠️ Aucune clé SumUp (Affiliate Key) configurée. Allez dans ⚙️ Configuration pour la renseigner — sans elle, l'appli SumUp reçoit la demande de paiement mais l'ignore silencieusement (c'est exactement ce qui se passait avant ce correctif).");
      setSubmitting(false);return;
    }
    // Format exact documenté par SumUp (developer.sumup.com/terminal-payments/payment-switch/android) :
    // chemin "/1.0", "total" (remplace l'ancien "amount"), affiliate-key + app-id
    // obligatoires, et un foreign-tx-id unique par paiement pour le suivi.
    const a=paidTotal.toFixed(2);
    const desc=encodeURIComponent("ANF87 "+site.name+" - "+cart.map(i=>i.name).join(", ").slice(0,50));
    const txId=uid();
    let url=`sumupmerchant://pay/1.0?affiliate-key=${encodeURIComponent(sumupKey)}&total=${a}&currency=EUR&title=${desc}&foreign-tx-id=${txId}`;
    if(sumupAppId)url+=`&app-id=${encodeURIComponent(sumupAppId)}`;
    window.location.href=url;
    setTimeout(()=>{if(window.confirm("✅ Paiement CB confirmé par le TPE SumUp ?"))onDone({type:"cb"});else setSubmitting(false);},2000);
  };
  const doCashPayment=g=>{if(submitting)return;if(isNaN(g)||g<paidTotal)return;setSubmitting(true);onDone({type:"cash",given:g,change:+(g-paidTotal).toFixed(2)});};
  const handleCash=()=>{doCashPayment(parseFloat(given.replace(",",".")));};

  return(<div style={ov} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={sh}>
      <div style={{width:40,height:4,background:T.border,borderRadius:2,margin:"0 auto 18px"}}/>
      {step==="select"&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:20,color:T.dark}}>Encaissement</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:T.mid}}>✕</button>
        </div>
        <div style={{background:T.red,borderRadius:16,padding:"16px 20px",marginBottom:14,color:"white"}}>
          <div style={{fontSize:11,opacity:.75,marginBottom:3}}>TOTAL À ENCAISSER</div>
          <div style={{fontSize:38,fontWeight:900,fontVariantNumeric:"tabular-nums"}}>{fmt(paidTotal)}</div>
          <div style={{fontSize:12,opacity:.65,marginTop:2}}>{site.name} • {cart.reduce((s,i)=>s+i.qty,0)} article(s)</div>
        </div>
        {/* Diviser la note */}
        <button onClick={openSplit} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#F0F4FF",border:`2px dashed ${T.blue}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🔢</div>
          <div><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Diviser la note</div>
            <div style={{fontSize:12,color:T.mid}}>Parts égales ou montants personnalisés</div></div>
        </button>
        {/* Carte boissons */}
        {drinkItems.length>0&&<button onClick={openBoissons} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#FFF8E1",border:`2px dashed ${T.orange}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.orange,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🍺</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Carte Boissons ANF 87</div>
            <div style={{fontSize:12,color:T.mid}}>{drinkItems.length} boisson(s) éligible(s)</div></div>
          {freeItems.length>0&&<span style={{background:T.green,color:"white",borderRadius:8,padding:"2px 8px",fontSize:12,fontWeight:700}}>{freeItems.length} offertes</span>}
        </button>}
        {/* Consos offertes match (joueurs/dirigeants/arbitres) */}
        <button onClick={()=>setStep("matchOffert")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#E8F5E9",border:`2px dashed ${T.green}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>⚽</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Consos offertes match</div>

        <PaymentOptionButton e="📝" l="Chèque" s="Saisir numéro de chèque" c={T.blue} onClick={()=>setStep("check")}/>
        <PaymentOptionButton e="💳" l={submitting?"⏳ Validation...":"Carte Bleue — SumUp"} s="Lance directement le TPE SumUp" c="#5856D6" onClick={handleSumUp} disabled={submitting}/>
      </>}
      {step==="matchOffert"&&<>
        <button onClick={()=>setStep("select")} style={{background:"none",border:"none",cursor:"pointer",color:T.mid,display:"flex",alignItems:"center",gap:4,marginBottom:14,fontSize:14}}>← Retour</button>

function SplitModal({total,onClose,onComplete}){
  const [mode,setMode]=useState("equal");
  const [persons,setPersons]=useState(2);
  const [amounts,setAmounts]=useState([]);
  const [payments,setPayments]=useState([]); // [{idx,type,amount,given,change,checkNum}]
  const [activeIdx,setActiveIdx]=useState(null);
  const [step,setStep]=useState("select");
  const [given,setGiven]=useState("");const [checkN,setCheckN]=useState("");
  const [completing,setCompleting]=useState(false); // anti double-clic sur le dernier paiement
  const perPerson=+(total/persons).toFixed(2);
  const paidTotal=payments.reduce((s,p)=>s+p.amount,0);
  const remaining=Math.max(0,+(total-paidTotal).toFixed(2));
  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:250,display:"flex",alignItems:"flex-end",justifyContent:"center"};

  useEffect(()=>{ if(mode==="custom")setAmounts(Array(persons).fill(""));},[persons,mode]);

  const amountFor=idx=>mode==="equal"?perPerson:+(parseFloat(amounts[idx])||0).toFixed(2);

  const openPay=idx=>{ if(amountFor(idx)<=0)return; setActiveIdx(idx);setStep("select");setGiven("");setCheckN(""); };
  const closePay=()=>{setActiveIdx(null);setStep("select");};

  const confirmPayment=(type,extra)=>{
    if(completing)return;
    const amt=amountFor(activeIdx);
    const newPayments=[...payments,{idx:activeIdx,type,amount:amt,...(extra||{})}];
    setPayments(newPayments);
    closePay();
    const stillOwed=+(total-newPayments.reduce((s,p)=>s+p.amount,0)).toFixed(2);
    if(stillOwed<=0.001){setCompleting(true);onComplete(newPayments);}
  };

  const activeAmt=activeIdx!=null?amountFor(activeIdx):0;
  const typeLabel={cash:"💵 Espèces",cb:"💳 Carte",check:"📝 Chèque"};

  return(<div style={ov} onClick={e=>e.target===e.currentTarget&&activeIdx===null&&onClose()}>

      {activeIdx===null?<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>

        </div>
        {/* Mode */}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["equal","Parts égales"],["custom","Montants libres"]].map(([v,l])=>(
            <button key={v} disabled={payments.length>0} onClick={()=>setMode(v)} style={{flex:1,padding:"10px",background:mode===v?T.red:T.bg,
              border:`1px solid ${mode===v?T.red:T.border}`,borderRadius:10,color:mode===v?"white":T.dark,
              fontWeight:600,fontSize:13,cursor:payments.length>0?"not-allowed":"pointer",opacity:payments.length>0?.6:1}}>{l}</button>
          ))}
        </div>
        {/* Nb personnes */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,background:T.bg,borderRadius:12,padding:"12px 16px"}}>
          <span style={{fontSize:15,fontWeight:600,color:T.dark}}>Nombre de personnes</span>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button disabled={payments.length>0} onClick={()=>setPersons(Math.max(2,persons-1))} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.card,cursor:"pointer",fontSize:18}}>−</button>
            <span style={{fontSize:22,fontWeight:800,minWidth:32,textAlign:"center"}}>{persons}</span>
            <button disabled={payments.length>0} onClick={()=>setPersons(persons+1)} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.card,cursor:"pointer",fontSize:18}}>+</button>
          </div>
        </div>
        {/* Parties */}
        {Array.from({length:persons},(_, i)=>{
          const paid=payments.find(p=>p.idx===i);
          return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,
            background:paid?"#E8F5E9":T.bg,borderRadius:12,padding:"12px 14px",
            border:`1px solid ${paid?"#A5D6A7":T.border}`}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Personne {i+1}</div>
              {mode==="equal"?<div style={{fontSize:16,fontWeight:900,color:T.red}}>{fmt(perPerson)}</div>

                  style={{width:"100%",padding:"6px 10px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:15,fontWeight:700,outline:"none",marginTop:4}}/>}

            </div>

        <div style={{background:T.red,borderRadius:14,padding:"14px 18px",marginBottom:16,color:"white"}}>
          <div style={{fontSize:11,opacity:.75}}>MONTANT À ENCAISSER</div>
          <div style={{fontSize:30,fontWeight:900}}>{fmt(activeAmt)}</div>
        </div>
        {step==="select"&&<>
          <button onClick={()=>setStep("cash")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:"pointer",marginBottom:9,textAlign:"left"}}>
            <div style={{width:40,height:40,borderRadius:10,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>💵</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Espèces</div>
          </button>
          <button onClick={()=>setStep("check")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:"pointer",marginBottom:9,textAlign:"left"}}>
            <div style={{width:40,height:40,borderRadius:10,background:T.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>📝</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Chèque</div>

          <button onClick={()=>confirmPayment("cb")} disabled={completing} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:completing?"#f0f0f0":T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:completing?"default":"pointer",textAlign:"left",opacity:completing?.6:1}}>
            <div style={{width:40,height:40,borderRadius:10,background:"#5856D6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>💳</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>{completing?"⏳ Validation...":"Carte Bleue"}</div>

          <input value={given} onChange={e=>{setGiven(e.target.value);const g=parseFloat(e.target.value.replace(",","."));if(!completing&&!isNaN(g)&&Math.abs(g-activeAmt)<0.001)confirmPayment("cash",{given:g,change:0});}} type="number" step="0.50" placeholder="0,00"
