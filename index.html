        {validating?"⏳ Validation...":"✓ Valider l'entrée"}
      </button>
    </div>}
  </div>);
}

function StockTransfer({products,sites,caisseUrl,onSave,reserve,setReserve}){
  const [from,setFrom]=useState(sites[0]?.id||"s1");
  const [to,setTo]=useState(sites[1]?.id||"s2");
  const [qtys,setQtys]=useState({});
  const [contCounts,setContCounts]=useState({}); // {productId: {labelContenant: nombre}}
  const [msg,setMsg]=useState("");
  const [transferring,setTransferring]=useState(false); // affiche l'animation le temps du transfert
  const fromSite=sites.find(s=>s.id===from), toSite=sites.find(s=>s.id===to);

  // Transfert par contenant (ex: 2 Fûts 20L) : recalcule automatiquement le total en
  // cl/g à partir du nombre de contenants de chaque taille, et l'applique au champ
  // quantité — pas besoin de faire le calcul soi-même.
  const setContainerCount=(p,label,val)=>{
    const newCount=Math.max(0,+val||0);
    const productCounts={...(contCounts[p.id]||{}),[label]:newCount};
    const allPresets=parseContainers(p.containers);
    const total=allPresets.reduce((s,c)=>s+((+productCounts[c.label]||0)*c.size),0);
    setContCounts(prev=>({...prev,[p.id]:productCounts}));
    setQtys(q=>({...q,[p.id]:Math.min(p.stock[from]||0,total)}));
  };

  const transfer=async()=>{
    const items=Object.entries(qtys).filter(([_,q])=>+q>0).map(([id,q])=>({id,qty:+q}));
    if(!items.length||transferring)return;
    setTransferring(true);
    const upd=products.map(p=>{const q=+qtys[p.id]||0;if(!q)return p;
      return{...p,stock:{...p.stock,[from]:Math.max(0,(p.stock[from]||0)-q),[to]:(p.stock[to]||0)+q}};});
    onSave(upd);
    if(caisseUrl){
      await apiWrite(caisseUrl,{action:"transferStock",from,to,items:JSON.stringify(items)});
      // Transfère aussi le nombre de contenants en réserve (pas seulement la
      // quantité en cl/g) : sans ça, "Ouvrir un fût" restait faussé sur les deux
      // sites après un transfert par contenant.
      for(const[pid,counts]of Object.entries(contCounts)){
        const prod=products.find(p=>p.id.toString()===pid.toString());
        if(!prod)continue;
        const allPresets=parseContainers(prod.containers);
        for(const c of allPresets){
          const n=+counts[c.label]||0;
          if(n<=0)continue;
          await apiWrite(caisseUrl,{action:"addToReserve",site:from,id:pid,label:c.label,size:c.size,count:-n});
          await apiWrite(caisseUrl,{action:"addToReserve",site:to,id:pid,label:c.label,size:c.size,count:n});
          setReserve&&setReserve(prev=>{
            let next=prev.slice();
            const applyDelta=(site,delta)=>{
              const idx=next.findIndex(r=>r.site===site&&r.productId.toString()===pid.toString()&&r.label===c.label&&r.size===c.size);
              if(idx>=0)next[idx]={...next[idx],count:Math.max(0,next[idx].count+delta)};
              else next.push({site,productId:pid,label:c.label,size:c.size,count:Math.max(0,delta)});
            };
            applyDelta(from,-n);applyDelta(to,n);
            return next;
          });
        }
      }
    }
    // On laisse le temps à l'animation (camion qui traverse) de se terminer visuellement
    // avant d'afficher la confirmation, plutôt que de la couper en plein milieu.
    setTimeout(()=>{
      setTransferring(false);
      setMsg(`✅ Transfert effectué: ${items.length} produit(s) de ${fromSite?.name} vers ${toSite?.name}`);
      setQtys({});setContCounts({});setTimeout(()=>setMsg(""),4000);
    },1300);
  };

  return(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    {/* En-tête FIXE : sites, bouton et animation restent toujours visibles, même en
        ayant fait défiler la liste des produits en dessous — avant ce correctif,
        l'animation (en haut) et le bouton (en bas de liste) n'étaient jamais visibles
        en même temps. */}
    <div style={{flexShrink:0,padding:"14px 14px 10px",borderBottom:`1px solid ${T.border}`,background:T.bg}}>
      <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:12}}>↔ Transfert multi-produits</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        {[["De (source)",from,setFrom,fromSite],["Vers (dest.)",to,setTo,toSite]].map(([label,val,setter,s],i)=>(
          <div key={i}>
            <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:5}}>{label}</label>
            <select value={val} onChange={e=>setter(e.target.value)}
              style={{width:"100%",padding:"10px",border:`1px solid ${s?.color||T.border}`,borderRadius:10,fontSize:13,outline:"none",
                background:s?.color||T.card,color:s?.color?"white":T.dark,fontWeight:s?.color?700:400}}>
              {sites.map(st=><option key={st.id} value={st.id} style={{background:"white",color:T.dark}}>{st.name}</option>)}
            </select>
          </div>
        ))}
      </div>
      {msg&&<div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:13,fontWeight:600,color:"#2E7D32"}}>{msg}</div>}
      {/* Bouton avec l'animation directement à l'intérieur — toujours au même endroit
          que le clic, plus besoin de chercher où regarde le camion. */}
      <button onClick={transfer} disabled={!Object.values(qtys).some(q=>+q>0)||transferring}
        style={{position:"relative",width:"100%",padding:"14px",overflow:"hidden",
          background:transferring?T.dark:(Object.values(qtys).some(q=>+q>0)?T.red:"#ccc"),color:"white",
          border:"none",borderRadius:12,cursor:transferring?"default":"pointer",fontWeight:700,fontSize:15}}>
        {transferring?<>
          <span style={{opacity:.7,fontSize:11}}>{fromSite?.name} → {toSite?.name}</span>
          <span className="transfer-truck">🚚</span>
        </>:"↔ Effectuer le transfert"}
      </button>
    </div>

    <div style={{flex:1,overflowY:"auto",padding:14}}>
      <div style={{fontWeight:700,fontSize:13,color:T.mid,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Quantités à transférer</div>
      {products.map(p=>{
        const avail=p.stock[from]||0;if(avail===0)return null;
        const presets=p.sellByVolume?parseContainers(p.containers):[];
        return(<div key={p.id} style={{background:T.card,borderRadius:10,border:`1px solid ${T.border}`,marginBottom:7,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px"}}>
            {p.photo?<img src={p.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{p.emoji}</span>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
              <div style={{fontSize:11,color:T.mid}}>Dispo: {avail}{p.sellByVolume?p.unit||"cl":""}</div>
            </div>
            <input value={qtys[p.id]||""} onChange={e=>{setQtys(q=>({...q,[p.id]:Math.min(avail,Math.max(0,+e.target.value||0))}));setContCounts(c=>({...c,[p.id]:{}}));}}
              type="number" min="0" max={avail} placeholder="0"
              style={{width:60,padding:"7px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:14,fontWeight:700,textAlign:"center",outline:"none"}}/>
          </div>
          {/* Transfert par contenant (ex: 2 Fûts 20L) — calcule automatiquement
              l'équivalent en cl/g dans le champ quantité ci-dessus, ET affiche le
              nombre actuellement en réserve sur le site source. */}
          {presets.length>0&&<div style={{padding:"0 14px 10px",display:"flex",flexWrap:"wrap",gap:8}}>
            {presets.map((c,i)=>{
              const avail_n=containerAvailable(reserve,0,from,p.id,c.label,c.size);
              return(<div key={i} style={{display:"flex",alignItems:"center",gap:5,background:T.bg,borderRadius:7,padding:"4px 8px"}}>
                <span style={{fontSize:11,color:T.mid}}>{c.label} <b style={{color:T.dark}}>({avail_n} dispo)</b></span>
                <input type="number" min="0" max={avail_n} value={contCounts[p.id]?.[c.label]||""} placeholder="0"
                  onChange={e=>setContainerCount(p,c.label,Math.min(avail_n,+e.target.value||0))}
                  style={{width:38,padding:"2px 4px",border:`1px solid ${T.border}`,borderRadius:5,fontSize:12,textAlign:"center"}}/>
              </div>);
            })}
          </div>}
        </div>);
      })}
    </div>
  </div>);
}

function ReportsScreen({sites,caisseUrl,products,setCart,setTab,onSaveProducts}){
  const [sales,setSales]=useState([]);const [loading,setLoading]=useState(false);const [period,setPeriod]=useState("today");
  const [viewMonth,setViewMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [selectedDay,setSelectedDay]=useState(null); // "dd/mm/yyyy" sélectionné dans le calendrier
  const [openSale,setOpenSale]=useState(null); // vente dont on affiche le détail
  const pad2=n=>String(n).padStart(2,"0");
  const todayD=new Date();
  const today=`${pad2(todayD.getDate())}/${pad2(todayD.getMonth()+1)}/${todayD.getFullYear()}`;
  useEffect(()=>{loadSales();},[]);
  const loadSales=async()=>{if(!caisseUrl)return;setLoading(true);
    const r=await api(caisseUrl,{action:"getSales"});if(r.ok)setSales(r.sales||[]);setLoading(false);};

  // Total € par jour (clé "dd/mm/yyyy"), pour l'affichage dans le calendrier.
  const totalsByDay=(()=>{
    const map={};
    sales.forEach(s=>{ map[s.date]=(map[s.date]||0)+(+s.total||0); });
    return map;
  })();

  const filtered=period==="today"?sales.filter(s=>s.date===today)
    :period==="calendar"&&selectedDay?sales.filter(s=>s.date===selectedDay)
    :period==="all"?sales:[];
  const totalCA=filtered.reduce((a,s)=>a+(+s.total||0),0);
  const bySite=sites.map(s=>({...s,ca:filtered.filter(v=>v.siteId===s.id).reduce((a,v)=>a+(+v.total||0),0),nb:filtered.filter(v=>v.siteId===s.id).length}));

  // Grille du mois affiché (calendrier)
  const calDays=(()=>{
    const {y,m}=viewMonth;
    const first=new Date(y,m,1);
    const startOffset=(first.getDay()+6)%7; // lundi=0
    const daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<startOffset;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    return cells;
  })();
  const monthLabel=new Date(viewMonth.y,viewMonth.m,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const dateKeyFor=d=>`${pad2(d)}/${pad2(viewMonth.m+1)}/${viewMonth.y}`;

  const reorder=sale=>{
    let items=[]; try{items=JSON.parse(sale.items||"[]");}catch{}
    const newCart=items.map(it=>{
      const prod=products.find(p=>p.id.toString()===it.id.toString());
      if(!prod)return null;
      // Pour un produit vendu au volume, it.qty stocké dans la vente est le total de
      // cl consommés (ex: 644cl), PAS un nombre d'unités — le prix du produit, lui,
      // est par portion de base (ex: 2,50€ les 25cl). Les traiter comme un simple
      // nombre d'unités multipliait le prix par le nombre de cl (644× au lieu de
      // ramener au cl d'abord) — d'où le montant totalement aberrant constaté.
      if(prod.sellByVolume){
        const vol=+it.qty||0;
        const unitPrice=(prod.price||0)/(prod.baseQty||1);
        return{id:prod.id+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),pid:prod.id,
          name:prod.name+" "+vol+(prod.unit||"cl"),price:+(unitPrice*vol).toFixed(2),qty:1,vol:vol,
          emoji:prod.emoji,photo:prod.photo,drink:prod.drink,free:false,unit:prod.unit||"cl"};
      }
      return{id:prod.id,pid:prod.id,name:prod.name,price:prod.price,qty:it.qty,emoji:prod.emoji,photo:prod.photo,drink:prod.drink,free:false,unit:"unité"};
    }).filter(Boolean);
    if(newCart.length===0){window.alert("⚠️ Aucun des produits de cette commande n'existe encore dans le catalogue.");return;}
    setCart(newCart);setTab("pos");setOpenSale(null);
  };

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
      <div style={{display:"flex",gap:7}}>
        {[["today","Aujourd'hui"],["calendar","📅 Calendrier"],["all","Tout"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setPeriod(v);if(v!=="calendar")setSelectedDay(null);}} style={{padding:"6px 14px",borderRadius:20,border:"none",
            background:period===v?T.red:T.card,color:period===v?"white":T.dark,fontSize:12,fontWeight:600,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
            {l}
          </button>
        ))}
      </div>
      <button onClick={loadSales} style={{padding:"6px 12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>{loading?"⏳":"↻"}</button>
    </div>
    {!caisseUrl&&<div style={{background:"#FFF3E0",borderRadius:10,padding:14,fontSize:13,marginBottom:12}}>⚙️ Configurez l'URL Apps Script dans Config.</div>}

    {period==="calendar"&&<>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <button onClick={()=>setViewMonth(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1})} style={{padding:"6px 12px",background:T.card,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:14}}>◀</button>
        <div style={{fontWeight:700,fontSize:14,color:T.dark,textTransform:"capitalize"}}>{monthLabel}</div>
        <button onClick={()=>setViewMonth(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1})} style={{padding:"6px 12px",background:T.card,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:14}}>▶</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {["L","M","M","J","V","S","D"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,color:T.mid,fontWeight:700}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:16}}>
        {calDays.map((d,i)=>{
          if(d===null)return <div key={i}/>;
          const key=dateKeyFor(d);
          const dayTotal=totalsByDay[key]||0;
          const isToday=key===today;
          const isSelected=key===selectedDay;
          return(<button key={i} onClick={()=>setSelectedDay(key)}
            style={{aspectRatio:"1",borderRadius:8,border:`1.5px solid ${isSelected?T.red:isToday?T.dark:T.border}`,
              background:isSelected?T.red:dayTotal>0?"#FFF3E0":T.card,cursor:"pointer",padding:2,
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:11,fontWeight:isToday?800:600,color:isSelected?"white":T.dark}}>{d}</span>
            {dayTotal>0&&<span style={{fontSize:8,fontWeight:700,color:isSelected?"white":T.orange}}>{fmt(dayTotal)}</span>}
          </button>);
        })}
      </div>
      {!selectedDay&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:20}}>Touchez un jour pour voir ses ventes.</div>}
    </>}

    {(period!=="calendar"||selectedDay)&&<>
      <div style={{background:T.red,borderRadius:14,padding:"18px 16px",marginBottom:14,color:"white"}}>
        <div style={{fontSize:11,opacity:.75,marginBottom:2}}>{period==="calendar"?selectedDay:"CHIFFRE D'AFFAIRES"}</div>
        <div style={{fontSize:36,fontWeight:900}}>{fmt(totalCA)}</div>
        <div style={{fontSize:12,opacity:.65}}>{filtered.length} vente(s)</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {bySite.map(s=><div key={s.id} style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:s.color,display:"inline-block"}}/>
            <span style={{fontSize:11,fontWeight:600,color:T.mid}}>{s.name}</span>
          </div>
          <div style={{fontSize:20,fontWeight:800,color:T.dark}}>{fmt(s.ca)}</div>
          <div style={{fontSize:11,color:T.mid}}>{s.nb} vente(s)</div>
        </div>)}
      </div>
      {filtered.slice(0,50).map(tx=>{
        let payType=null; try{payType=JSON.parse(tx.payment||"{}").type;}catch{}
        const isMatchOffert=payType==="matchOffert";
        return(<button key={tx.id} onClick={()=>setOpenSale(tx)} style={{width:"100%",textAlign:"left",background:isMatchOffert?"#E8F5E9":T.card,borderRadius:10,padding:"10px 14px",marginBottom:6,border:`1px solid ${isMatchOffert?"#A5D6A7":T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <div><div style={{fontSize:13,fontWeight:600,color:T.dark}}>{tx.time} • {sites.find(s=>s.id===tx.siteId)?.name||tx.siteId}</div>
          <div style={{fontSize:11,color:T.mid}}>{tx.caissier&&"👤 "+tx.caissier}{tx.member&&" • 🍺 "+tx.member}{isMatchOffert&&" • ⚽ Offert match"}</div></div>
        <div style={{fontWeight:800,color:isMatchOffert?T.green:T.red,fontSize:15}}>{isMatchOffert?"Offert":fmt(+tx.total)}</div>
      </button>);})}
    </>}

    {openSale&&<SaleDetailModal sale={openSale} sites={sites} products={products} caisseUrl={caisseUrl} onSaveProducts={onSaveProducts}
      onClose={()=>setOpenSale(null)} onReorder={reorder}
      onSaleUpdated={updated=>{ setSales(prev=>prev.map(s=>s.id===updated.id?{...s,...updated}:s)); setOpenSale(updated); }}
      onSaleDeleted={id=>{ setSales(prev=>prev.filter(s=>s.id!==id)); setOpenSale(null); }}/>}
  </div>);
}

// ═══ DÉTAIL D'UNE VENTE (avec photos des produits, et reprise en panier) ═══
function SaleDetailModal({sale,sites,products,caisseUrl,onSaveProducts,onClose,onReorder,onSaleUpdated,onSaleDeleted}){
  const [editMode,setEditMode]=useState(false);
  const [saving,setSaving]=useState(false);
  let items=[]; try{items=JSON.parse(sale.items||"[]");}catch{}
  const lines=items.map(it=>({...it,prod:products.find(p=>p.id.toString()===it.id.toString())}));
  const [editedQtys,setEditedQtys]=useState(()=>Object.fromEntries(lines.map((l,i)=>[i,l.qty])));
  let payType=null,payDetail=null; try{const pj=JSON.parse(sale.payment||"{}");payType=pj.type;payDetail=pj;}catch{}
  const [editedPayment,setEditedPayment]=useState(payType||"cash");
  const payLabel={cash:"💵 Espèces",cb:"💳 Carte Bleue",check:"📝 Chèque",split:"🔢 Note divisée",matchOffert:"⚽ Offert match",free_drinks:"🍺 Boissons offertes"}[payType]||"—";
  const paySimpleOptions=[["cash","💵 Espèces"],["cb","💳 Carte Bleue"],["check","📝 Chèque"],["matchOffert","⚽ Offert match"]];

  // Prix d'une ligne au tarif ACTUEL du catalogue : pour un produit au volume, qty
  // représente des cl (pas un nombre d'unités) — même logique que "Recommencer cette
  // commande", pour ne jamais reproduire l'erreur de calcul déjà rencontrée.
  const lineTotal=(prod,qty)=>{
    if(!prod)return 0;
    if(prod.sellByVolume)return((prod.price||0)/(prod.baseQty||1))*qty;
    return(prod.price||0)*qty;
  };
  const editedTotal=lines.reduce((s,l,i)=>s+lineTotal(l.prod,+editedQtys[i]||0),0);

  const startEdit=()=>{setEditedQtys(Object.fromEntries(lines.map((l,i)=>[i,l.qty])));setEditMode(true);};

  const saveEdits=async()=>{
    if(saving)return;setSaving(true);
    // Nouveau détail (on retire les lignes ramenées à 0) + nouveau total au tarif actuel.
    const newItems=lines.map((l,i)=>({id:l.id,qty:+editedQtys[i]||0})).filter(it=>it.qty>0);
    // Si le nouveau mode de paiement est "Offert match", le total devient 0€ — comme
    // pour n'importe quelle vente de ce type (le stock, lui, reste bien décompté).
    const newTotal=editedPayment==="matchOffert"?0:+editedTotal.toFixed(2);
    const nbItems=newItems.reduce((s,it)=>s+it.qty,0);

    // Écart de stock par produit : ce qui a changé entre l'ancien et le nouveau
    // contenu doit être répercuté sur le stock du SITE de cette vente (pas forcément
    // le site actuellement sélectionné dans l'appli).
    const deltaByProduct={};
    lines.forEach((l,i)=>{ deltaByProduct[l.id]=(deltaByProduct[l.id]||0)+((+l.qty||0)-(+editedQtys[i]||0)); });
    const deltaEntries=Object.entries(deltaByProduct).filter(([_,d])=>d!==0);

    if(caisseUrl){
      const newPayment=JSON.stringify(editedPayment==="matchOffert"?{type:"matchOffert"}:{type:editedPayment});
      const r=await apiWrite(caisseUrl,{action:"updateSale",id:sale.id,total:newTotal,items:JSON.stringify(newItems),nbItems,payment:newPayment});
      if(!r.ok){window.alert("⚠️ Échec de l'enregistrement : "+(r.error||"connexion")+". Rien n'a été modifié.");setSaving(false);return;}
      for(const[pid,delta]of deltaEntries){
        await apiWrite(caisseUrl,{action:"updateStock",id:pid,site:sale.siteId,qty:delta,mode:"delta"});
      }
    }
    // Reflet local immédiat du stock (le delta positif = on rend du stock, négatif = on en reprend).
    if(deltaEntries.length&&onSaveProducts){
      const upd=products.map(p=>{
        const d=deltaByProduct[p.id];
        if(!d)return p;
        return{...p,stock:{...p.stock,[sale.siteId]:Math.max(0,(p.stock[sale.siteId]||0)+d)}};
      });
      onSaveProducts(upd);
    }
    setSaving(false);setEditMode(false);
    onSaleUpdated&&onSaleUpdated({id:sale.id,total:newTotal,items:JSON.stringify(newItems),payment:JSON.stringify(editedPayment==="matchOffert"?{type:"matchOffert"}:{type:editedPayment})});
  };

  // Suppression complète de la vente : tous les articles qu'elle contenait sont
  // remis en stock (site d'origine) avant de supprimer la ligne — sinon le stock
  // resterait décompté pour une vente qui n'existe plus.
  const deleteSale=async()=>{
    if(saving)return;
    if(!window.confirm(`Supprimer définitivement cette vente du ${sale.date} ${sale.time} (${fmt(+sale.total)}) ?\n\nLe stock des articles qu'elle contenait sera remis en stock sur ${sites.find(s=>s.id===sale.siteId)?.name||sale.siteId}.`))return;
    setSaving(true);
    if(caisseUrl){
      for(const it of items){
        if(!it.id||!it.qty)continue;
        await apiWrite(caisseUrl,{action:"updateStock",id:it.id,site:sale.siteId,qty:+it.qty,mode:"delta"});
      }
      const r=await apiWrite(caisseUrl,{action:"deleteSale",id:sale.id});
      if(!r.ok){window.alert("⚠️ Échec de la suppression : "+(r.error||"connexion"));setSaving(false);return;}
    }
    if(onSaveProducts){
      const deltaByProduct={};
      items.forEach(it=>{ if(it.id&&it.qty)deltaByProduct[it.id]=(deltaByProduct[it.id]||0)+(+it.qty); });
      const upd=products.map(p=>{
        const d=deltaByProduct[p.id];
        if(!d)return p;
        return{...p,stock:{...p.stock,[sale.siteId]:(p.stock[sale.siteId]||0)+d}};
      });
      onSaveProducts(upd);
    }
    setSaving(false);
    onSaleDeleted&&onSaleDeleted(sale.id);
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:230,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}
    onClick={e=>e.target===e.currentTarget&&!saving&&onClose()}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
        <div>
          <div style={{fontWeight:800,fontSize:17,color:T.dark}}>{sale.date} — {sale.time}</div>
          <div style={{fontSize:12,color:T.mid}}>{sites.find(s=>s.id===sale.siteId)?.name||sale.siteId} • {payLabel}</div>
        </div>
        {!saving&&<button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:T.mid}}>✕</button>}
      </div>
      {sale.caissier&&<div style={{fontSize:11,color:T.mid,marginBottom:2}}>👤 Caissier : {sale.caissier}</div>}
      {sale.member&&<div style={{fontSize:11,color:T.mid,marginBottom:10}}>🍺 Boissons offertes à : {sale.member}</div>}
      {editMode&&<div style={{background:"#FFF3E0",borderRadius:8,padding:"8px 10px",marginTop:8,marginBottom:4,fontSize:11,color:"#E65100"}}>
        ✏️ Modification de cette vente — la date et l'heure d'origine sont conservées. Le total est recalculé au tarif actuel du catalogue.
      </div>}
      {editMode&&<div style={{marginTop:10}}>
        <label style={{fontSize:11,fontWeight:700,color:T.mid,textTransform:"uppercase",display:"block",marginBottom:6}}>Mode de paiement</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
          {paySimpleOptions.map(([v,l])=>(
            <button key={v} onClick={()=>setEditedPayment(v)} disabled={saving}
              style={{padding:"9px 6px",borderRadius:8,border:`1.5px solid ${editedPayment===v?T.blue:T.border}`,
                background:editedPayment===v?"#EEF0FF":T.card,color:editedPayment===v?T.blue:T.dark,cursor:saving?"default":"pointer",fontWeight:600,fontSize:12}}>
              {l}
            </button>
          ))}
        </div>
      </div>}

      <div style={{marginTop:12,marginBottom:12}}>
        {lines.length===0&&<div style={{fontSize:12,color:T.mid,fontStyle:"italic"}}>Détail des articles non disponible pour cette vente.</div>}
        {lines.map((l,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
            {l.prod?.photo?<img src={l.prod.photo} style={{width:38,height:38,borderRadius:8,objectFit:"cover",flexShrink:0}}/>
              :<span style={{fontSize:24,flexShrink:0}}>{l.prod?.emoji||"❓"}</span>}
            <div style={{flex:1,fontSize:13,color:T.dark}}>{l.prod?.name||"(produit supprimé, ID "+l.id+")"}</div>
            {editMode
              ?<div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" min="0" value={editedQtys[i]} disabled={!l.prod||saving}
                  onChange={e=>setEditedQtys(q=>({...q,[i]:Math.max(0,+e.target.value||0)}))}
                  style={{width:64,padding:"5px 6px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:13,textAlign:"center"}}/>
                {l.prod?.sellByVolume&&<span style={{fontSize:11,color:T.mid}}>{l.prod.unit||"cl"}</span>}
              </div>
              :<div style={{fontSize:13,fontWeight:700,color:T.dark}}>×{l.qty}</div>}
          </div>
        ))}
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:T.bg,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
        <span style={{fontSize:13,fontWeight:700,color:T.dark}}>Total{editMode?" (recalculé)":""}</span>
        <span style={{fontSize:20,fontWeight:900,color:T.red}}>{fmt(editMode?editedTotal:+sale.total)}</span>
      </div>

      {editMode?<>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <button onClick={()=>setEditMode(false)} disabled={saving} style={{flex:1,padding:"12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:saving?"default":"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={saveEdits} disabled={saving} style={{flex:2,padding:"12px",background:saving?"#ccc":T.green,color:"white",border:"none",borderRadius:10,cursor:saving?"default":"pointer",fontWeight:700}}>
            {saving?"⏳ Enregistrement...":"💾 Enregistrer les modifications"}
          </button>
        </div>
        <div style={{fontSize:10,color:T.mid,textAlign:"center"}}>Le stock est ajusté automatiquement selon l'écart avec la vente d'origine.</div>
      </>:<>
        <button onClick={startEdit} style={{width:"100%",padding:"12px",background:"#FF9F0A",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:14,marginBottom:8}}>
          ✏️ Modifier cette vente (même date)
        </button>
        <button onClick={()=>onReorder(sale)} disabled={lines.length===0}
          style={{width:"100%",padding:"12px",background:lines.length===0?"#ccc":T.blue,color:"white",border:"none",borderRadius:10,cursor:lines.length===0?"default":"pointer",fontWeight:700,fontSize:14,marginBottom:8}}>
          🔄 Recommencer cette commande (nouveau panier)
        </button>
        <div style={{fontSize:10,color:T.mid,textAlign:"center",marginBottom:10}}>Remet les mêmes produits dans le panier (aux prix actuels) — n'enregistre rien tant que vous n'encaissez pas.</div>
        <button onClick={deleteSale} disabled={saving} style={{width:"100%",padding:"11px",background:saving?"#eee":"#FFF0F0",border:"1px solid #FFCDD2",borderRadius:10,cursor:saving?"default":"pointer",fontWeight:700,fontSize:13,color:T.red,marginBottom:8}}>
          {saving?"⏳...":"🗑 Supprimer cette vente (remet le stock)"}
        </button>
        <button onClick={onClose} disabled={saving} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:saving?"default":"pointer",fontWeight:600}}>Fermer</button>
      </>}
    </div>
  </div>);
}

function ProdForm({data,setData,onSubmit,label,categories,handlePhoto,onManagePortions,onManageAccompaniments,busy}){
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};
  const videoRef=useRef(null);const readerRef=useRef(null);const camIdRef=useRef(null);
  const [scanningBarcode,setScanningBarcode]=useState(false);
  const [scanMsg,setScanMsg]=useState("");

  useEffect(()=>{ if(scanningBarcode)startBarcodeScan(); return()=>stopBarcodeScan(); },[scanningBarcode]);
  const startBarcodeScan=async(constraints)=>{
    // Même moteur (ZXing) que le scanner de l'écran caisse : BarcodeDetector natif
    // n'existe pas sur iPhone/iPad (Safari) et est peu fiable sur beaucoup d'Android.
    if(!window.ZXing){setScanMsg("Caméra non disponible sur cet appareil");return;}
    try{
      const hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39]);
      const reader=new ZXing.BrowserMultiFormatReader(hints);
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        constraints||getPreferredCameraConstraints()||SCANNER_VIDEO_CONSTRAINTS, videoRef.current,
        (result)=>{
          if(!result)return;
          stopBarcodeScan();setScanningBarcode(false);
          setData(prev=>({...prev,barcode:result.getText().trim()}));
        }
      );
      const track=videoRef.current?.srcObject?.getVideoTracks?.()[0];
      if(track)camIdRef.current=track.getSettings().deviceId;
    }catch{setScanMsg("Caméra non disponible");LS.set("anf87_preferred_camera",null);}
  };
  const stopBarcodeScan=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };

  return(
    <div style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`,marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>{label}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        <input style={inp} placeholder="Nom" value={data.name} onChange={e=>setData({...data,name:e.target.value})}/>
        <input style={inp} placeholder="Prix de vente" type="number" step="0.50" value={data.price} onChange={e=>setData({...data,price:e.target.value})}/>
        <input style={inp} placeholder="Prix d'achat TTC" type="number" step="0.01" value={data.costPrice||""} onChange={e=>setData({...data,costPrice:e.target.value})}/>
        <input style={inp} placeholder="Emoji" value={data.emoji} onChange={e=>setData({...data,emoji:e.target.value})}/>
        <div style={{gridColumn:"1 / -1",display:"flex",gap:7,marginBottom:7}}>
          <input style={{...inp,marginBottom:0,flex:1}} placeholder="Code-barres EAN" value={data.barcode||""} onChange={e=>setData({...data,barcode:e.target.value})}/>
          <button type="button" onClick={()=>{setScanMsg("");setScanningBarcode(s=>!s);}}
            style={{padding:"0 14px",background:scanningBarcode?T.red:T.dark,color:"white",border:"none",borderRadius:8,cursor:"pointer",fontSize:16,flexShrink:0}}>
            {scanningBarcode?"✕":"📷"}
          </button>
        </div>
      </div>
      {scanningBarcode&&<div style={{marginBottom:10}}>
        <video ref={videoRef} onClick={()=>refocusVideo(videoRef.current)} style={{width:"100%",height:160,objectFit:"cover",borderRadius:10,background:"#000",cursor:"pointer"}} muted playsInline/>
        <div style={{fontSize:10,color:T.mid,textAlign:"center",marginTop:2}}>Image floue ? Touchez-la pour refaire la mise au point</div>
        <div style={{fontSize:11,color:T.mid,textAlign:"center",marginTop:4}}>Pointez sur le code-barres du produit</div>
        <button type="button" onClick={()=>switchCamera(videoRef.current,readerRef,camIdRef,startBarcodeScan)}
          style={{width:"100%",marginTop:6,padding:"7px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12}}>🔄 Autre caméra</button>
        {scanMsg&&<div style={{fontSize:11,color:T.red,textAlign:"center",marginTop:2}}>{scanMsg}</div>}
      </div>}
      {data.id?
        <button type="button" onClick={()=>onManageAccompaniments&&onManageAccompaniments(data)} style={{width:"100%",padding:"10px",background:"#6B4F3A",color:"white",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13,marginBottom:9}}>
          🔗 Gérer les accompagnements (gobelet, sucre, touillette…)
        </button>
        :<div style={{fontSize:11,color:T.mid,marginBottom:9,fontStyle:"italic"}}>Enregistrez d'abord le produit, puis modifiez-le pour lui associer des accompagnements automatiques.</div>}
      {data.price&&data.costPrice?(()=>{
        const margeUnit=+data.price-+data.costPrice, margePct=+data.costPrice>0?(margeUnit/+data.costPrice*100):0;
        return(<div style={{background:margeUnit>=0?"#E8F5E9":"#FFEBEE",borderRadius:8,padding:"7px 10px",marginBottom:7,
          fontSize:12,color:margeUnit>=0?"#2E7D32":T.red,fontWeight:600,display:"flex",justifyContent:"space-between"}}>
          <span>Marge unitaire</span><span>{fmt(margeUnit)} ({margePct.toFixed(0)}%)</span>
        </div>);
      })():null}
      <select value={data.cat} onChange={e=>setData({...data,cat:e.target.value})} style={{...inp}}>
        {categories.map(c=><option key={c.id}>{c.name}</option>)}
      </select>
      {/* Photo */}
      <div style={{marginBottom:7}}>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Photo produit (remplace l'emoji sur l'écran caisse)</label>
        {data.photo&&<img src={data.photo} style={{width:50,height:50,borderRadius:8,objectFit:"cover",marginBottom:6,display:"block"}}/>}
        <input type="file" accept="image/*" onChange={e=>handlePhoto(e,setData)}
          style={{fontSize:12,color:T.mid}}/>
        {data.photo&&<button onClick={()=>setData({...data,photo:""})} style={{fontSize:11,color:T.red,background:"none",border:"none",cursor:"pointer",marginTop:3}}>✕ Supprimer la photo</button>}
      </div>
      <div style={{display:"flex",gap:14,marginBottom:8}}>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
          <input type="checkbox" checked={!!data.drink} onChange={e=>setData({...data,drink:e.target.checked})}/> 🍺 Carte Boissons
        </label>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
          <input type="checkbox" checked={!!data.sellByVolume} onChange={e=>setData({...data,sellByVolume:e.target.checked})}/> Vente au verre/volume
        </label>
      </div>
      {data.sellByVolume&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
          <input style={inp} placeholder="Unité (cl, g...)" value={data.unit||""} onChange={e=>setData({...data,unit:e.target.value})}/>
          <input style={{...inp}} type="number" placeholder="Qté de base (ex: 25 pour 25cl)" value={data.baseQty||""} onChange={e=>setData({...data,baseQty:+e.target.value})}/>
        </div>
        {data.id?
          <button type="button" onClick={()=>onManagePortions&&onManagePortions(data)} style={{width:"100%",padding:"10px",background:T.blue,color:"white",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13,marginBottom:9}}>
            🍺 Gérer les portions de vente (demis, pichets, photos…)
          </button>
          :<div style={{fontSize:11,color:T.mid,marginBottom:9,fontStyle:"italic"}}>Enregistrez d'abord le produit, puis modifiez-le pour ajouter ses portions de vente (avec photo).</div>}
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>
          Tailles de contenant (Nom:taille en cl, séparés par virgule)
        </label>
        <input style={inp} placeholder="Ex: Fût 20L:2000,Fût 30L:3000" value={data.containers||""} onChange={e=>setData({...data,containers:e.target.value})}/>
        <div style={{fontSize:11,color:T.mid,marginTop:-3,marginBottom:7}}>
          Ex pour le vin : Bouteille 75cl:75,Cubi 3L:300,Cubi 5L:500. Sert à l'écran "🧴 Contenants" (jauge du fût/bouteille/cubi actuellement entamé). Laissez vide si non concerné.
        </div>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>
          Couleur de la jauge (contenant)
        </label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
          <input type="color" value={data.color||"#FF9F0A"} onChange={e=>setData({...data,color:e.target.value})}
            style={{width:44,height:32,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",padding:0,background:"none"}}/>
          <span style={{fontSize:11,color:T.mid}}>Ex : bière → jaune, café → marron, vin rouge → bordeaux…</span>
        </div>
      </>}
      <button onClick={onSubmit} disabled={busy} style={{width:"100%",padding:"11px",background:busy?"#ccc":T.red,color:"white",border:"none",borderRadius:10,cursor:busy?"default":"pointer",fontWeight:700}}>
        {busy?"⏳ Enregistrement...":(label.startsWith("+")?label:"💾 Enregistrer")}
      </button>
    </div>
  );
}

// ═══ DÉTAIL VALEUR STOCK / MARGE POTENTIELLE (bandeau Admin → Produits) ═══
function StockValueDetailModal({mode,products,sites,caisseUrl,unitCost,unitSell,flattenProd,onSave,onClose}){
  const [siteFilter,setSiteFilter]=useState("all"); // "all" ou un id de site
  const [busyId,setBusyId]=useState(null);

  const stockFor=p=>siteFilter==="all"?Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0):(p.stock[siteFilter]||0);
  const valueFor=p=>mode==="value"?unitCost(p)*stockFor(p):(unitSell(p)-unitCost(p))*stockFor(p);
  const relevant=products.filter(p=>stockFor(p)>0||p.costPrice>0).sort((a,b)=>valueFor(b)-valueFor(a));
  const total=relevant.reduce((s,p)=>s+valueFor(p),0);

  const updateCostPrice=async(p,newCost)=>{
    setBusyId(p.id);
    const upd=products.map(x=>x.id===p.id?{...x,costPrice:newCost}:x);
    onSave(upd);
    if(caisseUrl){
      await apiWrite(caisseUrl,{action:"saveProduct",id:p.id,...flattenProd({...p,costPrice:newCost},sites),photo:"__KEEP__"});
    }
    setBusyId(null);
  };
  const updateStockQty=async(p,newQty)=>{
    setBusyId(p.id);
    const upd=products.map(x=>x.id===p.id?{...x,stock:{...x.stock,[siteFilter]:Math.max(0,newQty)}}:x);
    onSave(upd);
    if(caisseUrl)await apiWrite(caisseUrl,{action:"updateStock",id:p.id,site:siteFilter,qty:Math.max(0,newQty),mode:"set"});
    setBusyId(null);
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:T.card,borderRadius:18,padding:18,width:"100%",maxWidth:460,maxHeight:"88vh",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontWeight:800,fontSize:16,color:T.dark}}>{mode==="value"?"💰 Détail valeur du stock":"📈 Détail marge potentielle"}</div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:T.mid}}>✕</button>
      </div>
      <div style={{fontSize:11,color:T.mid,marginBottom:10}}>Prix d'achat et quantité modifiables directement ici.</div>

      <div style={{background:T.bg,borderRadius:10,padding:"8px 8px 10px",marginBottom:10}}>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:4}}>
          <button onClick={()=>setSiteFilter("all")} style={{flexShrink:0,padding:"9px 16px",borderRadius:20,border:"none",
            background:siteFilter==="all"?T.dark:"white",color:siteFilter==="all"?"white":T.dark,fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 1px 3px rgba(0,0,0,.1)"}}>
            Tous sites
          </button>
          {sites.map(s=>(
            <button key={s.id} onClick={()=>setSiteFilter(s.id)} style={{flexShrink:0,padding:"9px 16px",borderRadius:20,border:"none",
              background:siteFilter===s.id?s.color:"white",color:siteFilter===s.id?"white":T.dark,fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 1px 3px rgba(0,0,0,.1)"}}>
              {s.name}
            </button>
          ))}
        </div>
      </div>
      {siteFilter==="all"&&<div style={{fontSize:10,color:T.mid,marginBottom:8,fontStyle:"italic"}}>La quantité "Tous sites" est une somme en lecture seule — choisissez un site pour la corriger.</div>}

      <div style={{overflowY:"auto",flex:1,marginBottom:10}}>
        {relevant.map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
            {p.photo?<img src={p.photo} style={{width:32,height:32,borderRadius:7,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{p.emoji}</span>}
            <div style={{flex:1,minWidth:0,fontSize:12,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:9,color:T.mid}}>Achat</span>
              <input type="number" step="0.01" defaultValue={p.costPrice||0} disabled={busyId===p.id}
                onBlur={e=>{const v=+e.target.value||0;if(v!==p.costPrice)updateCostPrice(p,v);}}
                onKeyDown={e=>{if(e.key==="Enter")e.target.blur();}}
                style={{width:56,padding:"4px 5px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:12,textAlign:"center"}}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:9,color:T.mid}}>Qté{p.sellByVolume?" ("+(p.unit||"cl")+")":""}</span>
              {siteFilter==="all"
                ?<div style={{width:52,padding:"4px 0",fontSize:12,fontWeight:700,textAlign:"center",color:T.mid}}>{stockFor(p)}</div>
                :<input type="number" defaultValue={stockFor(p)} disabled={busyId===p.id}
                  onBlur={e=>{const v=parseInt(e.target.value,10);if(!isNaN(v)&&v!==stockFor(p))updateStockQty(p,v);}}
                  onKeyDown={e=>{if(e.key==="Enter")e.target.blur();}}
                  style={{width:52,padding:"4px 5px",border:`1px solid ${T.border}`,borderRadius:6,fontSize:12,textAlign:"center"}}/>}
            </div>
            <div style={{width:64,textAlign:"right",fontSize:12,fontWeight:800,color:mode==="value"?T.dark:T.green,flexShrink:0}}>{fmt(valueFor(p))}</div>
          </div>
        ))}
        {relevant.length===0&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:20}}>Aucun produit avec du stock ou un prix d'achat renseigné.</div>}
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:mode==="value"?T.dark:T.green,color:"white",borderRadius:10,padding:"10px 14px"}}>
        <span style={{fontSize:13,fontWeight:700}}>Total{siteFilter!=="all"?" — "+sites.find(s=>s.id===siteFilter)?.name:""}</span>
        <span style={{fontSize:18,fontWeight:900}}>{fmt(total)}</span>
      </div>
    </div>
  </div>);
}

function ProductsAdmin({products,categories,sites,onSave,caisseUrl,portions,setPortions,accompaniments,setAccompaniments}){
  const [edit,setEdit]=useState(null);
  const [newP,setNewP]=useState({name:"",price:"",costPrice:"",cat:categories[0]?.name||"Boissons",emoji:"🏷",photo:"",barcode:"",drink:false,sellByVolume:false,unit:"",baseQty:1,presets:"",containers:"",color:"#FF9F0A"});
  const [portionsFor,setPortionsFor]=useState(null); // produit dont on gère les portions
  const [accompFor,setAccompFor]=useState(null); // produit dont on gère les accompagnements
  const [saving,setSaving]=useState(false); // anti double-clic (ajout/modif/suppression produit)
  const [valueDetail,setValueDetail]=useState(null); // "value"|"margin"|null — détail du bandeau stock/marge
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};

  const handlePhoto=(e,setter)=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setter(prev=>({...prev,photo:url})));
  };
  const uploadPhotoIfNeeded=(id,photoDataUrl)=>uploadPhotoGeneric(caisseUrl,"uploadPhotoChunk",id,photoDataUrl);

  const addProd=async()=>{if(!newP.name||!newP.price||saving)return;
    setSaving(true);
    const id=uid();const stock=Object.fromEntries(sites.map(s=>[s.id,0]));
    const p={...newP,id,price:+newP.price,costPrice:+newP.costPrice||0,drink:!!newP.drink,sellByVolume:!!newP.sellByVolume,baseQty:+newP.baseQty||1,stock};
    const arr=[...products,p];onSave(arr);
    if(caisseUrl){
      const up=await uploadPhotoIfNeeded(id,p.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error+"\n\nLe produit a été enregistré sans photo pour l'instant, réessayez d'ajouter la photo ensuite.");}
      const extra=up.ok&&up.photoChunks?{photoChunks:up.photoChunks}:{};
      await apiWrite(caisseUrl,{action:"saveProduct",id,...flattenProd(p,sites),photo:up.ok?up.photoParam:"",...extra});
    }
    setNewP({name:"",price:"",costPrice:"",cat:categories[0]?.name||"Boissons",emoji:"🏷",photo:"",barcode:"",drink:false,sellByVolume:false,unit:"",baseQty:1,presets:"",containers:"",color:"#FF9F0A"});
    setSaving(false);
  };
  const saveEdit=async()=>{if(saving)return;setSaving(true);const original=products.find(p=>p.id===edit.id);const arr=products.map(p=>p.id===edit.id?edit:p);onSave(arr);
    if(caisseUrl){
      // Si la photo n'a pas changé, on ne la renvoie pas du tout — c'est de loin le
      // champ le plus lourd (plusieurs dizaines de Ko envoyés en petits morceaux), pas
      // la peine de la retransmettre juste parce qu'on a modifié le code-barres.
      const photoChanged=edit.photo!==(original?.photo||"");
      let photoParam,extra={};
      if(photoChanged){
        const up=await uploadPhotoIfNeeded(edit.id,edit.photo);
        if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error+"\n\nLes autres modifications ont été enregistrées, réessayez d'ajouter la photo ensuite.");}
        photoParam=up.ok?up.photoParam:(edit.photo?"__CHUNKED__":"");
        extra=up.ok&&up.photoChunks?{photoChunks:up.photoChunks}:{};
      }else{
        photoParam="__KEEP__"; // indique au serveur de garder la photo déjà enregistrée telle quelle
      }
      await apiWrite(caisseUrl,{action:"saveProduct",id:edit.id,...flattenProd(edit,sites),photo:photoParam,...extra});
    }
    setSaving(false);setEdit(null);};
  const delProd=async(id)=>{if(!window.confirm("Supprimer ?")||saving)return;setSaving(true);onSave(products.filter(p=>p.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteProduct",id});setSaving(false);};
  const flattenProd=(p,sites)=>({name:p.name,price:p.price,costPrice:p.costPrice||0,cat:p.cat,emoji:p.emoji,photo:p.photo||"",barcode:p.barcode||"",
    drink:p.drink,sellByVolume:p.sellByVolume,unit:p.unit||"",baseQty:p.baseQty||1,presets:p.presets||"",containers:p.containers||"",color:p.color||"",...Object.fromEntries(sites.map(s=>["stock_"+s.id,p.stock[s.id]||0]))});

  // Le prix d'achat/vente d'un produit au volume est saisi PAR PORTION (ex: 0,90€
  // l'achat d'un verre de 25cl), mais son stock est compté en cl (ex: 3000cl pour un
  // fût) — deux unités différentes. Sans ramener le prix "au cl" avant de multiplier
  // par le stock, la valeur calculée était gonflée d'un facteur ~baseQty (25 à 30
  // fois trop élevée pour un produit vendu au verre de 25-30cl).
  const unitCost=p=>p.sellByVolume?(p.costPrice||0)/(p.baseQty||1):(p.costPrice||0);
  const unitSell=p=>p.sellByVolume?(p.price||0)/(p.baseQty||1):(p.price||0);
  const totalStockValue=products.reduce((s,p)=>s+unitCost(p)*Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0),0);
  const totalPotentialMargin=products.reduce((s,p)=>s+(unitSell(p)-unitCost(p))*Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0),0);

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <button onClick={()=>setValueDetail("value")} style={{flex:1,background:T.dark,borderRadius:12,padding:"12px 14px",color:"white",border:"none",cursor:"pointer",textAlign:"left"}}>
        <div style={{fontSize:11,opacity:.7}}>💰 Valeur du stock (achat)</div>
        <div style={{fontSize:18,fontWeight:900}}>{fmt(totalStockValue)}</div>
      </button>
      <button onClick={()=>setValueDetail("margin")} style={{flex:1,background:T.green,borderRadius:12,padding:"12px 14px",color:"white",border:"none",cursor:"pointer",textAlign:"left"}}>
        <div style={{fontSize:11,opacity:.85}}>📈 Marge potentielle</div>
        <div style={{fontSize:18,fontWeight:900}}>{fmt(totalPotentialMargin)}</div>
      </button>
    </div>
    {valueDetail&&<StockValueDetailModal mode={valueDetail} products={products} sites={sites} caisseUrl={caisseUrl}
      unitCost={unitCost} unitSell={unitSell} flattenProd={flattenProd} onSave={onSave} onClose={()=>setValueDetail(null)}/>}
    <ProdForm data={newP} setData={setNewP} onSubmit={addProd} label="+ Nouveau produit" categories={categories} handlePhoto={handlePhoto} busy={saving}/>
    {products.map(p=>{
      const margeUnit=(p.price||0)-(p.costPrice||0);
      const margePct=p.costPrice>0?(margeUnit/p.costPrice*100):null;
      const stockTotal=Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0);
      return(<div key={p.id} style={{background:T.card,borderRadius:10,padding:"11px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
      {p.photo?<img src={p.photo} style={{width:32,height:32,borderRadius:7,objectFit:"cover",flexShrink:0}}/>
        :<span style={{fontSize:24,flexShrink:0}}>{p.emoji}</span>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
        <div style={{fontSize:11,color:T.mid}}>{p.cat} • {fmt(p.price)}{p.drink?" • 🍺":""}{p.sellByVolume?" • au "+p.unit:""}{p.barcode?" • 🏷 "+p.barcode:""}</div>
        {p.costPrice>0&&<div style={{fontSize:10,color:margeUnit>=0?"#2E7D32":T.red,fontWeight:600,marginTop:1}}>
          Achat {fmt(p.costPrice)} • Marge {fmt(margeUnit)}{margePct!=null?` (${margePct.toFixed(0)}%)`:""} • Stock: {fmt(unitCost(p)*stockTotal)}
        </div>}
      </div>
      <button onClick={()=>setEdit({...p})} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
      <button onClick={()=>delProd(p.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
    </div>);})}
    {edit&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>✏️ Modifier {edit.name}</div>
        <ProdForm data={edit} setData={setEdit} onSubmit={saveEdit} label="💾 Enregistrer" categories={categories} handlePhoto={handlePhoto} onManagePortions={p=>setPortionsFor(p)} onManageAccompaniments={p=>setAccompFor(p)} busy={saving}/>
        <button onClick={()=>setEdit(null)} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600,marginTop:6}}>Annuler</button>
      </div>
    </div>}
    {portionsFor&&<PortionsManager product={portionsFor} portions={portions} setPortions={setPortions} caisseUrl={caisseUrl} onClose={()=>setPortionsFor(null)}/>}
    {accompFor&&<AccompanimentsManager product={accompFor} products={products} accompaniments={accompaniments} setAccompaniments={setAccompaniments} caisseUrl={caisseUrl} onClose={()=>setAccompFor(null)}/>}
  </div>);
}

// ═══ GESTION DES PORTIONS DE VENTE (demis, pichets, tailles de gobelet...) ═══
// ═══ GESTION DES ACCOMPAGNEMENTS AUTOMATIQUES (gobelet, sucre, touillette...) ═══
// Décomptés discrètement en plus du produit vendu — pas de ligne de panier, pas
// d'impact sur le prix. Ex: café -> gobelet, sucre, touillette (ou juste gobelet
// pour un autre produit).
function AccompanimentsManager({product,products,accompaniments,setAccompaniments,caisseUrl,onClose}){
  const mine=accompaniments.filter(a=>a.productId.toString()===product.id.toString());
  const otherProducts=products.filter(p=>p.id.toString()!==product.id.toString());
  const [assocId,setAssocId]=useState(otherProducts[0]?.id||"");
  const [qty,setQty]=useState(1);
  const [busy,setBusy]=useState(false);

  const add=async()=>{
    if(!assocId)return;
    setBusy(true);
    const id=uid();
    const r=await apiWrite(caisseUrl,{action:"saveAccompaniment",id,productId:product.id,assocId,qty:+qty||1});
    if(r.ok){
      setAccompaniments(prev=>[...prev,{id,productId:product.id,assocId,qty:+qty||1}]);
      setQty(1);
    }
    setBusy(false);
  };
  const del=async id=>{
    setAccompaniments(prev=>prev.filter(a=>a.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteAccompaniment",id});
  };
  const prodName=pid=>products.find(p=>p.id.toString()===pid.toString())?.name||"(produit supprimé)";
  const prodEmoji=pid=>products.find(p=>p.id.toString()===pid.toString())?.emoji||"🏷";

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>🔗 Accompagnements — {product.name}</div>
      <div style={{fontSize:12,color:T.mid,marginBottom:14}}>Décomptés automatiquement à chaque vente de "{product.name}", sans ligne de panier ni impact sur le prix.</div>

      {mine.length===0&&<div style={{fontSize:12,color:T.mid,fontStyle:"italic",marginBottom:10}}>Aucun accompagnement configuré.</div>}
      {mine.map(a=>(
        <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,background:T.bg,borderRadius:10,padding:"9px 12px",marginBottom:7}}>
          <span style={{fontSize:20}}>{prodEmoji(a.assocId)}</span>
          <div style={{flex:1,fontSize:13,color:T.dark}}>{a.qty}× {prodName(a.assocId)}</div>
          <button onClick={()=>del(a.id)} style={{padding:"6px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
        </div>
      ))}

      <div style={{background:T.bg,borderRadius:12,padding:14,marginTop:10}}>
        <div style={{fontWeight:700,fontSize:13,color:T.dark,marginBottom:8}}>+ Ajouter un accompagnement</div>
        <div style={{display:"flex",gap:7,marginBottom:9}}>

function PortionsManager({product,portions,setPortions,caisseUrl,onClose}){
  const myPortions=portions.filter(po=>po.productId.toString()===product.id.toString());
  const [form,setForm]=useState({name:"",size:"",price:"",photo:""});
  const [editingId,setEditingId]=useState(null);
  const [busy,setBusy]=useState(false);

  const handlePortionPhoto=e=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setForm(prev=>({...prev,photo:url})));
  };

  const startEdit=po=>{setEditingId(po.id);setForm({name:po.name,size:po.size,price:po.price,photo:po.photo||""});};
  const resetForm=()=>{setEditingId(null);setForm({name:"",size:"",price:"",photo:""});};

  const save=async()=>{
    if(!form.name||!form.size||!form.price)return;
    setBusy(true);
    const id=editingId||uid();
    // Même optimisation que pour les produits : on ne renvoie la photo que si elle a
    // changé — sinon "__KEEP__" indique au serveur de garder celle déjà enregistrée.
    const original=editingId?myPortions.find(po=>po.id===editingId):null;
    const photoChanged=!original||form.photo!==(original.photo||"");
    let photoParam,extra={};
    if(photoChanged){
      const up=await uploadPhotoGeneric(caisseUrl,"uploadPortionPhotoChunk",id,form.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error);setBusy(false);return;}
      photoParam=up.photoParam;extra=up.photoChunks?{photoChunks:up.photoChunks}:{};
    }else{
      photoParam="__KEEP__";
    }
    const r=await apiWrite(caisseUrl,{action:"savePortion",id,productId:product.id,name:form.name,size:+form.size,price:+form.price,photo:photoParam,...extra});
    if(r.ok){
      const newEntry={id,productId:product.id,name:form.name,size:+form.size,price:+form.price,
        photo:photoChanged?(photoParam==="__CHUNKED__"?form.photo:photoParam):(original?.photo||"")};
      setPortions(prev=>[...prev.filter(po=>po.id!==id),newEntry]);
      resetForm();
    }
    setBusy(false);
  };

  const del=async id=>{
    if(!window.confirm("Supprimer cette portion ?"))return;
    setPortions(prev=>prev.filter(po=>po.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deletePortion",id});
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>🍺 Portions — {product.name}</div>
      <div style={{fontSize:12,color:T.mid,marginBottom:14}}>Ex : Demi 25cl, Pichet 1L, Pichet 1,5L — chacune avec sa propre photo.</div>

      {myPortions.map(po=>(
        <div key={po.id} style={{display:"flex",alignItems:"center",gap:10,background:T.bg,borderRadius:10,padding:"9px 12px",marginBottom:7}}>
          {po.photo?<img src={po.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{product.emoji}</span>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{po.name}</div>
            <div style={{fontSize:11,color:T.mid}}>{po.size}{product.unit||"cl"} • {fmt(po.price)}</div>
          </div>
          <button onClick={()=>startEdit(po)} style={{padding:"6px 9px",background:"white",border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:12}}>✏️</button>
          <button onClick={()=>del(po.id)} style={{padding:"6px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
        </div>
      ))}

      <div style={{background:T.bg,borderRadius:12,padding:14,marginTop:10}}>
        <div style={{fontWeight:700,fontSize:13,color:T.dark,marginBottom:8}}>{editingId?"✏️ Modifier la portion":"+ Nouvelle portion"}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
          <input placeholder="Nom (ex: Demi)" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}
            style={{padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}/>
          <input placeholder={`Taille (${product.unit||"cl"})`} type="number" value={form.size} onChange={e=>setForm({...form,size:e.target.value})}
            style={{padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}/>
        </div>
        <input placeholder="Prix" type="number" step="0.50" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Photo de cette portion</label>
        {form.photo&&<img src={form.photo} style={{width:50,height:50,borderRadius:8,objectFit:"cover",marginBottom:6,display:"block"}}/>}
        <input type="file" accept="image/*" onChange={handlePortionPhoto} style={{fontSize:12,color:T.mid,marginBottom:9}}/>
        <div style={{display:"flex",gap:8}}>
          {editingId&&<button onClick={resetForm} style={{flex:1,padding:"10px",background:"white",border:`1px solid ${T.border}`,borderRadius:9,cursor:"pointer",fontWeight:600}}>Annuler</button>}
          <button onClick={save} disabled={busy} style={{flex:2,padding:"10px",background:T.blue,color:"white",border:"none",borderRadius:9,cursor:busy?"default":"pointer",fontWeight:700}}>
            {busy?"⏳ Envoi...":editingId?"💾 Enregistrer":"+ Ajouter"}
          </button>
        </div>
      </div>

      <button onClick={onClose} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600,marginTop:14}}>Fermer</button>
    </div>
  </div>);
}

function MyProfile({currentUser,setCU,caisseUrl}){
  const [name,setName]=useState(currentUser.name);
  const [pin,setPin]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);

  const save=async()=>{
    if(!name.trim())return;
    setBusy(true);
    const updated={...currentUser,name:name.trim(),pin:(pin.trim()||currentUser.pin)};
    const r=await apiWrite(caisseUrl,{action:"saveUser",id:currentUser.id,name:updated.name,pin:updated.pin,role:currentUser.role});
    if(r.ok){
      setCU(updated);SS.set("anf87_user",updated);
      setMsg("✅ Profil mis à jour");setPin("");
    }
    setBusy(false);
    setTimeout(()=>setMsg(""),2500);
  };

  return(<div style={{background:T.card,borderRadius:12,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
    <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>👤 Mon profil</div>

    <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Nouveau code PIN (laisser vide pour ne pas changer)</label>
    <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,""))} type="password" inputMode="numeric" maxLength={6} placeholder="••••"
      style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:9}}/>
    <button onClick={save} disabled={busy||!name.trim()} style={{width:"100%",padding:"10px",background:T.red,color:"white",border:"none",borderRadius:9,cursor:busy?"default":"pointer",fontWeight:700,fontSize:13}}>
      {busy?"⏳...":"💾 Enregistrer mon profil"}
    </button>
    {msg&&<div style={{marginTop:8,fontSize:12,fontWeight:600,textAlign:"center",color:T.green}}>{msg}</div>}
  </div>);
}

function SettingsScreen({caisseUrl,boissonsUrl,onSync,onInit,currentUser,setCU,sumupKey,sumupAppId,setConfig}){
  const [cu,setCu]=useState(caisseUrl);const [bu,setBu]=useState(boissonsUrl);const [msg,setMsg]=useState("");
  const [sk,setSk]=useState(sumupKey||"");const [said,setSaid]=useState(sumupAppId||"");
  const [initBusy,setInitBusy]=useState(false); // anti double-clic sur l'initialisation
  const [savingConfig,setSavingConfig]=useState(false); // anti double-clic sur la sauvegarde SumUp
  // Une URL Apps Script valide ressemble à https://script.google.com/macros/s/XXXX/exec
  // (souvent copiée-collée avec un espace ou un retour à la ligne en trop, ce qui casse
  // TOUS les appels réseau sans message clair -> on nettoie et on vérifie avant d'enregistrer).
  const urlOk=u=>/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(u.trim());
  const cuOk=!cu.trim()||urlOk(cu), buOk=!bu.trim()||urlOk(bu);
  const save=()=>{
    const cuT=cu.trim(), buT=bu.trim();
    LS.set("anf87_caisse_url",cuT);LS.set("anf87_url",buT);
    setCu(cuT);setBu(buT);
    setMsg("✅ URLs enregistrées, rechargement…");
    setTimeout(()=>window.location.reload(),900);
  };
  // Enregistrés sur Google Sheets (feuille "Config") — partagés automatiquement par
  // tous les appareils du club, contrairement aux URLs ci-dessus qui restent locales.
  const [sumupMsg,setSumupMsg]=useState(""); // message dédié, séparé des autres pour éviter toute confusion
  const saveSumup=async()=>{
    if(savingConfig||!caisseUrl)return;
    setSavingConfig(true);setSumupMsg("");
    const skT=sk.trim(),saidT=said.trim();
    const r1=await apiWrite(caisseUrl,{action:"saveConfig",key:"sumup_key",value:skT});
    const r2=await apiWrite(caisseUrl,{action:"saveConfig",key:"sumup_appid",value:saidT});
    setSavingConfig(false);
    if(!r1?.ok||!r2?.ok){
      setSumupMsg("❌ Échec de l'enregistrement ("+(r1?.error||r2?.error||"connexion")+") — réessayez.");
      return;
    }
    setConfig(prev=>({...prev,sumup_key:skT,sumup_appid:saidT}));
    LS.set("anf87_sumup_key",skT);LS.set("anf87_sumup_appid",saidT); // repli local, cohérence
    setSumupMsg("✅ Enregistré sur Google Sheets — visible sur tous vos appareils à leur prochaine synchro.");
    setTimeout(()=>setSumupMsg(""),6000);
  };
  const initSheets=async()=>{
    if(initBusy)return;setInitBusy(true);
    setMsg("⏳ Initialisation...");
    const r=await onInit();
    setMsg(r?.ok?"✅ "+r.message:"❌ "+(r?.error||"Échec de connexion. Vérifiez l'URL du script Caisse ci-dessus (espaces, /exec en fin d'URL) et que le déploiement Apps Script est bien accessible en \"Anyone\"."));
    setInitBusy(false);
    setTimeout(()=>setMsg(""),8000);
  };
  const inp=ok=>({width:"100%",padding:"11px 12px",border:`1px solid ${ok?T.border:T.red}`,borderRadius:8,fontSize:12,outline:"none",marginBottom:4,wordBreak:"break-all"});
  return(<div style={{height:"100%",overflowY:"auto",padding:"14px"}}>
    <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:16}}>⚙️ Configuration</div>
    {currentUser&&<MyProfile currentUser={currentUser} setCU={setCU} caisseUrl={caisseUrl}/>}
    <div style={{background:T.card,borderRadius:12,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:4}}>URL Script Caisse (Google Sheets produits/ventes)</div>
      <input style={inp(cuOk)} value={cu} onChange={e=>setCu(e.target.value)} onBlur={()=>setCu(c=>c.trim())} placeholder="https://script.google.com/macros/s/.../exec"/>
      {!cuOk&&<div style={{fontSize:11,color:T.red,marginBottom:6}}>⚠ Doit commencer par https://script.google.com/macros/s/ et finir par /exec (pas d'espace)</div>}
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:4,marginTop:8}}>URL Script Boissons Offertes</div>
      <input style={inp(buOk)} value={bu} onChange={e=>setBu(e.target.value)} onBlur={()=>setBu(b=>b.trim())} placeholder="https://script.google.com/macros/s/.../exec"/>
      {!buOk&&<div style={{fontSize:11,color:T.red,marginBottom:6}}>⚠ Doit commencer par https://script.google.com/macros/s/ et finir par /exec (pas d'espace)</div>}
      <button onClick={save} style={{width:"100%",padding:"12px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,marginTop:4}}>Enregistrer</button>
      {msg&&<div style={{marginTop:8,fontSize:13,fontWeight:600,textAlign:"center",color:msg.startsWith("✅")?T.green:msg.startsWith("⏳")?T.orange:T.red}}>{msg}</div>}
    </div>
    <div style={{background:T.card,borderRadius:12,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:12}}>Google Sheets</div>
      <button onClick={initSheets} disabled={initBusy} style={{width:"100%",padding:"12px",background:initBusy?"#ccc":"#1565C0",color:"white",border:"none",borderRadius:10,cursor:initBusy?"default":"pointer",fontWeight:700,marginBottom:8}}>{initBusy?"⏳ Initialisation...":"🗄 Initialiser les feuilles (1ère utilisation)"}</button>
      <button onClick={onSync} style={{width:"100%",padding:"12px",background:T.dark,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>↻ Synchroniser depuis Google Sheets</button>
    </div>
    <div style={{background:"#E8F5E9",borderRadius:12,padding:14,border:"1px solid #A5D6A7",marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:"#2E7D32",marginBottom:6}}>💳 SumUp TPE</div>
      <div style={{fontSize:12,color:"#2E7D32",lineHeight:1.6,marginBottom:10}}>Le bouton "Carte Bleue" envoie directement la commande au TPE via <code>sumupmerchant://pay</code>. L'app SumUp doit être installée sur l'appareil et le TPE associé.</div>
      <label style={{fontSize:12,fontWeight:600,color:"#2E7D32",display:"block",marginBottom:4}}>Clé Affiliate SumUp (obligatoire — sans elle, l'appli SumUp ignore la demande)</label>
      <input value={sk} onChange={e=>setSk(e.target.value)} placeholder="Générée sur developer.sumup.com"
        style={{width:"100%",padding:"10px 12px",border:"1px solid #A5D6A7",borderRadius:8,fontSize:13,marginBottom:9,outline:"none"}}/>
      <label style={{fontSize:12,fontWeight:600,color:"#2E7D32",display:"block",marginBottom:4}}>App ID SumUp (optionnel, selon la config de votre clé)</label>
      <input value={said} onChange={e=>setSaid(e.target.value)} placeholder="ex: com.anf87.caisse"
        style={{width:"100%",padding:"10px 12px",border:"1px solid #A5D6A7",borderRadius:8,fontSize:13,marginBottom:9,outline:"none"}}/>
      <button onClick={saveSumup} disabled={savingConfig||!caisseUrl} style={{width:"100%",padding:"11px",background:savingConfig?"#ccc":"#2E7D32",color:"white",border:"none",borderRadius:9,cursor:(savingConfig||!caisseUrl)?"default":"pointer",fontWeight:700,fontSize:13}}>
        {savingConfig?"⏳ Enregistrement...":"💾 Enregistrer (partagé sur tous les appareils)"}
      </button>
      {!caisseUrl&&<div style={{fontSize:11,color:"#2E7D32",marginTop:6}}>Configurez d'abord l'URL Script Caisse ci-dessus pour pouvoir enregistrer ce réglage sur Google Sheets.</div>}
      {sumupMsg&&<div style={{marginTop:10,padding:"10px 12px",borderRadius:8,fontSize:12,fontWeight:700,textAlign:"center",
        background:sumupMsg.startsWith("✅")?"#C8E6C9":"#FFCDD2",color:sumupMsg.startsWith("✅")?"#1B5E20":"#B71C1C"}}>{sumupMsg}</div>}
    </div>
  </div>);
}

// ═══ RENDER ═══
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
