function PaymentModal({cart,total,site,boissonsUrl,onClose,onDone,setCart,sumupKey,sumupAppId,openBoissons,openSplit}){
  const [step,setStep]=useState("select");
  const [given,setGiven]=useState("");const [checkN,setCheckN]=useState("");
  const [submitting,setSubmitting]=useState(false); // anti double-clic / double-encaissement
  const drinkItems=cart.filter(i=>i.drink);const freeItems=cart.filter(i=>i.free);
  const paidTotal=cart.reduce((s,i)=>s+(i.free?0:i.price*i.qty),0);
  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"};
  const sh={background:T.card,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:500,padding:"20px 18px 34px",maxHeight:"92vh",overflowY:"auto"};

  // Empêche de valider deux fois (double-clic, double-tap) : le bouton se bloque dès
  // le premier clic. onDone déclenche ensuite finalizeSale (async) qui referme cette
  // fenêtre une fois terminé — pas besoin de réarmer submitting après coup.
  const submit=payment=>{ if(submitting)return; setSubmitting(true); onDone(payment); };
  const handleSumUp=()=>{
    if(submitting)return; setSubmitting(true);
    if(!sumupKey){
      window.alert("⚠️ Aucune clé SumUp (Affiliate Key) configurée. Allez dans ⚙️ Configuration pour la renseigner — sans elle, l'appli SumUp reçoit la demande de paiement mais l'ignore silencieusement (c'est exactement ce qui se passait avant ce correctif).");
      setSubmitting(false);return;
    }
    // Format exact documenté par SumUp (developer.sumup.com/terminal-payments/payment-switch/android) :
    // chemin "/1.0", "total" (remplace l'ancien "amount"), affiliate-key + app-id
    // obligatoires, et un foreign-tx-id unique par paiement pour le suivi.
    const a=paidTotal.toFixed(2);
    const desc=encodeURIComponent("ANF87 "+site.name+" - "+cart.map(i=>i.name).join(", ").slice(0,50));
    const txId=uid();
    let url=`sumupmerchant://pay/1.0?affiliate-key=${encodeURIComponent(sumupKey)}&total=${a}&currency=EUR&title=${desc}&foreign-tx-id=${txId}`;
    if(sumupAppId)url+=`&app-id=${encodeURIComponent(sumupAppId)}`;
    window.location.href=url;
    setTimeout(()=>{if(window.confirm("✅ Paiement CB confirmé par le TPE SumUp ?"))onDone({type:"cb"});else setSubmitting(false);},2000);
  };
  const doCashPayment=g=>{if(submitting)return;if(isNaN(g)||g<paidTotal)return;setSubmitting(true);onDone({type:"cash",given:g,change:+(g-paidTotal).toFixed(2)});};
  const handleCash=()=>{doCashPayment(parseFloat(given.replace(",",".")));};

  return(<div style={ov} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={sh}>
      <div style={{width:40,height:4,background:T.border,borderRadius:2,margin:"0 auto 18px"}}/>
      {step==="select"&&<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:20,color:T.dark}}>Encaissement</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:T.mid}}>✕</button>
        </div>
        <div style={{background:T.red,borderRadius:16,padding:"16px 20px",marginBottom:14,color:"white"}}>
          <div style={{fontSize:11,opacity:.75,marginBottom:3}}>TOTAL À ENCAISSER</div>
          <div style={{fontSize:38,fontWeight:900,fontVariantNumeric:"tabular-nums"}}>{fmt(paidTotal)}</div>
          <div style={{fontSize:12,opacity:.65,marginTop:2}}>{site.name} • {cart.reduce((s,i)=>s+i.qty,0)} article(s)</div>
        </div>
        {/* Diviser la note */}
        <button onClick={openSplit} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#F0F4FF",border:`2px dashed ${T.blue}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🔢</div>
          <div><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Diviser la note</div>
            <div style={{fontSize:12,color:T.mid}}>Parts égales ou montants personnalisés</div></div>
        </button>
        {/* Carte boissons */}
        {drinkItems.length>0&&<button onClick={openBoissons} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#FFF8E1",border:`2px dashed ${T.orange}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.orange,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🍺</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Carte Boissons ANF 87</div>
            <div style={{fontSize:12,color:T.mid}}>{drinkItems.length} boisson(s) éligible(s)</div></div>
          {freeItems.length>0&&<span style={{background:T.green,color:"white",borderRadius:8,padding:"2px 8px",fontSize:12,fontWeight:700}}>{freeItems.length} offertes</span>}
        </button>}
        {/* Consos offertes match (joueurs/dirigeants/arbitres) */}
        <button onClick={()=>setStep("matchOffert")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",
          background:"#E8F5E9",border:`2px dashed ${T.green}`,borderRadius:13,cursor:"pointer",marginBottom:12,textAlign:"left"}}>
          <div style={{width:46,height:46,borderRadius:12,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>⚽</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15,color:T.dark}}>Consos offertes match</div>
            <div style={{fontSize:12,color:T.mid}}>Joueurs, dirigeants, arbitres — gratuit</div></div>
        </button>
        <PaymentOptionButton e="💵" l="Espèces" s="Calcul automatique de la monnaie" c={T.green} onClick={()=>setStep("cash")}/>
        <PaymentOptionButton e="📝" l="Chèque" s="Saisir numéro de chèque" c={T.blue} onClick={()=>setStep("check")}/>
        <PaymentOptionButton e="💳" l={submitting?"⏳ Validation...":"Carte Bleue — SumUp"} s="Lance directement le TPE SumUp" c="#5856D6" onClick={handleSumUp} disabled={submitting}/>
      </>}
      {step==="matchOffert"&&<>
        <button onClick={()=>setStep("select")} style={{background:"none",border:"none",cursor:"pointer",color:T.mid,display:"flex",alignItems:"center",gap:4,marginBottom:14,fontSize:14}}>← Retour</button>
        <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:4}}>⚽ Consos offertes match</div>
        <div style={{fontSize:13,color:T.mid,marginBottom:14}}>Pour les joueurs, dirigeants et arbitres ayant participé au match.</div>
        <div style={{background:"#E8F5E9",borderRadius:12,padding:14,marginBottom:16,border:"1px solid #A5D6A7"}}>
          <div style={{fontSize:12,color:"#2E7D32"}}>VALEUR OFFERTE (stock bien décompté)</div>
          <div style={{fontSize:30,fontWeight:900,color:"#2E7D32"}}>{fmt(paidTotal)}</div>
          <div style={{fontSize:12,color:"#2E7D32",marginTop:2}}>{cart.reduce((s,i)=>s+i.qty,0)} article(s) — {site.name}</div>
        </div>
        <button onClick={()=>submit({type:"matchOffert"})} disabled={submitting} style={{width:"100%",padding:15,background:submitting?"#ccc":T.green,color:"white",border:"none",borderRadius:13,fontSize:16,fontWeight:700,cursor:submitting?"default":"pointer"}}>
          {submitting?"⏳ Validation...":"✓ Confirmer — Offrir gratuitement"}
        </button>
      </>}
      {step==="cash"&&<>
        <button onClick={()=>setStep("select")} style={{background:"none",border:"none",cursor:"pointer",color:T.mid,display:"flex",alignItems:"center",gap:4,marginBottom:14,fontSize:14}}>← Retour</button>
        <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:14}}>💵 Paiement espèces</div>
        <div style={{background:T.bg,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:12,color:T.mid}}>À ENCAISSER</div>
          <div style={{fontSize:30,fontWeight:900,color:T.red}}>{fmt(paidTotal)}</div>
        </div>
        <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:7}}>Montant remis</label>
        <input value={given} onChange={e=>{setGiven(e.target.value);const g=parseFloat(e.target.value.replace(",","."));if(!isNaN(g)&&Math.abs(g-paidTotal)<0.001)doCashPayment(g);}} type="number" step="0.50" placeholder="0,00"
          style={{width:"100%",padding:"14px",fontSize:24,fontWeight:700,border:`2px solid ${T.border}`,borderRadius:12,textAlign:"right",marginBottom:10,outline:"none"}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7,marginBottom:12}}>
          {/* Montants uniques (évite de proposer 2x la même valeur, ex: quand le total est déjà rond) */}
          {[...new Set([paidTotal,Math.ceil(paidTotal),Math.ceil(paidTotal/5)*5,Math.ceil(paidTotal/10)*10])].map((v,i)=>(
            <button key={i} onClick={()=>{setGiven(v.toFixed(2));if(Math.abs(v-paidTotal)<0.001)doCashPayment(v);}} style={{padding:"10px 4px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer"}}>{fmt(v)}</button>
          ))}
        </div>
        {given&&parseFloat(given.replace(",","."))>=paidTotal&&<div style={{background:"#E8F5E9",borderRadius:12,padding:14,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:"#2E7D32",fontWeight:600,fontSize:15}}>Monnaie à rendre</span>
          <span style={{color:"#2E7D32",fontWeight:900,fontSize:26}}>{fmt(parseFloat(given.replace(",","."))-paidTotal)}</span>
        </div>}
        <button onClick={handleCash} disabled={submitting||!given||parseFloat(given.replace(",","."))<paidTotal}
          style={{width:"100%",padding:15,background:submitting?"#ccc":(given&&parseFloat(given.replace(",","."))>=paidTotal)?T.green:"#ccc",color:"white",border:"none",borderRadius:13,fontSize:16,fontWeight:700,cursor:submitting?"default":"pointer"}}>
          {submitting?"⏳ Validation...":"✓ Valider"}
        </button>
      </>}
      {step==="check"&&<>
        <button onClick={()=>setStep("select")} style={{background:"none",border:"none",cursor:"pointer",color:T.mid,display:"flex",alignItems:"center",gap:4,marginBottom:14,fontSize:14}}>← Retour</button>
        <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:14}}>📝 Paiement par chèque</div>
        <div style={{background:T.bg,borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontSize:12,color:T.mid}}>MONTANT</div>
          <div style={{fontSize:30,fontWeight:900,color:T.blue}}>{fmt(paidTotal)}</div>
        </div>
        <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:7}}>N° chèque (optionnel)</label>
        <input value={checkN} onChange={e=>setCheckN(e.target.value)} placeholder="Ex: 1234567"
          style={{width:"100%",padding:"13px",fontSize:15,border:`2px solid ${T.border}`,borderRadius:12,marginBottom:14,outline:"none"}}/>
        <button onClick={()=>submit({type:"check",num:checkN})} disabled={submitting}
          style={{width:"100%",padding:15,background:submitting?"#ccc":T.blue,color:"white",border:"none",borderRadius:13,fontSize:16,fontWeight:700,cursor:submitting?"default":"pointer"}}>{submitting?"⏳ Validation...":"✓ Valider"}</button>
      </>}
    </div>
  </div>);
}

// ═══ SPLIT MODAL ═══
function SplitModal({total,boissonsUrl,onClose,onComplete}){
  const [mode,setMode]=useState("equal");
  const [persons,setPersons]=useState(2);
  const [amounts,setAmounts]=useState([]);
  const [payments,setPayments]=useState([]); // [{idx,type,amount,given,change,checkNum,member}]
  const [activeIdx,setActiveIdx]=useState(null);
  const [step,setStep]=useState("select");
  const [given,setGiven]=useState("");const [checkN,setCheckN]=useState("");
  const [completing,setCompleting]=useState(false); // anti double-clic sur le dernier paiement
  // Carte boissons ANF 87, pour la part de la personne en cours
  const [bName,setBName]=useState("");const [bInfo,setBInfo]=useState(null);const [bLoading,setBLoading]=useState(false);
  const perPerson=+(total/persons).toFixed(2);
  const paidTotal=payments.reduce((s,p)=>s+p.amount,0);
  const remaining=Math.max(0,+(total-paidTotal).toFixed(2));
  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:250,display:"flex",alignItems:"flex-end",justifyContent:"center"};

  useEffect(()=>{ if(mode==="custom")setAmounts(Array(persons).fill(""));},[persons,mode]);

  const amountFor=idx=>mode==="equal"?perPerson:+(parseFloat(amounts[idx])||0).toFixed(2);

  const openPay=idx=>{ if(amountFor(idx)<=0)return; setActiveIdx(idx);setStep("select");setGiven("");setCheckN("");setBName("");setBInfo(null); };
  const closePay=()=>{setActiveIdx(null);setStep("select");};

  const confirmPayment=(type,extra)=>{
    if(completing)return;
    const amt=amountFor(activeIdx);
    const newPayments=[...payments,{idx:activeIdx,type,amount:amt,...(extra||{})}];
    setPayments(newPayments);
    closePay();
    const stillOwed=+(total-newPayments.reduce((s,p)=>s+p.amount,0)).toFixed(2);
    if(stillOwed<=0.001){setCompleting(true);onComplete(newPayments);}
  };

  // Carte boissons ANF 87 pour la part de la personne active — recherche le membre
  // et affiche son solde. Volontairement limité au cas où le solde couvre l'ENTIÈRE
  // part de cette personne (pas de découpage en deux paiements pour une seule part,
  // pour rester simple et fiable) ; sinon, un autre moyen de paiement est nécessaire.
  const searchMember=async()=>{
    if(!bName.trim()||!boissonsUrl){setBInfo({error:"Nom vide ou URL Boissons non configurée"});return;}
    setBLoading(true);
    try{
      const r=await api(boissonsUrl,{action:"getmember",person:bName.trim()});
      setBInfo(r.ok?r:{error:r.error||"Membre introuvable"});
    }catch{ setBInfo({error:"Erreur de connexion"}); }
    setBLoading(false);
  };
  const confirmBoissons=async()=>{
    if(completing||!bInfo||bInfo.error)return;
    const amt=amountFor(activeIdx);
    if((bInfo.solde||0)<amt-0.001)return; // sécurité : bouton normalement déjà désactivé dans ce cas
    setCompleting(true);
    const reqId=Date.now()+"-"+Math.random().toString(36).slice(2);
    try{
      await fetch(boissonsUrl.trim()+"?action=scan&amount="+amt.toFixed(2)+"&person="+encodeURIComponent(bName.trim())+"&reqid="+reqId,{redirect:"follow"});
    }catch{}
    setCompleting(false);
    confirmPayment("free_drinks",{member:bName.trim()});
  };

  const activeAmt=activeIdx!=null?amountFor(activeIdx):0;
  const typeLabel={cash:"💵 Espèces",cb:"💳 Carte",check:"📝 Chèque",matchOffert:"⚽ Offert match",free_drinks:"🍺 Boissons offertes"};

  return(<div style={ov} onClick={e=>e.target===e.currentTarget&&activeIdx===null&&onClose()}>
    <div style={{background:T.card,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:500,padding:"20px 18px 32px",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{width:40,height:4,background:T.border,borderRadius:2,margin:"0 auto 16px"}}/>

      {activeIdx===null?<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:18,color:T.dark}}>🔢 Diviser la note</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:T.mid}}>✕</button>
        </div>
        <div style={{background:T.bg,borderRadius:12,padding:14,marginBottom:16,display:"flex",justifyContent:"space-between"}}>
          <span style={{fontSize:15,fontWeight:600,color:T.dark}}>Reste à encaisser</span>
          <span style={{fontSize:22,fontWeight:900,color:T.red}}>{fmt(remaining)}</span>
        </div>
        {/* Mode */}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["equal","Parts égales"],["custom","Montants libres"]].map(([v,l])=>(
            <button key={v} disabled={payments.length>0} onClick={()=>setMode(v)} style={{flex:1,padding:"10px",background:mode===v?T.red:T.bg,
              border:`1px solid ${mode===v?T.red:T.border}`,borderRadius:10,color:mode===v?"white":T.dark,
              fontWeight:600,fontSize:13,cursor:payments.length>0?"not-allowed":"pointer",opacity:payments.length>0?.6:1}}>{l}</button>
          ))}
        </div>
        {/* Nb personnes */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,background:T.bg,borderRadius:12,padding:"12px 16px"}}>
          <span style={{fontSize:15,fontWeight:600,color:T.dark}}>Nombre de personnes</span>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button disabled={payments.length>0} onClick={()=>setPersons(Math.max(2,persons-1))} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.card,cursor:"pointer",fontSize:18}}>−</button>
            <span style={{fontSize:22,fontWeight:800,minWidth:32,textAlign:"center"}}>{persons}</span>
            <button disabled={payments.length>0} onClick={()=>setPersons(persons+1)} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.card,cursor:"pointer",fontSize:18}}>+</button>
          </div>
        </div>
        {/* Parties */}
        {Array.from({length:persons},(_, i)=>{
          const paid=payments.find(p=>p.idx===i);
          return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,
            background:paid?"#E8F5E9":T.bg,borderRadius:12,padding:"12px 14px",
            border:`1px solid ${paid?"#A5D6A7":T.border}`}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Personne {i+1}</div>
              {mode==="equal"?<div style={{fontSize:16,fontWeight:900,color:T.red}}>{fmt(perPerson)}</div>
                :<input disabled={!!paid} value={amounts[i]||""} onChange={e=>setAmounts(a=>{const n=[...a];n[i]=e.target.value;return n;})}
                  placeholder="Montant" type="number" step="0.50"
                  style={{width:"100%",padding:"6px 10px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:15,fontWeight:700,outline:"none",marginTop:4}}/>}
              {paid&&<div style={{fontSize:11,color:"#2E7D32",fontWeight:600,marginTop:2}}>{typeLabel[paid.type]}</div>}
            </div>
            {!paid?
              <button onClick={()=>openPay(i)} style={{padding:"10px 16px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:13,flexShrink:0}}>
                Encaisser
              </button>
              :<span style={{color:T.green,fontWeight:700,fontSize:18}}>✓</span>
            }
          </div>);
        })}
      </>:(
        <>
        <button onClick={closePay} style={{background:"none",border:"none",cursor:"pointer",color:T.mid,display:"flex",alignItems:"center",gap:4,marginBottom:14,fontSize:14}}>← Retour</button>
        <div style={{fontWeight:800,fontSize:17,color:T.dark,marginBottom:4}}>Personne {activeIdx+1}</div>
        <div style={{background:T.red,borderRadius:14,padding:"14px 18px",marginBottom:16,color:"white"}}>
          <div style={{fontSize:11,opacity:.75}}>MONTANT À ENCAISSER</div>
          <div style={{fontSize:30,fontWeight:900}}>{fmt(activeAmt)}</div>
        </div>
        {step==="select"&&<>
          <button onClick={()=>setStep("cash")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:"pointer",marginBottom:9,textAlign:"left"}}>
            <div style={{width:40,height:40,borderRadius:10,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>💵</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Espèces</div>
          </button>
          <button onClick={()=>setStep("check")} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:"pointer",marginBottom:9,textAlign:"left"}}>
            <div style={{width:40,height:40,borderRadius:10,background:T.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>📝</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Chèque</div>
          </button>
          <button onClick={()=>confirmPayment("cb")} disabled={completing} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:completing?"#f0f0f0":T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:completing?"default":"pointer",textAlign:"left",opacity:completing?.6:1}}>
            <div style={{width:40,height:40,borderRadius:10,background:"#5856D6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>💳</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>{completing?"⏳ Validation...":"Carte Bleue"}</div>
          </button>
          <button onClick={()=>{setStep("boissons");setBName("");setBInfo(null);}} disabled={completing} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:completing?"#f0f0f0":T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:completing?"default":"pointer",marginBottom:9,textAlign:"left",opacity:completing?.6:1}}>
            <div style={{width:40,height:40,borderRadius:10,background:T.orange,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>🍺</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>Carte boissons ANF 87</div>
          </button>
          <button onClick={()=>confirmPayment("matchOffert")} disabled={completing} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"14px",background:completing?"#f0f0f0":T.bg,border:`1px solid ${T.border}`,borderRadius:12,cursor:completing?"default":"pointer",textAlign:"left",opacity:completing?.6:1}}>
            <div style={{width:40,height:40,borderRadius:10,background:"#FF9500",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>⚽</div>
            <div style={{fontWeight:700,fontSize:14,color:T.dark}}>{completing?"⏳ Validation...":"Consos offertes match"}</div>
          </button>
        </>}
        {step==="boissons"&&<>
          <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:7}}>Nom du membre</label>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={bName} onChange={e=>setBName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")searchMember();}} placeholder="Nom Prénom"
              style={{flex:1,padding:"12px",fontSize:14,border:`1px solid ${T.border}`,borderRadius:10,outline:"none"}}/>
            <button onClick={searchMember} disabled={bLoading||!bName.trim()} style={{padding:"0 16px",background:T.blue,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>🔍</button>
          </div>
          {bLoading&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:10}}>⏳ Recherche...</div>}
          {bInfo&&(bInfo.error?
            <div style={{background:"#FFF0F0",borderRadius:10,padding:12,color:"#C62828",fontWeight:600,fontSize:13,marginBottom:12}}>❌ {bInfo.error}</div>
            :<div style={{background:bInfo.licence==="non"?"#FFF8E1":"#E8F5E9",borderRadius:10,padding:12,marginBottom:12,border:`1px solid ${bInfo.licence==="non"?"#FFE082":"#A5D6A7"}`}}>
              <div style={{fontWeight:800,fontSize:14,color:bInfo.licence==="non"?"#E65100":"#2E7D32",marginBottom:4}}>{bInfo.nom}</div>
              <div style={{fontSize:13,color:T.dark}}>Solde disponible : <b>{fmt(bInfo.solde)}</b></div>
              {bInfo.licence==="non"&&<div style={{fontSize:12,color:"#E65100",fontWeight:600,marginTop:4}}>🔒 Licence non réglée — rien ne peut être offert</div>}
              {bInfo.licence!=="non"&&bInfo.solde<activeAmt-0.001&&
                <div style={{fontSize:12,color:T.orange,fontWeight:600,marginTop:4}}>⚠ Solde insuffisant pour couvrir la totalité de cette part ({fmt(activeAmt)}) — utilisez un autre moyen de paiement pour cette personne.</div>}
            </div>)}
          <button onClick={confirmBoissons} disabled={completing||!bInfo||bInfo.error||bInfo.licence==="non"||bInfo.solde<activeAmt-0.001}
            style={{width:"100%",padding:14,background:(completing||!bInfo||bInfo.error||bInfo.licence==="non"||bInfo.solde<activeAmt-0.001)?"#ccc":T.orange,color:"white",border:"none",borderRadius:12,fontWeight:700,fontSize:15,cursor:"pointer"}}>
            {completing?"⏳ Validation...":"✓ Offrir "+fmt(activeAmt)}
          </button>
        </>}
        {step==="cash"&&<>
          <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:7}}>Montant remis</label>
          <input value={given} onChange={e=>{setGiven(e.target.value);const g=parseFloat(e.target.value.replace(",","."));if(!completing&&!isNaN(g)&&Math.abs(g-activeAmt)<0.001)confirmPayment("cash",{given:g,change:0});}} type="number" step="0.50" placeholder="0,00"
            style={{width:"100%",padding:"14px",fontSize:22,fontWeight:700,border:`2px solid ${T.border}`,borderRadius:12,textAlign:"right",marginBottom:10,outline:"none"}}/>
          {given&&parseFloat(given.replace(",","."))>=activeAmt&&<div style={{background:"#E8F5E9",borderRadius:12,padding:12,marginBottom:12,display:"flex",justifyContent:"space-between"}}>
            <span style={{color:"#2E7D32",fontWeight:600,fontSize:14}}>Monnaie à rendre</span>
            <span style={{color:"#2E7D32",fontWeight:900,fontSize:20}}>{fmt(parseFloat(given.replace(",","."))-activeAmt)}</span>
          </div>}
          <button onClick={()=>{if(completing)return;const g=parseFloat(given.replace(",","."));if(isNaN(g)||g<activeAmt)return;confirmPayment("cash",{given:g,change:+(g-activeAmt).toFixed(2)});}}
            disabled={completing||!given||parseFloat(given.replace(",","."))<activeAmt}
            style={{width:"100%",padding:14,background:completing?"#ccc":(given&&parseFloat(given.replace(",","."))>=activeAmt?T.green:"#ccc"),color:"white",border:"none",borderRadius:12,fontWeight:700,fontSize:15,cursor:completing?"default":"pointer"}}>{completing?"⏳ Validation...":"✓ Valider"}</button>
        </>}
        {step==="check"&&<>
          <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:7}}>N° chèque (optionnel)</label>
          <input value={checkN} onChange={e=>setCheckN(e.target.value)} placeholder="Ex: 1234567"
            style={{width:"100%",padding:"13px",fontSize:15,border:`2px solid ${T.border}`,borderRadius:12,marginBottom:14,outline:"none"}}/>
          <button onClick={()=>confirmPayment("check",{checkNum:checkN})} disabled={completing} style={{width:"100%",padding:14,background:completing?"#ccc":T.blue,color:"white",border:"none",borderRadius:12,fontWeight:700,fontSize:15,cursor:completing?"default":"pointer"}}>{completing?"⏳ Validation...":"✓ Valider"}</button>
        </>}
        </>
      )}
    </div>
  </div>);
}

// ═══ FREE DRINKS MODAL (amélioré) ═══
function FreeDrinksModal({cart,setCart,boissonsUrl,onClose,onFinalize}){
  const [name,setName]=useState(LS.get("anf87_last_member")||"");
  const [memberInfo,setMemberInfo]=useState(null);
  const [loading,setLoading]=useState(false);
  const [applied,setApplied]=useState(false);
  const [appliedSummary,setAppliedSummary]=useState(null); // {count,value} capturés au moment de la validation
  const [scanning,setScanning]=useState(false);
  const videoRef=useRef(null);const readerRef=useRef(null);const camIdRef=useRef(null);
  const justScannedRef=useRef(false);
  const drinkItems=cart.filter(i=>i.drink&&!i.free);
  const qtyB=drinkItems.reduce((s,i)=>s+i.qty,0);
  const paidAfter=cart.reduce((s,i)=>s+(i.free?0:i.price*i.qty),0);

  useEffect(()=>{ if(scanning)startCam(); return()=>stopCam(); },[scanning]);
  // Après un scan QR réussi, on vérifie le solde automatiquement (pas besoin de cliquer la loupe).
  useEffect(()=>{ if(justScannedRef.current){ justScannedRef.current=false; fetchMember(); } },[name]);

  const startCam=async(constraints)=>{
    // ZXing plutôt que l'API BarcodeDetector native : celle-ci n'existe pas du tout sur
    // iPhone/iPad (Safari) et est peu fiable sur beaucoup d'Android — c'était la cause
    // du scan qui "s'ouvre mais ne reconnaît rien". ZXing fonctionne partout.
    if(!window.ZXing){ return; }
    try{
      const reader=new ZXing.BrowserQRCodeReader();
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        constraints||getPreferredCameraConstraints()||SCANNER_VIDEO_CONSTRAINTS, videoRef.current,
        (result)=>{
          if(!result)return;
          stopCam();setScanning(false);
          justScannedRef.current=true;
          const raw=result.getText();
          try{const u=new URL(raw.replace(/ /g,"%20"));
            const p=u.searchParams.get("person");
            setName(p||raw);
          }catch{setName(raw);}
        }
      );
      const track=videoRef.current?.srcObject?.getVideoTracks?.()[0];
      if(track)camIdRef.current=track.getSettings().deviceId;
    }catch{LS.set("anf87_preferred_camera",null);}
  };
  const stopCam=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };


  const fetchMember=async(silent)=>{
    if(!name.trim()||!boissonsUrl)return null;
    if(!silent)setLoading(true);
    let info=null;
    try{
      const url=boissonsUrl.trim()+"?action=getmember&person="+encodeURIComponent(name.trim());
      const r=await fetch(url,{redirect:"follow"});
      if(!r.ok){info={error:"Erreur serveur ("+r.status+")"};}
      else{
        const d=await r.json();
        info=d.ok?d:{error:d.error||"Membre introuvable"};
      }
    }catch(e){
      // Erreur réseau réelle (URL invalide/mal configurée, déploiement inaccessible, hors-ligne...)
      info={error:"Erreur de connexion : "+(e.message||"vérifiez l'URL du script Boissons dans ⚙️ Configuration")};
    }
    setMemberInfo(info);
    if(!silent)setLoading(false);
    return info;
  };

  // Solde connu pour le nom actuellement saisi — EN EUROS depuis ce correctif (plus
  // en nombre de boissons), pour désactiver le bouton et plafonner le montant offert.
  const knownSolde=memberInfo&&!memberInfo.error?memberInfo.solde:null;
  const licenceBlocked=memberInfo&&!memberInfo.error&&memberInfo.licence==="non";
  const maxReached=(knownSolde!=null&&knownSolde<=0)||licenceBlocked;
  const totalDrinkValue=drinkItems.reduce((s,i)=>s+i.price*i.qty,0);

  // Calcule EXACTEMENT ce qui sera offert pour un budget donné : on déduit le solde
  // du MONTANT à payer, même si ça ne correspond pas à une boisson entière (ex: solde
  // 1,50€ sur une bière à 2,50€ → 1,50€ déduits, 1€ à payer pour cette même bière —
  // ce n'est pas "0 ou 1 boisson complète", c'est un crédit partiel sur la facture).
  // Utilisée à la fois pour l'annonce avant validation ET pour la validation réelle,
  // pour que les deux soient toujours d'accord.
  const computeFreeSplit=(cartItems,budget)=>{
    let remainingBudget=budget;
    let actuallyFreeValue=0;
    let leftoverDrinkCost=0;
    const newCart=[];
    cartItems.forEach(item=>{
      if(!item.drink||item.free){newCart.push(item);return;}
      if(remainingBudget<=0.001){newCart.push(item);leftoverDrinkCost+=item.price*item.qty;return;}
      const lineValue=item.price*item.qty;
      if(lineValue<=remainingBudget+0.001){
        // Le solde couvre la ligne en entier : UNE seule ligne, marquée "offerte".
        newCart.push({...item,free:true});
        actuallyFreeValue+=lineValue;
        remainingBudget-=lineValue;
      }else{
        // Le solde ne couvre qu'une PARTIE du montant : on réduit directement le prix
        // de CETTE MÊME ligne (une seule, pas de ligne "reçu" séparée — ça donnait
        // l'impression fausse d'une boisson offerte EN PLUS de la boisson payante,
        // au lieu d'une seule boisson à tarif réduit).
        const freeAmt=+remainingBudget.toFixed(2);
        const newPrice=+(item.price-freeAmt/item.qty).toFixed(4);
        newCart.push({...item,price:newPrice,reduced:true,originalPrice:item.price});
        actuallyFreeValue+=freeAmt;
        leftoverDrinkCost+=lineValue-freeAmt;
        remainingBudget=0;
      }
    });
    return{newCart,actuallyFreeValue,leftoverDrinkCost};
  };
  // Montant exact qui sera réellement offert — même calcul que la validation, jamais
  // un simple plafond.
  const plannedFreeValue=licenceBlocked?0:computeFreeSplit(cart,knownSolde!=null?knownSolde:Infinity).actuallyFreeValue;

  const apply=async()=>{
    if(!name.trim())return;
    setLoading(true);
    // On revérifie toujours le solde juste avant de valider (il peut avoir changé
    // depuis la dernière recherche, ou n'avoir jamais été recherché après un scan).
    const info=await fetchMember(true);
    if(!info||info.error){setLoading(false);return;} // le message d'erreur est déjà affiché
    if(info.licence==="non"){setLoading(false);return;} // licence non réglée : rien n'est offert
    const soldeValue=info.solde||0; // en €
    if(soldeValue<=0){setLoading(false);return;} // maximum déjà atteint, on ne valide rien
    LS.set("anf87_last_member",name.trim());

    // Même calcul que l'annonce affichée avant validation (computeFreeSplit) — garantit
    // que le montant réellement offert correspond toujours à ce qui a été annoncé.
    const nonDrinkTotal=cart.reduce((s,i)=>i.drink?s:s+i.price*i.qty,0);
    const{newCart,actuallyFreeValue,leftoverDrinkCost}=computeFreeSplit(cart,soldeValue);
    setCart(newCart);

    // Mise à jour du compteur côté serveur : on attend la confirmation au lieu d'un
    // fire-and-forget silencieux, pour prévenir si ça n'a pas pu être enregistré.
    // Petite nouvelle tentative automatique en cas d'aléa réseau ponctuel (wifi/4G
    // de la buvette) avant d'afficher une vraie erreur à l'utilisateur — avec le
    // MÊME reqid à chaque tentative, pour que le serveur ignore un doublon si la
    // 1ère tentative avait en fait réussi malgré l'erreur réseau côté appli
    // (c'était la cause du double décompte : "ça déduit 2 au lieu de 1").
    const reqId=Date.now()+"-"+Math.random().toString(36).slice(2);
    const scanUrl=boissonsUrl.trim()+"?action=scan&amount="+actuallyFreeValue.toFixed(2)+"&person="+encodeURIComponent(name.trim())+"&reqid="+reqId;
    let scanOk=false,lastErr=null;
    for(let attempt=0;attempt<3&&!scanOk;attempt++){
      try{ await fetch(scanUrl,{redirect:"follow"}); scanOk=true; }
      catch(e){ lastErr=e; if(attempt<2)await new Promise(r=>setTimeout(r,1000)); }
    }
    if(!scanOk){
      setLoading(false);
      // Ce message apparaît parfois même quand l'enregistrement a en fait réussi côté
      // serveur (la réponse ne revient pas jusqu'au navigateur, mais l'écriture, elle,
      // a bien eu lieu) — le reqid ci-dessus protège contre un double décompte dans ce
      // cas, donc on formule ça comme une incertitude plutôt qu'un échec certain.
      window.alert("⚠️ La confirmation du serveur n'a pas pu être reçue ("+(lastErr?.message||"connexion")+
        "). Les boissons ont bien été retirées du total ici, et la mise à jour a très probablement quand même été enregistrée sur Google Sheets (vérifiez le solde du membre si vous avez un doute).");
    }
    setAppliedSummary({value:actuallyFreeValue,numLicence:info.numLicence||""});
    setLoading(false);
    setApplied(true);
    // Si tout le montant a pu être offert et qu'il ne reste rien d'autre à payer,
    // on finalise la vente automatiquement.
    if(nonDrinkTotal+leftoverDrinkCost<=0.001){setTimeout(()=>onFinalize({type:"free_drinks",member:name.trim()}),1200);}
    // Sinon (panier supérieur au solde) : le montant offert a bien été déduit du
    // panier, il reste un solde à payer — on repasse automatiquement à l'écran
    // d'encaissement pour ce reste, sans attendre que la personne pense à fermer
    // cette fenêtre elle-même.
    else{setTimeout(()=>onClose(),1800);}
  };

  const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:300,display:"flex",alignItems:"flex-end",justifyContent:"center"};

  return(<div style={ov}>
    <div style={{background:T.card,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:500,padding:"20px 18px 34px",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{width:40,height:4,background:T.border,borderRadius:2,margin:"0 auto 14px"}}/>
      <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:4}}>🍺 Carte Boissons ANF 87</div>
      <div style={{fontSize:13,color:T.mid,marginBottom:16}}>{qtyB} boisson(s) éligible(s)</div>

      {!applied?<>
        {scanning?(<div style={{marginBottom:14}}>
          <video ref={videoRef} onClick={()=>refocusVideo(videoRef.current)} style={{width:"100%",height:170,objectFit:"cover",borderRadius:12,background:"#000",cursor:"pointer"}} muted playsInline/>
          <div style={{fontSize:10,color:T.mid,textAlign:"center",marginTop:2}}>Image floue ? Touchez-la pour refaire la mise au point</div>
          <div style={{display:"flex",gap:6,marginTop:6}}>
            <button onClick={()=>switchCamera(videoRef.current,readerRef,camIdRef,startCam)} style={{flex:1,padding:"8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12}}>🔄 Autre caméra</button>
            <button onClick={()=>{stopCam();setScanning(false);}} style={{flex:1,padding:"8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:13}}>Annuler le scan</button>
          </div>
        </div>):(
          <button onClick={()=>setScanning(true)} style={{width:"100%",padding:"12px",background:T.dark,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:600,fontSize:13,marginBottom:10}}>
            📷 Scanner la carte QR du membre
          </button>
        )}
        <div style={{fontSize:12,color:T.mid,textAlign:"center",marginBottom:8}}>— ou saisir manuellement —</div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Nom Prénom du membre"
            style={{flex:1,padding:"12px",fontSize:15,border:`2px solid ${T.border}`,borderRadius:10,outline:"none"}}/>
          <button onClick={fetchMember} disabled={!name.trim()||!boissonsUrl||loading}
            style={{padding:"12px 16px",background:T.blue,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>
            {loading?"⏳":"🔍"}
          </button>
        </div>

        {/* Infos membre */}
        {memberInfo&&<div style={{background:memberInfo.error?"#FFF0F0":(licenceBlocked?"#FFF8E1":"#E8F5E9"),borderRadius:12,padding:14,marginBottom:14,
          border:`1px solid ${memberInfo.error?"#FFCDD2":(licenceBlocked?"#FFE082":"#A5D6A7")}`}}>
          {memberInfo.error?<div style={{color:"#C62828",fontWeight:700,fontSize:14}}>❌ {memberInfo.error}</div>
            :licenceBlocked?
              <div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  {memberInfo.photo?<img src={memberInfo.photo} style={{width:44,height:44,borderRadius:10,objectFit:"cover",flexShrink:0}}/>
                    :<div style={{width:44,height:44,borderRadius:10,background:"rgba(230,81,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>👤</div>}
                  <div>
                    <div style={{fontWeight:800,fontSize:15,color:"#E65100"}}>{memberInfo.nom}</div>
                    {memberInfo.numLicence&&<div style={{fontSize:11,color:"#E65100",opacity:.8}}>{memberInfo.numLicence}</div>}
                  </div>
                </div>
                <div style={{color:"#E65100",fontWeight:700,fontSize:13,lineHeight:1.4}}>
                  🔒 Merci de régler la licence pour débloquer {totalDrinkValue>0?fmt(totalDrinkValue)+" offert(s)":"la consommation offerte"}.
                </div>
              </div>
            :<div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                {memberInfo.photo?<img src={memberInfo.photo} style={{width:44,height:44,borderRadius:10,objectFit:"cover",flexShrink:0}}/>
                  :<div style={{width:44,height:44,borderRadius:10,background:"rgba(46,125,50,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>👤</div>}
                <div>
                  <div style={{fontWeight:800,fontSize:15,color:"#2E7D32"}}>{memberInfo.nom}</div>
                  {memberInfo.numLicence&&<div style={{fontSize:11,color:"#2E7D32",opacity:.8}}>{memberInfo.numLicence}</div>}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[["Consommé",fmt(memberInfo.compteur),"#CC0000"],["Restant",fmt(memberInfo.solde),"#2E7D32"],["Maximum",fmt(memberInfo.maximum),"#1565C0"]].map(([l,v,c])=>(
                  <div key={l} style={{textAlign:"center",background:"white",borderRadius:8,padding:"8px 4px"}}>
                    <div style={{fontSize:16,fontWeight:900,color:c}}>{v}</div>
                    <div style={{fontSize:10,color:T.mid,textTransform:"uppercase",fontWeight:700}}>{l}</div>
                  </div>
                ))}
              </div>
              {memberInfo.solde<=0&&<div style={{marginTop:8,color:T.red,fontWeight:700,fontSize:12}}>🚫 Maximum atteint — plus aucune consommation offerte disponible pour ce membre</div>}
              {memberInfo.solde>0&&memberInfo.solde<totalDrinkValue&&<div style={{marginTop:8,color:T.orange,fontWeight:700,fontSize:12}}>
                ⚠ Solde insuffisant : {fmt(plannedFreeValue)} seront déduits sur {fmt(totalDrinkValue)}, le reste ({fmt(totalDrinkValue-plannedFreeValue)}) sera à payer
              </div>}
            </div>
          }
        </div>}

        {/* Boissons concernées — aperçu EXACT de ce que donnera le panier après
            validation (même calcul, computeFreeSplit), pour ne jamais montrer autre
            chose que ce qui sera réellement appliqué. */}
        <div style={{background:"#FFF8E1",borderRadius:10,padding:12,marginBottom:14}}>
          {computeFreeSplit(cart,licenceBlocked?0:(knownSolde!=null?knownSolde:Infinity)).newCart
            .filter(i=>i.drink).map((i,idx)=>(
            <div key={idx} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"3px 0"}}>
              <span>{i.emoji} {i.name} ×{i.qty}{i.reduced?" (tarif réduit)":""}</span>
              <span style={{fontWeight:700,color:i.free?T.green:i.reduced?T.orange:T.dark}}>{i.free?"OFFERT":fmt(i.price*i.qty)}</span>
            </div>
          ))}
          <div style={{borderTop:`1px dashed ${T.border}`,marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:14}}>
            <span>Montant offert</span>
            <span style={{color:T.orange}}>{fmt(plannedFreeValue)}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose} style={{flex:1,padding:"13px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={apply} disabled={!name.trim()||maxReached||loading}
            style={{flex:2,padding:"13px",background:(!name.trim()||maxReached)?"#ccc":T.orange,color:"white",border:"none",
              borderRadius:10,cursor:(!name.trim()||maxReached)?"not-allowed":"pointer",fontWeight:700,fontSize:14}}>
            {licenceBlocked?"🔒 Licence à régler":maxReached?"🚫 Maximum atteint":loading?"⏳ Vérification...":"✓ Valider les boissons offertes"}
          </button>
        </div>
      </>:(
        <div style={{textAlign:"center",padding:"10px 0"}}>
          <div style={{fontSize:52,marginBottom:12}}>✅</div>
          <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:4}}>{fmt(appliedSummary?.value||0)} offert(s) à {name}</div>
          {appliedSummary?.numLicence&&<div style={{fontSize:12,color:T.mid,marginBottom:2}}>{appliedSummary.numLicence}</div>}
          <div style={{fontSize:13,color:T.mid,marginBottom:8}}>Compteur ANF 87 mis à jour</div>
          {paidAfter<=0.001
            ?<div style={{background:"#E8F5E9",borderRadius:12,padding:12,marginBottom:16,fontSize:14,color:"#2E7D32",fontWeight:700}}>✅ Total à 0€ — finalisation automatique...</div>
            :<button onClick={onClose} style={{width:"100%",padding:"14px",background:T.red,color:"white",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:15}}>← Retour paiement ({fmt(paidAfter)} restants)</button>
          }
        </div>
      )}
    </div>
  </div>);
}

// ═══ SCANNER CODE-BARRES ═══
function ScannerModal({products,siteId,onFound,onClose}){
  const videoRef=useRef(null);const readerRef=useRef(null);const camIdRef=useRef(null);
  const [found,setFound]=useState(null);const [manual,setManual]=useState("");const [msg,setMsg]=useState("Pointez sur le code-barres");
  useEffect(()=>{startCam();return()=>stopCam();},[]);
  const startCam=async(constraints)=>{
    // ZXing plutôt que l'API BarcodeDetector native, absente sur iPhone/iPad (Safari)
    // et peu fiable sur beaucoup d'Android — cause du scan qui s'ouvrait sans jamais détecter.
    if(!window.ZXing){setMsg("Saisir manuellement ↓");return;}
    try{
      const hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39]);
      const reader=new ZXing.BrowserMultiFormatReader(hints);
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        constraints||getPreferredCameraConstraints()||SCANNER_VIDEO_CONSTRAINTS, videoRef.current,
        (result)=>{ if(result)handle(result.getText()); }
      );
      const track=videoRef.current?.srcObject?.getVideoTracks?.()[0];
      if(track)camIdRef.current=track.getSettings().deviceId;
    }catch{setMsg("Caméra indisponible — saisir manuellement ↓");LS.set("anf87_preferred_camera",null);}
  };
  const stopCam=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };
  const handle=code=>{const c=code.trim();const p=products.find(pr=>pr.barcode&&pr.barcode.toString()===c);
    if(p)setFound(p);else{setMsg("⚠ Produit introuvable: "+code);setTimeout(()=>setMsg("Pointez sur le code-barres"),2500);}};
  const handleManual=()=>{const m=manual.trim();const p=products.find(pr=>(pr.barcode&&pr.barcode.toString()===m)||pr.name.toLowerCase().includes(manual.toLowerCase()));
    if(p)setFound(p);else setMsg("⚠ Produit introuvable");};

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
    <div style={{background:T.card,borderRadius:18,width:"100%",maxWidth:360,overflow:"hidden"}}>
      <div style={{background:T.dark,padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{color:"white",fontWeight:700,fontSize:15}}>📷 Scanner un produit</span>
        <button onClick={()=>{stopCam();onClose();}} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.7)",fontSize:20}}>✕</button>
      </div>
      {!found?<>
        <div style={{position:"relative",background:"#000",height:200}}>
          <video ref={videoRef} onClick={()=>refocusVideo(videoRef.current)} style={{width:"100%",height:"100%",objectFit:"cover",cursor:"pointer"}} muted playsInline/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{width:180,height:80,border:"2px solid rgba(255,255,255,0.7)",borderRadius:6}}/>
          </div>
          <button onClick={()=>switchCamera(videoRef.current,readerRef,camIdRef,startCam)}
            style={{position:"absolute",bottom:8,right:8,padding:"6px 10px",background:"rgba(0,0,0,0.6)",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontSize:11}}>🔄 Autre caméra</button>
        </div>
        <div style={{padding:"14px 16px"}}>
          <div style={{fontSize:12,color:T.mid,textAlign:"center",marginBottom:10}}>{msg}</div>
          <div style={{display:"flex",gap:7}}>
            <input value={manual} onChange={e=>setManual(e.target.value)} placeholder="Code-barres ou nom"
              onKeyDown={e=>e.key==="Enter"&&handleManual()}
              style={{flex:1,padding:"10px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none"}}/>
            <button onClick={handleManual} style={{padding:"10px 14px",background:T.red,color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>OK</button>
          </div>
        </div>
      </>:(
        <div style={{padding:22,textAlign:"center"}}>
          {found.photo?<img src={found.photo} style={{width:60,height:60,borderRadius:12,objectFit:"cover",marginBottom:10}}/>
            :<div style={{fontSize:48,marginBottom:10}}>{found.emoji}</div>}
          <div style={{fontSize:17,fontWeight:700,color:T.dark,marginBottom:4}}>{found.name}</div>
          <div style={{fontSize:22,fontWeight:900,color:T.red,marginBottom:10}}>{fmt(found.price)}</div>
          <div style={{fontSize:12,color:T.mid,marginBottom:18}}>Stock: {found.stock[siteId]||0} unités</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setFound(null);setManual("");}} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Autre</button>
            <button onClick={()=>{onFound(found);stopCam();onClose();}}
              style={{flex:2,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>
              + Ajouter
            </button>
          </div>
        </div>
      )}
    </div>
  </div>);
}

      {[["list","📋 Stock"],["entry","📥 Entrée rapide"],["containers","🧴 Contenants"],["transfer","↔ Transfert"]].map(([v,l])=>(

// ═══ CONTENANTS (fûts / bouteilles / cubis) ═══
function ContainersScreen({products,sites,siteId,setSiteId,caisseUrl,containers,setContainers,reserve,setReserve}){
  const [busyKey,setBusyKey]=useState(null); // clé "siteId_productId" en cours de traitement
  const [closeConfirm,setCloseConfirm]=useState(null); // {product,cont} en attente de confirmation

  const volProducts=products.filter(p=>p.sellByVolume&&parseContainers(p.containers).length>0);
  const findCont=pid=>containers.find(c=>c.site===siteId&&c.productId.toString()===pid.toString());

  const doOpen=async(prod,choice)=>{
    setBusyKey(siteId+"_"+prod.id);
    await openContainerApi(caisseUrl,siteId,prod,choice,setContainers);
    setBusyKey(null);
  };

  const doClose=async(prod,cont)=>{
    setBusyKey(siteId+"_"+prod.id);
    await closeContainerApi(caisseUrl,siteId,prod,setContainers);
    setBusyKey(null);setCloseConfirm(null);
  };

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}}>
      {sites.map(s=><button key={s.id} onClick={()=>setSiteId(s.id)} style={{padding:"7px 14px",borderRadius:20,border:`1px solid ${siteId===s.id?s.color:T.border}`,
        background:siteId===s.id?s.color:T.card,color:siteId===s.id?"white":T.dark,fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{s.name}</button>)}
    </div>
    {volProducts.length===0&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:30}}>
      Aucun produit avec des tailles de contenant configurées.<br/>Ajoutez-les dans Admin → Produits → "Tailles de contenant".
    </div>}
    {volProducts.map(prod=>{
      const cont=findCont(prod.id);
      const presets=parseContainers(prod.containers);
      const busy=busyKey===siteId+"_"+prod.id;
      const pct=cont?Math.max(0,Math.min(100,(cont.remaining/cont.size)*100)):0;
      const gaugeColor=prod.color||T.orange; // couleur choisie pour ce produit (comme les sites)
      // Ligne dédiée "en réserve" : contenants pleins encore disponibles en stock,
      // au-delà de celui actuellement ouvert (visible même après ouverture).
      const reserveLine=presets.map(c=>{
        const total=containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size);
        const openSame=cont&&cont.label===c.label&&cont.size===c.size;
        const n=openSame?Math.max(0,total-1):total;
        return n>0?`${n}× ${c.label}`:null;
      }).filter(Boolean).join(", ");
      return(<div key={prod.id} style={{background:T.card,borderRadius:14,padding:16,marginBottom:12,border:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          {prod.photo?<img src={prod.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover"}}/>:<span style={{fontSize:28}}>{prod.emoji}</span>}
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15,color:T.dark}}>{prod.name}</div>
            <div style={{fontSize:11,color:T.mid}}>Stock total : {prod.stock[siteId]||0}{prod.unit}</div>
          </div>
        </div>
        {reserveLine&&<div style={{fontSize:12,color:T.dark,background:T.bg,borderRadius:8,padding:"6px 10px",marginBottom:10,fontWeight:600}}>📦 {reserveLine} en réserve</div>}
        {cont?<>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:T.mid,marginBottom:4}}>
            <span style={{fontWeight:700,color:T.dark}}>{cont.label}</span>
            <span>{cont.remaining} / {cont.size}{prod.unit}</span>
          </div>
          <div style={{height:14,background:T.bg,borderRadius:7,overflow:"hidden",marginBottom:6}}>
            <div style={{height:"100%",width:pct+"%",background:gaugeColor,transition:"width .3s"}}/>
          </div>
          <div style={{fontSize:11,color:T.mid,marginBottom:10}}>Ouvert le {cont.openedAt}</div>
          <button disabled={busy} onClick={()=>setCloseConfirm({prod,cont})}
            style={{width:"100%",padding:"10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:9,cursor:busy?"default":"pointer",fontWeight:600,fontSize:13,color:T.dark}}>
            {busy?"⏳...":"🏁 Terminer ce contenant"}
          </button>
        </>:<>
          <div style={{fontSize:12,color:T.mid,marginBottom:8}}>Aucun contenant ouvert actuellement</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            {presets.map((c,i)=>{
              const n=containerAvailable(reserve,prod.stock[siteId]||0,siteId,prod.id,c.label,c.size);
              return(<button key={i} disabled={busy||n===0} onClick={()=>doOpen(prod,c)}
                style={{padding:"9px 12px",background:n===0?"#ccc":T.green,color:"white",border:"none",borderRadius:9,cursor:(busy||n===0)?"default":"pointer",fontWeight:600,fontSize:12,opacity:n===0?.6:1}}>
                {busy?"⏳...":"+ Ouvrir "+c.label+" ("+n+" en stock)"}
              </button>);
            })}
          </div>
        </>}
      </div>);
    })}
    {/* Confirmation de clôture, avec régularisation du stock */}
    {closeConfirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
      onClick={e=>e.target===e.currentTarget&&setCloseConfirm(null)}>
      <div style={{background:T.card,borderRadius:16,padding:22,width:"100%",maxWidth:360}}>
        <div style={{fontWeight:800,fontSize:16,color:T.dark,marginBottom:8}}>🏁 Terminer {closeConfirm.cont.label} ?</div>
        <div style={{fontSize:13,color:T.mid,lineHeight:1.5,marginBottom:14}}>
          Il reste <b>{closeConfirm.cont.remaining}{closeConfirm.prod.unit}</b> dans la jauge. Cette quantité sera
          déduite du stock de "{closeConfirm.prod.name}" pour corriger l'écart (pertes, verres renversés...).
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setCloseConfirm(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={()=>doClose(closeConfirm.prod,closeConfirm.cont)} style={{flex:1,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Confirmer</button>
        </div>
      </div>
    </div>}
  </div>);
}

// ═══ CARTES BOISSONS (feuille Membres du script Boissons Offertes) ═══
function CardsAdmin({boissonsUrl}){
  const [members,setMembers]=useState(null); // null = pas encore chargé
  const [loading,setLoading]=useState(false);
  const [errMsg,setErrMsg]=useState("");
  const [edit,setEdit]=useState(null); // membre en cours d'édition, ou {} pour nouveau
  const [busy,setBusy]=useState(false);
  const [search,setSearch]=useState("");
  const [cardFor,setCardFor]=useState(null); // membre dont la carte est affichée
  const [printingAll,setPrintingAll]=useState(false);
  const [printSelection,setPrintSelection]=useState(null); // null = fermé, sinon Set des IDs cochés

  const load=async()=>{
    if(!boissonsUrl){setErrMsg("Configurez d'abord l'URL Script Boissons dans ⚙️ Configuration.");return;}
    setLoading(true);setErrMsg("");
    const r=await api(boissonsUrl,{action:"getmembers"});
    if(r.ok)setMembers(r.members||[]);
    else setErrMsg(r.error||"Échec du chargement");
    setLoading(false);
  };
  useEffect(()=>{load();},[boissonsUrl]);

  const startNew=()=>setEdit({id:"",nom:"",compteur:0,licence:"oui",numLicence:"",photo:"",maximum:0,solde:0,entrainements:0});
  const startEdit=m=>setEdit({...m});

  const handlePhoto=e=>{const f=e.target.files[0];if(!f)return;
    cropSquarePhoto(f).then(url=>setEdit(prev=>({...prev,photo:url})));
  };

  const save=async()=>{
    if(!edit.nom.trim()||busy)return;
    setBusy(true);
    const id=edit.id||uid();
    const original=edit.id?members.find(m=>m.id.toString()===edit.id.toString()):null;
    const photoChanged=!original||edit.photo!==(original.photo||"");
    let photoParam,extra={};
    if(photoChanged){
      const up=await uploadPhotoGeneric(boissonsUrl,"uploadmemberphotochunk",id,edit.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error);setBusy(false);return;}
      photoParam=up.photoParam;extra=up.photoChunks?{photoChunks:up.photoChunks}:{};
    }else{
      photoParam="__KEEP__";
    }
    // Maximum/Solde restent calculés par la feuille et ne sont jamais envoyés —
    // seul Entraînements (donnée d'entrée de la formule) est modifiable et transmis.
    const r=await api(boissonsUrl,{action:"savemember",id,nom:edit.nom.trim(),compteur:edit.compteur,
      licence:edit.licence,numLicence:edit.numLicence,entrainements:edit.entrainements,photo:photoParam,...extra});
    if(r.ok){
      // Maximum/Solde : on garde la dernière valeur connue (calculée par la feuille)
      // pour un membre existant ; le vrai résultat après ce changement d'entraînements
      // ne sera connu qu'à la prochaine actualisation (la formule tourne côté serveur).
      const newEntry={id,nom:edit.nom.trim(),compteur:+edit.compteur||0,licence:edit.licence,
        maximum:original?.maximum||0,solde:original?original.maximum-(+edit.compteur||0):0,
        entrainements:edit.entrainements||"",numLicence:edit.numLicence||"",
        photo:photoChanged?(photoParam==="__CHUNKED__"?edit.photo:photoParam):(original?.photo||"")};
      setMembers(prev=>[...prev.filter(m=>m.id.toString()!==id.toString()),newEntry]);
      setEdit(null);
    }else{
      window.alert("⚠️ Échec de l'enregistrement : "+(r.error||"connexion"));
    }
    setBusy(false);
  };

  const del=async id=>{
    if(!window.confirm("Supprimer cette carte membre ?")||busy)return;
    setBusy(true);
    const r=await api(boissonsUrl,{action:"deletemember",id});
    if(r.ok)setMembers(prev=>prev.filter(m=>m.id.toString()!==id.toString()));
    else window.alert("⚠️ Échec de la suppression : "+(r.error||"connexion"));
    setBusy(false);
  };

  const filtered=(members||[]).filter(m=>m.nom.toLowerCase().includes(search.trim().toLowerCase()));

  // Génère un PDF avec les membres sélectionnés, en A4 Portrait, au format CB exact
  // (85,60 x 53,98 mm) — prêt à imprimer et découper.
  const generatePdfFor=async(list)=>{
    if(!list.length||printingAll)return;
    setPrintingAll(true);
    try{
      if(!window.jspdf)throw new Error("La bibliothèque PDF n'a pas pu se charger (vérifiez la connexion internet, puis rechargez complètement la page).");
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
      const marginX=(210-CARD_MM_W)/2,gapY=10;
      let y=20;
      for(const m of list){
        const canvas=await generateMemberCardCanvas(m,boissonsUrl);
        const imgData=canvas.toDataURL("image/jpeg",0.85);
        if(y+CARD_MM_H>287){doc.addPage();y=20;}
        doc.addImage(imgData,"JPEG",marginX,y,CARD_MM_W,CARD_MM_H);
        y+=CARD_MM_H+gapY;
      }
      doc.save("cartes-boissons-anf87.pdf");
      setPrintSelection(null);
    }catch(err){
      window.alert("⚠️ Échec de la génération du PDF : "+(err.message||err));
    }
    setPrintingAll(false);
  };

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <button onClick={startNew} style={{flex:1,padding:"12px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>
        + Nouvelle carte membre
      </button>
      <button onClick={()=>setPrintSelection(new Set((members||[]).map(m=>m.id)))} disabled={printingAll||!members||!members.length} style={{flex:1,padding:"12px",background:printingAll?"#ccc":"#5856D6",color:"white",border:"none",borderRadius:10,cursor:printingAll?"default":"pointer",fontWeight:700}}>
        {printingAll?"⏳ Génération...":"🖨 Imprimer (PDF)"}
      </button>
    </div>
    {errMsg&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:13,color:T.red}}>{errMsg}</div>}
    {loading&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:20}}>⏳ Chargement...</div>}
    {members&&<>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un membre…"
        style={{width:"100%",padding:"10px 12px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:13,marginBottom:12,outline:"none"}}/>
      {filtered.map(m=>(
        <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,background:T.card,borderRadius:10,padding:"10px 14px",marginBottom:7,border:`1px solid ${T.border}`}}>
          {m.photo?<img src={m.photo} style={{width:40,height:40,borderRadius:8,objectFit:"cover",flexShrink:0}}/>
            :<div style={{width:40,height:40,borderRadius:8,background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>👤</div>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.nom}</div>
            <div style={{fontSize:11,color:m.licence==="non"?T.red:T.mid}}>
              {fmt(m.compteur)} / {fmt(m.maximum)} • 🏃 {m.entrainements} entr. • {m.licence==="non"?"🔒 Licence non réglée":"Licence OK"}{m.numLicence?" • n°"+m.numLicence:""}
            </div>
          </div>
          <button onClick={()=>setCardFor(m)} style={{padding:"6px 9px",background:"#EEF0FF",border:"1px solid #5856D6",borderRadius:7,cursor:"pointer",fontSize:11}}>🪪</button>
          <button onClick={()=>startEdit(m)} style={{padding:"6px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
          <button onClick={()=>del(m.id)} disabled={busy} style={{padding:"6px 9px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:busy?"default":"pointer",color:T.red}}>🗑</button>
        </div>
      ))}
      {filtered.length===0&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:20}}>Aucun membre trouvé</div>}
    </>}

    {edit&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>{edit.id?"✏️ Modifier":"+ Nouvelle carte"}</div>

        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>
          {edit.photo?<img src={edit.photo} style={{width:100,height:100,borderRadius:12,objectFit:"cover"}}/>
            :<div style={{width:100,height:100,borderRadius:12,background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>👤</div>}
        </div>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:6,textAlign:"center"}}>
          Recadrée en carré et réduite automatiquement
        </label>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <label style={{flex:1,textAlign:"center",padding:"9px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:T.dark}}>
            📁 Galerie
            <input type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/>
          </label>
          <label style={{flex:1,textAlign:"center",padding:"9px",background:"#EEF0FF",border:"1px solid #5856D6",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#5856D6"}}>
            📷 Prendre une photo
            <input type="file" accept="image/*" capture="user" onChange={handlePhoto} style={{display:"none"}}/>
          </label>
        </div>

        <input placeholder="Nom" value={edit.nom} onChange={e=>setEdit({...edit,nom:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <input placeholder="N° de licence" value={edit.numLicence} onChange={e=>setEdit({...edit,numLicence:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <div style={{display:"flex",gap:7,marginBottom:7}}>
          <div style={{flex:1}}>
            <label style={{fontSize:11,color:T.mid,display:"block",marginBottom:3}}>Consommé (€)</label>
            <input type="number" step="0.50" value={edit.compteur} onChange={e=>setEdit({...edit,compteur:e.target.value})}
              style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:11,color:T.mid,display:"block",marginBottom:3}}>🏃 Entraînements</label>
            <input type="text" placeholder="ex: 12 ou don" value={edit.entrainements} onChange={e=>setEdit({...edit,entrainements:e.target.value})}

          <button onClick={()=>generatePdfFor(members.filter(m=>printSelection.has(m.id)))} disabled={printingAll||printSelection.size===0}
            style={{flex:2,padding:"11px",background:(printingAll||printSelection.size===0)?"#ccc":"#5856D6",color:"white",border:"none",borderRadius:10,cursor:(printingAll||printSelection.size===0)?"default":"pointer",fontWeight:700}}>
            {printingAll?"⏳ Génération...":`Générer le PDF (${printSelection.size})`}
