// ═══ CONTENANTS (fûts / bouteilles / cubis) ═══
function ContainersScreen({products,sites,siteId,setSiteId,caisseUrl,containers,setContainers}){
  const [busyKey,setBusyKey]=useState(null); // clé "siteId_productId" en cours de traitement
  const [closeConfirm,setCloseConfirm]=useState(null); // {product,cont} en attente de confirmation

  const volProducts=products.filter(p=>p.sellByVolume&&parseContainers(p.containers).length>0);
  const findCont=pid=>containers.find(c=>c.site===siteId&&c.productId.toString()===pid.toString());

  const doOpen=async(prod,choice)=>{
    setBusyKey(siteId+"_"+prod.id);
    await openContainerApi(caisseUrl,siteId,prod,choice,setContainers);
    setBusyKey(null);
  };

  const doClose=async(prod,cont)=>{
    setBusyKey(siteId+"_"+prod.id);
    await closeContainerApi(caisseUrl,siteId,prod,setContainers);
    setBusyKey(null);setCloseConfirm(null);
  };

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}}>
      {sites.map(s=><button key={s.id} onClick={()=>setSiteId(s.id)} style={{padding:"7px 14px",borderRadius:20,border:`1px solid ${siteId===s.id?s.color:T.border}`,
        background:siteId===s.id?s.color:T.card,color:siteId===s.id?"white":T.dark,fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{s.name}</button>)}
    </div>
    {volProducts.length===0&&<div style={{textAlign:"center",color:T.mid,fontSize:13,padding:30}}>
      Aucun produit avec des tailles de contenant configurées.<br/>Ajoutez-les dans Admin → Produits → "Tailles de contenant".
    </div>}
    {volProducts.map(prod=>{
      const cont=findCont(prod.id);
      const presets=parseContainers(prod.containers);
      const busy=busyKey===siteId+"_"+prod.id;
      const pct=cont?Math.max(0,Math.min(100,(cont.remaining/cont.size)*100)):0;
      const gaugeColor=prod.color||T.orange; // couleur choisie pour ce produit (comme les sites)
      // Ligne dédiée "en réserve" : contenants pleins encore disponibles en stock,
      // au-delà de celui actuellement ouvert (visible même après ouverture).
      const reserveLine=presets.map(c=>{
        const total=containerCount(prod.stock[siteId]||0,c.size);
        const openSame=cont&&cont.label===c.label&&cont.size===c.size;
        const n=openSame?Math.max(0,total-1):total;
        return n>0?`${n}× ${c.label}`:null;
      }).filter(Boolean).join(", ");
      return(<div key={prod.id} style={{background:T.card,borderRadius:14,padding:16,marginBottom:12,border:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          {prod.photo?<img src={prod.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover"}}/>:<span style={{fontSize:28}}>{prod.emoji}</span>}
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15,color:T.dark}}>{prod.name}</div>
            <div style={{fontSize:11,color:T.mid}}>Stock total : {prod.stock[siteId]||0}{prod.unit}</div>
          </div>
        </div>
        {reserveLine&&<div style={{fontSize:12,color:T.dark,background:T.bg,borderRadius:8,padding:"6px 10px",marginBottom:10,fontWeight:600}}>📦 {reserveLine} en réserve</div>}
        {cont?<>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:T.mid,marginBottom:4}}>
            <span style={{fontWeight:700,color:T.dark}}>{cont.label}</span>
            <span>{cont.remaining} / {cont.size}{prod.unit}</span>
          </div>
          <div style={{height:14,background:T.bg,borderRadius:7,overflow:"hidden",marginBottom:6}}>
            <div style={{height:"100%",width:pct+"%",background:gaugeColor,transition:"width .3s"}}/>
          </div>
          <div style={{fontSize:11,color:T.mid,marginBottom:10}}>Ouvert le {cont.openedAt}</div>
          <button disabled={busy} onClick={()=>setCloseConfirm({prod,cont})}
            style={{width:"100%",padding:"10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:9,cursor:busy?"default":"pointer",fontWeight:600,fontSize:13,color:T.dark}}>
            {busy?"⏳...":"🏁 Terminer ce contenant"}
          </button>
        </>:<>
          <div style={{fontSize:12,color:T.mid,marginBottom:8}}>Aucun contenant ouvert actuellement</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            {presets.map((c,i)=>{
              const n=containerCount(prod.stock[siteId]||0,c.size);
              return(<button key={i} disabled={busy||n===0} onClick={()=>doOpen(prod,c)}
                style={{padding:"9px 12px",background:n===0?"#ccc":T.green,color:"white",border:"none",borderRadius:9,cursor:(busy||n===0)?"default":"pointer",fontWeight:600,fontSize:12,opacity:n===0?.6:1}}>
                {busy?"⏳...":"+ Ouvrir "+c.label+" ("+n+" en stock)"}
              </button>);
            })}
          </div>
        </>}
      </div>);
    })}
    {/* Confirmation de clôture, avec régularisation du stock */}
    {closeConfirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:220,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
      onClick={e=>e.target===e.currentTarget&&setCloseConfirm(null)}>
      <div style={{background:T.card,borderRadius:16,padding:22,width:"100%",maxWidth:360}}>
        <div style={{fontWeight:800,fontSize:16,color:T.dark,marginBottom:8}}>🏁 Terminer {closeConfirm.cont.label} ?</div>
        <div style={{fontSize:13,color:T.mid,lineHeight:1.5,marginBottom:14}}>
          Il reste <b>{closeConfirm.cont.remaining}{closeConfirm.prod.unit}</b> dans la jauge. Cette quantité sera
          déduite du stock de "{closeConfirm.prod.name}" pour corriger l'écart (pertes, verres renversés...).
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setCloseConfirm(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={()=>doClose(closeConfirm.prod,closeConfirm.cont)} style={{flex:1,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Confirmer</button>
        </div>
      </div>
    </div>}
  </div>);
}

// ═══ GESTION DES COMBOS/MENUS (plusieurs produits différents en une vente) ═══
function CombosAdmin({products,combos,setCombos,caisseUrl}){
  const [edit,setEdit]=useState(null); // combo en cours d'édition, ou {} pour nouveau
  const [busy,setBusy]=useState(false);

  const startNew=()=>setEdit({id:null,name:"",price:"",items:[],photo:""});
  const startEdit=c=>setEdit({id:c.id,name:c.name,price:c.price,items:c.items.map(it=>({...it})),photo:c.photo||""});

  const addItem=()=>{
    if(!products.length)return;
    setEdit(prev=>({...prev,items:[...prev.items,{productId:products[0].id,qty:1}]}));
  };
  const updateItem=(idx,field,val)=>setEdit(prev=>({...prev,items:prev.items.map((it,i)=>i===idx?{...it,[field]:val}:it)}));
  const removeItem=idx=>setEdit(prev=>({...prev,items:prev.items.filter((_,i)=>i!==idx)}));

  const handlePhoto=e=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setEdit(prev=>({...prev,photo:url})));
  };

  const save=async()=>{
    if(!edit.name||!edit.price||edit.items.length===0)return;
    setBusy(true);
    const id=edit.id||uid();
    const up=await uploadPhotoGeneric(caisseUrl,"uploadComboPhotoChunk",id,edit.photo);
    if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error);setBusy(false);return;}
    const extra=up.photoChunks?{photoChunks:up.photoChunks}:{};
    const itemsStr=edit.items.map(it=>it.productId+":"+it.qty).join(",");
    const r=await apiWrite(caisseUrl,{action:"saveCombo",id,name:edit.name,price:+edit.price,items:itemsStr,photo:up.photoParam,...extra});
    if(r.ok){
      const newEntry={id,name:edit.name,price:+edit.price,items:edit.items.map(it=>({productId:it.productId,qty:+it.qty})),
        photo:up.photoParam==="__CHUNKED__"?edit.photo:up.photoParam};
      setCombos(prev=>[...prev.filter(c=>c.id!==id),newEntry]);
      setEdit(null);
    }
    setBusy(false);
  };

  const del=async id=>{
    if(!window.confirm("Supprimer ce menu ?"))return;
    setCombos(prev=>prev.filter(c=>c.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteCombo",id});
  };

  const prodName=pid=>products.find(p=>p.id.toString()===pid.toString())?.name||"(produit supprimé)";

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <button onClick={startNew} style={{width:"100%",padding:"12px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,marginBottom:14}}>
      + Nouveau menu
    </button>
    {combos.map(c=>(
      <div key={c.id} style={{background:T.card,borderRadius:10,padding:"11px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
        {c.photo?<img src={c.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:26,flexShrink:0}}>🍽</span>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:T.dark}}>{c.name}</div>
          <div style={{fontSize:11,color:T.mid,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {fmt(c.price)} • {c.items.map(it=>it.qty+"× "+prodName(it.productId)).join(", ")}
          </div>
        </div>
        <button onClick={()=>startEdit(c)} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
        <button onClick={()=>del(c.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
      </div>
    ))}

    {edit&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>{edit.id?"✏️ Modifier le menu":"+ Nouveau menu"}</div>
        <input placeholder="Nom (ex: Menu Croque)" value={edit.name} onChange={e=>setEdit({...edit,name:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <input placeholder="Prix du menu" type="number" step="0.50" value={edit.price} onChange={e=>setEdit({...edit,price:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>

        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Photo du menu</label>
        {edit.photo&&<img src={edit.photo} style={{width:50,height:50,borderRadius:8,objectFit:"cover",marginBottom:6,display:"block"}}/>}
        <input type="file" accept="image/*" onChange={handlePhoto} style={{fontSize:12,color:T.mid,marginBottom:12}}/>

        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:6}}>Produits inclus</label>
        {edit.items.map((it,idx)=>(
          <div key={idx} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
            <select value={it.productId} onChange={e=>updateItem(idx,"productId",e.target.value)}
              style={{flex:1,padding:"8px",border:`1px solid ${T.border}`,borderRadius:7,fontSize:12}}>
              {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <input type="number" min="1" value={it.qty} onChange={e=>updateItem(idx,"qty",e.target.value)}
              style={{width:50,padding:"8px",border:`1px solid ${T.border}`,borderRadius:7,fontSize:12,textAlign:"center"}}/>
            <button onClick={()=>removeItem(idx)} style={{padding:"7px 9px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
          </div>
        ))}
        <button onClick={addItem} style={{width:"100%",padding:"9px",background:T.bg,border:`1px dashed ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:T.dark,marginBottom:14}}>
          + Ajouter un produit au menu
        </button>

        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEdit(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={save} disabled={busy||!edit.name||!edit.price||edit.items.length===0}
            style={{flex:2,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:busy?"default":"pointer",fontWeight:700}}>
            {busy?"⏳ Envoi...":"💾 Enregistrer"}
          </button>
        </div>
      </div>
    </div>}
  </div>);
}

function StockList({products,sites,siteId,setSiteId,caisseUrl,onSave}){
  const stockC=v=>v===0?"#FF3B30":v<=5?T.orange:v<=10?"#EAB308":T.green;
  const updateQty=async(prod,site,newQty)=>{
    const upd=products.map(p=>p.id!==prod.id?p:{...p,stock:{...p.stock,[site]:Math.max(0,newQty)}});
    onSave(upd);if(caisseUrl)await apiWrite(caisseUrl,{action:"updateStock",id:prod.id,site,qty:Math.max(0,newQty),mode:"set"});
  };
  const cats=[...new Set(products.map(p=>p.cat))];
  return(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{padding:"10px 14px",background:T.card,borderBottom:`1px solid ${T.border}`,display:"flex",gap:7,overflowX:"auto",flexShrink:0}}>
      {sites.map(s=><button key={s.id} onClick={()=>setSiteId(s.id)} style={{flexShrink:0,padding:"7px 14px",borderRadius:20,
        border:`2px solid ${siteId===s.id?s.color:T.border}`,background:siteId===s.id?s.color:T.card,
        color:siteId===s.id?"white":T.dark,fontWeight:600,fontSize:12,cursor:"pointer"}}>{s.name}</button>)}
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>
      {products.filter(p=>(p.stock[siteId]||0)<=5).length>0&&<div style={{background:"#FFF3E0",border:`1px solid ${T.orange}`,borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:13}}>
        ⚠️ {products.filter(p=>(p.stock[siteId]||0)<=5).length} produit(s) en stock faible
      </div>}
      {cats.map(cat=><div key={cat} style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:T.mid,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{cat}</div>
        <div style={{background:T.card,borderRadius:12,border:`1px solid ${T.border}`,overflow:"hidden"}}>
          {products.filter(p=>p.cat===cat).map((prod,idx,arr)=>{
            const stk=prod.stock[siteId]||0;
            return(<div key={prod.id} style={{display:"flex",alignItems:"center",padding:"11px 14px",borderBottom:idx<arr.length-1?`1px solid ${T.border}`:"none",gap:10}}>
              {prod.photo?<img src={prod.photo} style={{width:28,height:28,borderRadius:6,objectFit:"cover",flexShrink:0}}/>
                :<span style={{fontSize:22,flexShrink:0}}>{prod.emoji}</span>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{prod.name}</div>
                <div style={{fontSize:11,color:T.mid}}>{fmt(prod.price)}{prod.sellByVolume?" • au "+prod.unit:""}</div>
              </div>
              <div style={{display:"flex",gap:3,marginRight:6}}>
                {sites.map(s=><div key={s.id} title={s.name} style={{width:24,height:24,borderRadius:5,
                  background:s.id===siteId?s.color:"rgba(0,0,0,0.06)",
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,
                  color:s.id===siteId?"white":T.mid}}>{prod.stock[s.id]||0}</div>)}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <button onClick={()=>updateQty(prod,siteId,stk-1)} style={{width:24,height:24,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:14}}>−</button>
                <span style={{fontSize:14,fontWeight:800,minWidth:28,textAlign:"center",color:stockC(stk)}}>{stk}</span>
                <button onClick={()=>updateQty(prod,siteId,stk+1)} style={{width:24,height:24,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.bg,cursor:"pointer",fontSize:14}}>+</button>
              </div>
            </div>);
          })}
        </div>
      </div>)}
    </div>
  </div>);
}

function StockEntry({products,sites,caisseUrl,onSave}){
  const videoRef=useRef(null);const readerRef=useRef(null);
  const [scannedProd,setScannedProd]=useState(null);
  const [site,setSite]=useState(sites[0]?.id||"s1");
  const [qty,setQty]=useState("");const [msg,setMsg]=useState("");const [scanning,setScanning]=useState(false);
  const [contCounts,setContCounts]=useState({}); // label -> nombre de contenants reçus

  useEffect(()=>{if(scanning)startCam();return()=>stopCam();},[scanning]);
  const startCam=async()=>{
    // ZXing plutôt que l'API BarcodeDetector native, absente sur iPhone/iPad (Safari)
    // et peu fiable sur beaucoup d'Android — cause du scan qui s'ouvrait sans jamais détecter.
    if(!window.ZXing){setMsg("Caméra non disponible sur cet appareil — utilisez la liste ci-dessous");return;}
    try{
      const hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]);
      const reader=new ZXing.BrowserMultiFormatReader(hints);
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        {video:{facingMode:"environment"}}, videoRef.current,
        (result)=>{
          if(!result)return;
          stopCam();setScanning(false);
          const code=result.getText();
          const p=products.find(pr=>pr.barcode&&pr.barcode.toString()===code.trim());
          if(p){setScannedProd(p);setContCounts({});}else setMsg("⚠ Produit non trouvé: "+code);
        }
      );
    }catch{setMsg("Caméra non disponible");}
  };
  const stopCam=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };

  const validate=async()=>{
    if(!scannedProd||!qty)return;
    const newQty=(scannedProd.stock[site]||0)+(+qty);
    const upd=products.map(p=>p.id!==scannedProd.id?p:{...p,stock:{...p.stock,[site]:newQty}});
    onSave(upd);
    if(caisseUrl)await apiWrite(caisseUrl,{action:"updateStock",id:scannedProd.id,site,qty:+qty,mode:"delta"});
    setMsg(`✅ +${qty} ${scannedProd.name} sur ${sites.find(s=>s.id===site)?.name}`);
    setScannedProd(null);setQty("");setContCounts({});
    setTimeout(()=>setMsg(""),3000);
  };

  return(<div style={{flex:1,overflowY:"auto",padding:"14px"}}>
    <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:14}}>📥 Entrée rapide de stock</div>
    {/* Scan */}
    {scanning?(<div style={{marginBottom:14}}>
      <video ref={videoRef} style={{width:"100%",height:180,objectFit:"cover",borderRadius:12,background:"#000"}} muted playsInline/>
      <button onClick={()=>{stopCam();setScanning(false);}} style={{width:"100%",marginTop:6,padding:"8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:13}}>Annuler</button>
    </div>):(
      <button onClick={()=>setScanning(true)} style={{width:"100%",padding:"14px",background:T.dark,color:"white",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:14,marginBottom:10}}>
        📷 Scanner le code-barres produit
      </button>
    )}
    {!scanning&&<>
      <div style={{fontSize:12,color:T.mid,textAlign:"center",margin:"6px 0 10px"}}>— ou choisir dans la liste —</div>
      <select value="" onChange={e=>{const p=products.find(pr=>pr.id.toString()===e.target.value);if(p){setScannedProd(p);setMsg("");setContCounts({});}}}
        style={{width:"100%",padding:"12px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:14,marginBottom:14,outline:"none",color:T.dark}}>
        <option value="" disabled>Sélectionner un produit…</option>
        {products.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
      </select>
    </>}
    {msg&&<div style={{background:msg.startsWith("✅")?"#E8F5E9":"#FFF3E0",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:14,fontWeight:600,color:msg.startsWith("✅")?"#2E7D32":T.orange}}>{msg}</div>}
    {/* Produit trouvé */}
    {scannedProd&&<div style={{background:T.card,borderRadius:14,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <span style={{fontSize:30}}>{scannedProd.emoji}</span>
        <div><div style={{fontWeight:700,fontSize:15,color:T.dark}}>{scannedProd.name}</div>
          <div style={{fontSize:12,color:T.mid}}>{fmt(scannedProd.price)}</div></div>
      </div>
      <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Site de destination</label>
      <select value={site} onChange={e=>setSite(e.target.value)} style={{width:"100%",padding:"11px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:14,marginBottom:12,outline:"none"}}>
        {sites.map(s=><option key={s.id} value={s.id}>{s.name} (stock actuel: {scannedProd.stock[s.id]||0})</option>)}
      </select>
      {scannedProd.sellByVolume&&parseContainers(scannedProd.containers).length>0&&(()=>{
        const presets=parseContainers(scannedProd.containers);
        const total=presets.reduce((s,c)=>s+(parseInt(contCounts[c.label])||0)*c.size,0);
        return(<div style={{marginBottom:12}}>
          <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Contenants reçus (calcule automatiquement les cl)</label>
          <div style={{border:`1px solid ${T.border}`,borderRadius:10,overflow:"hidden",marginBottom:8}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 70px 70px",background:T.bg,padding:"6px 10px",fontSize:11,fontWeight:700,color:T.mid}}>
              <span>Contenant</span><span style={{textAlign:"center"}}>Nombre</span><span style={{textAlign:"right"}}>= cl</span>
            </div>
            {presets.map((c,i)=>(<div key={i} style={{display:"grid",gridTemplateColumns:"1fr 70px 70px",alignItems:"center",padding:"7px 10px",borderTop:`1px solid ${T.border}`}}>
              <span style={{fontSize:13,color:T.dark}}>{c.label} <span style={{color:T.mid,fontSize:11}}>({c.size}cl)</span></span>
              <input type="number" min="0" value={contCounts[c.label]||""} onChange={e=>setContCounts({...contCounts,[c.label]:e.target.value})}
                style={{width:"100%",padding:"5px",border:`1px solid ${T.border}`,borderRadius:6,textAlign:"center",fontSize:13}}/>
              <span style={{textAlign:"right",fontSize:13,fontWeight:600,color:T.dark}}>{(parseInt(contCounts[c.label])||0)*c.size}</span>
            </div>))}
          </div>
          <button disabled={total<=0} onClick={()=>{setQty(String(total));}}
            style={{width:"100%",padding:"10px",background:total>0?T.blue:"#ccc",color:"white",border:"none",borderRadius:9,cursor:total>0?"pointer":"default",fontWeight:700,fontSize:13}}>
            Utiliser ce total : {total}cl
          </button>
        </div>);
      })()}
      <label style={{fontSize:13,fontWeight:600,color:T.dark,display:"block",marginBottom:6}}>Quantité reçue{scannedProd.sellByVolume?" (cl, ou via le tableau ci-dessus)":""}</label>
      <input value={qty} onChange={e=>setQty(e.target.value)} type="number" min="1" placeholder="Ex: 24"
        style={{width:"100%",padding:"14px",fontSize:20,fontWeight:700,border:`2px solid ${T.border}`,borderRadius:10,marginBottom:12,outline:"none",textAlign:"right"}}/>
      <button onClick={validate} disabled={!qty} style={{width:"100%",padding:"14px",background:qty?T.green:"#ccc",color:"white",border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:15}}>
        ✓ Valider l'entrée
      </button>
    </div>}
  </div>);
}

function StockTransfer({products,sites,caisseUrl,onSave}){
  const [from,setFrom]=useState(sites[0]?.id||"s1");
  const [to,setTo]=useState(sites[1]?.id||"s2");
  const [qtys,setQtys]=useState({});
  const [msg,setMsg]=useState("");

  const transfer=async()=>{
    const items=Object.entries(qtys).filter(([_,q])=>+q>0).map(([id,q])=>({id,qty:+q}));
    if(!items.length)return;
    const upd=products.map(p=>{const q=+qtys[p.id]||0;if(!q)return p;
      return{...p,stock:{...p.stock,[from]:Math.max(0,(p.stock[from]||0)-q),[to]:(p.stock[to]||0)+q}};});
    onSave(upd);
    if(caisseUrl)await apiWrite(caisseUrl,{action:"transferStock",from,to,items:JSON.stringify(items)});
    setMsg(`✅ Transfert effectué: ${items.length} produit(s) de ${sites.find(s=>s.id===from)?.name} vers ${sites.find(s=>s.id===to)?.name}`);
    setQtys({});setTimeout(()=>setMsg(""),4000);
  };

  return(<div style={{flex:1,overflowY:"auto",padding:"14px"}}>
    <div style={{fontWeight:700,fontSize:16,color:T.dark,marginBottom:14}}>↔ Transfert multi-produits</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      {[["De (source)",from,setFrom],["Vers (dest.)",to,setTo]].map(([label,val,setter],i)=>(
        <div key={i}>
          <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:5}}>{label}</label>
          <select value={val} onChange={e=>setter(e.target.value)} style={{width:"100%",padding:"10px",border:`1px solid ${T.border}`,borderRadius:10,fontSize:13,outline:"none"}}>
            {sites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
      ))}
    </div>
    {msg&&<div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:13,fontWeight:600,color:"#2E7D32"}}>{msg}</div>}
    <div style={{fontWeight:700,fontSize:13,color:T.mid,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Quantités à transférer</div>
    {products.map(p=>{
      const avail=p.stock[from]||0;if(avail===0)return null;
      return(<div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:T.card,borderRadius:10,border:`1px solid ${T.border}`,marginBottom:7}}>
        <span style={{fontSize:22,flexShrink:0}}>{p.emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
          <div style={{fontSize:11,color:T.mid}}>Dispo: {avail}</div>
        </div>
        <input value={qtys[p.id]||""} onChange={e=>setQtys(q=>({...q,[p.id]:Math.min(avail,Math.max(0,+e.target.value||0))}))}
          type="number" min="0" max={avail} placeholder="0"
          style={{width:60,padding:"7px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:14,fontWeight:700,textAlign:"center",outline:"none"}}/>
      </div>);
    })}
    <button onClick={transfer} disabled={!Object.values(qtys).some(q=>+q>0)}
      style={{width:"100%",padding:"14px",background:Object.values(qtys).some(q=>+q>0)?T.red:"#ccc",color:"white",
        border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:15,marginTop:6}}>
      ↔ Effectuer le transfert
    </button>
  </div>);
}

function ReportsScreen({sites,caisseUrl}){
  const [sales,setSales]=useState([]);const [loading,setLoading]=useState(false);const [period,setPeriod]=useState("today");
  const pad2=n=>String(n).padStart(2,"0");
  const todayD=new Date();
  const today=`${pad2(todayD.getDate())}/${pad2(todayD.getMonth()+1)}/${todayD.getFullYear()}`;
  useEffect(()=>{loadSales();},[]);
  const loadSales=async()=>{if(!caisseUrl)return;setLoading(true);
    const r=await api(caisseUrl,{action:"getSales"});if(r.ok)setSales(r.sales||[]);setLoading(false);};
  const filtered=sales.filter(s=>period==="today"?s.date===today:true);
  const totalCA=filtered.reduce((a,s)=>a+(+s.total||0),0);
  const bySite=sites.map(s=>({...s,ca:filtered.filter(v=>v.siteId===s.id).reduce((a,v)=>a+(+v.total||0),0),nb:filtered.filter(v=>v.siteId===s.id).length}));
  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
      <div style={{display:"flex",gap:7}}>
        {[["today","Aujourd'hui"],["all","Tout"]].map(([v,l])=>(
          <button key={v} onClick={()=>setPeriod(v)} style={{padding:"6px 14px",borderRadius:20,border:"none",
            background:period===v?T.red:T.card,color:period===v?"white":T.dark,fontSize:12,fontWeight:600,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
            {l}
          </button>
        ))}
      </div>
      <button onClick={loadSales} style={{padding:"6px 12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>{loading?"⏳":"↻"}</button>
    </div>
    {!caisseUrl&&<div style={{background:"#FFF3E0",borderRadius:10,padding:14,fontSize:13,marginBottom:12}}>⚙️ Configurez l'URL Apps Script dans Config.</div>}
    <div style={{background:T.red,borderRadius:14,padding:"18px 16px",marginBottom:14,color:"white"}}>
      <div style={{fontSize:11,opacity:.75,marginBottom:2}}>CHIFFRE D'AFFAIRES</div>
      <div style={{fontSize:36,fontWeight:900}}>{fmt(totalCA)}</div>
      <div style={{fontSize:12,opacity:.65}}>{filtered.length} vente(s)</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
      {bySite.map(s=><div key={s.id} style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:s.color,display:"inline-block"}}/>
          <span style={{fontSize:11,fontWeight:600,color:T.mid}}>{s.name}</span>
        </div>
        <div style={{fontSize:20,fontWeight:800,color:T.dark}}>{fmt(s.ca)}</div>
        <div style={{fontSize:11,color:T.mid}}>{s.nb} vente(s)</div>
      </div>)}
    </div>
    {filtered.slice(0,15).map(tx=>{
      let payType=null; try{payType=JSON.parse(tx.payment||"{}").type;}catch{}
      const isMatchOffert=payType==="matchOffert";
      return(<div key={tx.id} style={{background:isMatchOffert?"#E8F5E9":T.card,borderRadius:10,padding:"10px 14px",marginBottom:6,border:`1px solid ${isMatchOffert?"#A5D6A7":T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{fontSize:13,fontWeight:600,color:T.dark}}>{tx.time} • {sites.find(s=>s.id===tx.siteId)?.name||tx.siteId}</div>
        <div style={{fontSize:11,color:T.mid}}>{tx.caissier&&"👤 "+tx.caissier}{tx.member&&" • 🍺 "+tx.member}{isMatchOffert&&" • ⚽ Offert match"}</div></div>
      <div style={{fontWeight:800,color:isMatchOffert?T.green:T.red,fontSize:15}}>{isMatchOffert?"Offert":fmt(+tx.total)}</div>
    </div>);})}
  </div>);
}

function ProdForm({data,setData,onSubmit,label,categories,handlePhoto,onManagePortions,onManageAccompaniments}){
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};
  const videoRef=useRef(null);const readerRef=useRef(null);
  const [scanningBarcode,setScanningBarcode]=useState(false);
  const [scanMsg,setScanMsg]=useState("");

  useEffect(()=>{ if(scanningBarcode)startBarcodeScan(); return()=>stopBarcodeScan(); },[scanningBarcode]);
  const startBarcodeScan=async()=>{
    // Même moteur (ZXing) que le scanner de l'écran caisse : BarcodeDetector natif
    // n'existe pas sur iPhone/iPad (Safari) et est peu fiable sur beaucoup d'Android.
    if(!window.ZXing){setScanMsg("Caméra non disponible sur cet appareil");return;}
    try{
      const hints=new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39]);
      const reader=new ZXing.BrowserMultiFormatReader(hints);
      readerRef.current=reader;
      await reader.decodeFromConstraints(
        {video:{facingMode:"environment"}}, videoRef.current,
        (result)=>{
          if(!result)return;
          stopBarcodeScan();setScanningBarcode(false);
          setData(prev=>({...prev,barcode:result.getText().trim()}));
        }
      );
    }catch{setScanMsg("Caméra non disponible");}
  };
  const stopBarcodeScan=()=>{ if(readerRef.current){try{readerRef.current.reset();}catch{} readerRef.current=null;} };

  return(
    <div style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`,marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>{label}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        <input style={inp} placeholder="Nom" value={data.name} onChange={e=>setData({...data,name:e.target.value})}/>
        <input style={inp} placeholder="Prix de vente" type="number" step="0.50" value={data.price} onChange={e=>setData({...data,price:e.target.value})}/>
        <input style={inp} placeholder="Prix d'achat TTC" type="number" step="0.01" value={data.costPrice||""} onChange={e=>setData({...data,costPrice:e.target.value})}/>
        <input style={inp} placeholder="Emoji" value={data.emoji} onChange={e=>setData({...data,emoji:e.target.value})}/>
        <div style={{gridColumn:"1 / -1",display:"flex",gap:7,marginBottom:7}}>
          <input style={{...inp,marginBottom:0,flex:1}} placeholder="Code-barres EAN" value={data.barcode||""} onChange={e=>setData({...data,barcode:e.target.value})}/>
          <button type="button" onClick={()=>{setScanMsg("");setScanningBarcode(s=>!s);}}
            style={{padding:"0 14px",background:scanningBarcode?T.red:T.dark,color:"white",border:"none",borderRadius:8,cursor:"pointer",fontSize:16,flexShrink:0}}>
            {scanningBarcode?"✕":"📷"}
          </button>
        </div>
      </div>
      {scanningBarcode&&<div style={{marginBottom:10}}>
        <video ref={videoRef} style={{width:"100%",height:160,objectFit:"cover",borderRadius:10,background:"#000"}} muted playsInline/>
        <div style={{fontSize:11,color:T.mid,textAlign:"center",marginTop:4}}>Pointez sur le code-barres du produit</div>
        {scanMsg&&<div style={{fontSize:11,color:T.red,textAlign:"center",marginTop:2}}>{scanMsg}</div>}
      </div>}
      {data.id?
        <button type="button" onClick={()=>onManageAccompaniments&&onManageAccompaniments(data)} style={{width:"100%",padding:"10px",background:"#6B4F3A",color:"white",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13,marginBottom:9}}>
          🔗 Gérer les accompagnements (gobelet, sucre, touillette…)
        </button>
        :<div style={{fontSize:11,color:T.mid,marginBottom:9,fontStyle:"italic"}}>Enregistrez d'abord le produit, puis modifiez-le pour lui associer des accompagnements automatiques.</div>}
      {data.price&&data.costPrice?(()=>{
        const margeUnit=+data.price-+data.costPrice, margePct=+data.costPrice>0?(margeUnit/+data.costPrice*100):0;
        return(<div style={{background:margeUnit>=0?"#E8F5E9":"#FFEBEE",borderRadius:8,padding:"7px 10px",marginBottom:7,
          fontSize:12,color:margeUnit>=0?"#2E7D32":T.red,fontWeight:600,display:"flex",justifyContent:"space-between"}}>
          <span>Marge unitaire</span><span>{fmt(margeUnit)} ({margePct.toFixed(0)}%)</span>
        </div>);
      })():null}
      <select value={data.cat} onChange={e=>setData({...data,cat:e.target.value})} style={{...inp}}>
        {categories.map(c=><option key={c.id}>{c.name}</option>)}
      </select>
      {/* Photo */}
      <div style={{marginBottom:7}}>

      </div>
      <div style={{display:"flex",gap:14,marginBottom:8}}>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
          <input type="checkbox" checked={!!data.drink} onChange={e=>setData({...data,drink:e.target.checked})}/> 🍺 Carte Boissons
        </label>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
          <input type="checkbox" checked={!!data.sellByVolume} onChange={e=>setData({...data,sellByVolume:e.target.checked})}/> Vente au verre/volume

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>

        {data.id?
          <button type="button" onClick={()=>onManagePortions&&onManagePortions(data)} style={{width:"100%",padding:"10px",background:T.blue,color:"white",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13,marginBottom:9}}>
            🍺 Gérer les portions de vente (demis, pichets, photos…)

        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>
          Tailles de contenant (Nom:taille en cl, séparés par virgule)

        <input style={inp} placeholder="Ex: Fût 20L:2000,Fût 30L:3000" value={data.containers||""} onChange={e=>setData({...data,containers:e.target.value})}/>
        <div style={{fontSize:11,color:T.mid,marginTop:-3,marginBottom:7}}>
          Ex pour le vin : Bouteille 75cl:75,Cubi 3L:300,Cubi 5L:500. Sert à l'écran "🧴 Contenants" (jauge du fût/bouteille/cubi actuellement entamé). Laissez vide si non concerné.
        </div>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>
          Couleur de la jauge (contenant)
        </label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
          <input type="color" value={data.color||"#FF9F0A"} onChange={e=>setData({...data,color:e.target.value})}
            style={{width:44,height:32,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",padding:0,background:"none"}}/>
          <span style={{fontSize:11,color:T.mid}}>Ex : bière → jaune, café → marron, vin rouge → bordeaux…</span>
        </div>
      </>}
      <button onClick={onSubmit} style={{width:"100%",padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>
        {label.startsWith("+")?label:"💾 Enregistrer"}
      </button>
    </div>
  );
}

function ProductsAdmin({products,categories,sites,onSave,caisseUrl,portions,setPortions,accompaniments,setAccompaniments}){
  const [edit,setEdit]=useState(null);
  const [newP,setNewP]=useState({name:"",price:"",costPrice:"",cat:categories[0]?.name||"Boissons",emoji:"🏷",photo:"",barcode:"",drink:false,sellByVolume:false,unit:"",baseQty:1,presets:"",containers:"",color:"#FF9F0A"});
  const [portionsFor,setPortionsFor]=useState(null); // produit dont on gère les portions
  const [accompFor,setAccompFor]=useState(null); // produit dont on gère les accompagnements
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};

  const handlePhoto=(e,setter)=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setter(prev=>({...prev,photo:url})));
  };
  const uploadPhotoIfNeeded=(id,photoDataUrl)=>uploadPhotoGeneric(caisseUrl,"uploadPhotoChunk",id,photoDataUrl);

  const addProd=async()=>{if(!newP.name||!newP.price)return;
    const id=uid();const stock=Object.fromEntries(sites.map(s=>[s.id,0]));
    const p={...newP,id,price:+newP.price,costPrice:+newP.costPrice||0,drink:!!newP.drink,sellByVolume:!!newP.sellByVolume,baseQty:+newP.baseQty||1,stock};
    const arr=[...products,p];onSave(arr);
    if(caisseUrl){
      const up=await uploadPhotoIfNeeded(id,p.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error+"\n\nLe produit a été enregistré sans photo pour l'instant, réessayez d'ajouter la photo ensuite.");}
      const extra=up.ok&&up.photoChunks?{photoChunks:up.photoChunks}:{};
      await apiWrite(caisseUrl,{action:"saveProduct",id,...flattenProd(p,sites),photo:up.ok?up.photoParam:"",...extra});
    }
    setNewP({name:"",price:"",costPrice:"",cat:categories[0]?.name||"Boissons",emoji:"🏷",photo:"",barcode:"",drink:false,sellByVolume:false,unit:"",baseQty:1,presets:"",containers:"",color:"#FF9F0A"});
  };
  const saveEdit=async()=>{const arr=products.map(p=>p.id===edit.id?edit:p);onSave(arr);
    if(caisseUrl){
      const up=await uploadPhotoIfNeeded(edit.id,edit.photo);
      if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error+"\n\nLes autres modifications ont été enregistrées, réessayez d'ajouter la photo ensuite.");}
      const extra=up.ok&&up.photoChunks?{photoChunks:up.photoChunks}:{};
      await apiWrite(caisseUrl,{action:"saveProduct",id:edit.id,...flattenProd(edit,sites),photo:up.ok?up.photoParam:edit.photo?"__CHUNKED__":"",...extra});
    }
    setEdit(null);};
  const delProd=async(id)=>{if(!window.confirm("Supprimer ?"))return;onSave(products.filter(p=>p.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteProduct",id});};
  const flattenProd=(p,sites)=>({name:p.name,price:p.price,costPrice:p.costPrice||0,cat:p.cat,emoji:p.emoji,photo:p.photo||"",barcode:p.barcode||"",
    drink:p.drink,sellByVolume:p.sellByVolume,unit:p.unit||"",baseQty:p.baseQty||1,presets:p.presets||"",containers:p.containers||"",color:p.color||"",...Object.fromEntries(sites.map(s=>["stock_"+s.id,p.stock[s.id]||0]))});

  const totalStockValue=products.reduce((s,p)=>s+(p.costPrice||0)*Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0),0);
  const totalPotentialMargin=products.reduce((s,p)=>s+((p.price||0)-(p.costPrice||0))*Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0),0);

  return(<div style={{height:"100%",overflowY:"auto",padding:"12px 14px"}}>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <div style={{flex:1,background:T.dark,borderRadius:12,padding:"12px 14px",color:"white"}}>
        <div style={{fontSize:11,opacity:.7}}>💰 Valeur du stock (achat)</div>
        <div style={{fontSize:18,fontWeight:900}}>{fmt(totalStockValue)}</div>
      </div>
      <div style={{flex:1,background:T.green,borderRadius:12,padding:"12px 14px",color:"white"}}>
        <div style={{fontSize:11,opacity:.85}}>📈 Marge potentielle</div>
        <div style={{fontSize:18,fontWeight:900}}>{fmt(totalPotentialMargin)}</div>
      </div>
    </div>
    <ProdForm data={newP} setData={setNewP} onSubmit={addProd} label="+ Nouveau produit" categories={categories} handlePhoto={handlePhoto}/>
    {products.map(p=>{
      const margeUnit=(p.price||0)-(p.costPrice||0);
      const margePct=p.costPrice>0?(margeUnit/p.costPrice*100):null;
      const stockTotal=Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0);
      return(<div key={p.id} style={{background:T.card,borderRadius:10,padding:"11px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
      {p.photo?<img src={p.photo} style={{width:32,height:32,borderRadius:7,objectFit:"cover",flexShrink:0}}/>
        :<span style={{fontSize:24,flexShrink:0}}>{p.emoji}</span>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:600,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
        <div style={{fontSize:11,color:T.mid}}>{p.cat} • {fmt(p.price)}{p.drink?" • 🍺":""}{p.sellByVolume?" • au "+p.unit:""}</div>
        {p.costPrice>0&&<div style={{fontSize:10,color:margeUnit>=0?"#2E7D32":T.red,fontWeight:600,marginTop:1}}>
          Achat {fmt(p.costPrice)} • Marge {fmt(margeUnit)}{margePct!=null?` (${margePct.toFixed(0)}%)`:""} • Stock: {fmt(p.costPrice*stockTotal)}
        </div>}
      </div>
      <button onClick={()=>setEdit({...p})} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
      <button onClick={()=>delProd(p.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
    </div>);})}
    {edit&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>✏️ Modifier {edit.name}</div>
        <ProdForm data={edit} setData={setEdit} onSubmit={saveEdit} label="💾 Enregistrer" categories={categories} handlePhoto={handlePhoto} onManagePortions={p=>setPortionsFor(p)} onManageAccompaniments={p=>setAccompFor(p)}/>
        <button onClick={()=>setEdit(null)} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600,marginTop:6}}>Annuler</button>
      </div>
    </div>}
    {portionsFor&&<PortionsManager product={portionsFor} portions={portions} setPortions={setPortions} caisseUrl={caisseUrl} onClose={()=>setPortionsFor(null)}/>}
    {accompFor&&<AccompanimentsManager product={accompFor} products={products} accompaniments={accompaniments} setAccompaniments={setAccompaniments} caisseUrl={caisseUrl} onClose={()=>setAccompFor(null)}/>}
  </div>);
}

// ═══ GESTION DES PORTIONS DE VENTE (demis, pichets, tailles de gobelet...) ═══
// ═══ GESTION DES ACCOMPAGNEMENTS AUTOMATIQUES (gobelet, sucre, touillette...) ═══
// Décomptés discrètement en plus du produit vendu — pas de ligne de panier, pas
// d'impact sur le prix. Ex: café -> gobelet, sucre, touillette (ou juste gobelet
// pour un autre produit).
function AccompanimentsManager({product,products,accompaniments,setAccompaniments,caisseUrl,onClose}){
  const mine=accompaniments.filter(a=>a.productId.toString()===product.id.toString());
  const otherProducts=products.filter(p=>p.id.toString()!==product.id.toString());
  const [assocId,setAssocId]=useState(otherProducts[0]?.id||"");
  const [qty,setQty]=useState(1);
  const [busy,setBusy]=useState(false);

  const add=async()=>{
    if(!assocId)return;
    setBusy(true);
    const id=uid();
    const r=await apiWrite(caisseUrl,{action:"saveAccompaniment",id,productId:product.id,assocId,qty:+qty||1});
    if(r.ok){
      setAccompaniments(prev=>[...prev,{id,productId:product.id,assocId,qty:+qty||1}]);
      setQty(1);
    }
    setBusy(false);
  };
  const del=async id=>{
    setAccompaniments(prev=>prev.filter(a=>a.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteAccompaniment",id});
  };
  const prodName=pid=>products.find(p=>p.id.toString()===pid.toString())?.name||"(produit supprimé)";
  const prodEmoji=pid=>products.find(p=>p.id.toString()===pid.toString())?.emoji||"🏷";

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>🔗 Accompagnements — {product.name}</div>
      <div style={{fontSize:12,color:T.mid,marginBottom:14}}>Décomptés automatiquement à chaque vente de "{product.name}", sans ligne de panier ni impact sur le prix.</div>

      {mine.length===0&&<div style={{fontSize:12,color:T.mid,fontStyle:"italic",marginBottom:10}}>Aucun accompagnement configuré.</div>}
      {mine.map(a=>(
        <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,background:T.bg,borderRadius:10,padding:"9px 12px",marginBottom:7}}>
          <span style={{fontSize:20}}>{prodEmoji(a.assocId)}</span>
          <div style={{flex:1,fontSize:13,color:T.dark}}>{a.qty}× {prodName(a.assocId)}</div>
          <button onClick={()=>del(a.id)} style={{padding:"6px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
        </div>
      ))}

      <div style={{background:T.bg,borderRadius:12,padding:14,marginTop:10}}>
        <div style={{fontWeight:700,fontSize:13,color:T.dark,marginBottom:8}}>+ Ajouter un accompagnement</div>
        <div style={{display:"flex",gap:7,marginBottom:9}}>
          <select value={assocId} onChange={e=>setAssocId(e.target.value)}
            style={{flex:1,padding:"9px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}>
            {otherProducts.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <input type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)}
            style={{width:60,padding:"9px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,textAlign:"center"}}/>
        </div>
        <button onClick={add} disabled={busy||!assocId} style={{width:"100%",padding:"10px",background:"#6B4F3A",color:"white",border:"none",borderRadius:9,cursor:busy?"default":"pointer",fontWeight:700,fontSize:13}}>
          {busy?"⏳...":"+ Ajouter"}
        </button>
      </div>

      <button onClick={onClose} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600,marginTop:14}}>Fermer</button>
    </div>
  </div>);
}

function PortionsManager({product,portions,setPortions,caisseUrl,onClose}){
  const myPortions=portions.filter(po=>po.productId.toString()===product.id.toString());
  const [form,setForm]=useState({name:"",size:"",price:"",photo:""});
  const [editingId,setEditingId]=useState(null);
  const [busy,setBusy]=useState(false);

  const handlePortionPhoto=e=>{const f=e.target.files[0];if(!f)return;
    resizePhotoFile(f).then(url=>setForm(prev=>({...prev,photo:url})));
  };

  const startEdit=po=>{setEditingId(po.id);setForm({name:po.name,size:po.size,price:po.price,photo:po.photo||""});};
  const resetForm=()=>{setEditingId(null);setForm({name:"",size:"",price:"",photo:""});};

  const save=async()=>{
    if(!form.name||!form.size||!form.price)return;
    setBusy(true);
    const id=editingId||uid();
    const up=await uploadPhotoGeneric(caisseUrl,"uploadPortionPhotoChunk",id,form.photo);
    if(!up.ok){window.alert("⚠️ Échec de l'envoi de la photo : "+up.error);setBusy(false);return;}
    const extra=up.photoChunks?{photoChunks:up.photoChunks}:{};
    const r=await apiWrite(caisseUrl,{action:"savePortion",id,productId:product.id,name:form.name,size:+form.size,price:+form.price,photo:up.photoParam,...extra});
    if(r.ok){
      const newEntry={id,productId:product.id,name:form.name,size:+form.size,price:+form.price,photo:up.photoParam==="__CHUNKED__"?form.photo:up.photoParam};
      setPortions(prev=>[...prev.filter(po=>po.id!==id),newEntry]);
      resetForm();
    }
    setBusy(false);
  };

  const del=async id=>{
    if(!window.confirm("Supprimer cette portion ?"))return;
    setPortions(prev=>prev.filter(po=>po.id!==id));
    if(caisseUrl)await apiWrite(caisseUrl,{action:"deletePortion",id});
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:210,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
    <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>🍺 Portions — {product.name}</div>
      <div style={{fontSize:12,color:T.mid,marginBottom:14}}>Ex : Demi 25cl, Pichet 1L, Pichet 1,5L — chacune avec sa propre photo.</div>

      {myPortions.map(po=>(
        <div key={po.id} style={{display:"flex",alignItems:"center",gap:10,background:T.bg,borderRadius:10,padding:"9px 12px",marginBottom:7}}>
          {po.photo?<img src={po.photo} style={{width:36,height:36,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<span style={{fontSize:22,flexShrink:0}}>{product.emoji}</span>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:T.dark,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{po.name}</div>
            <div style={{fontSize:11,color:T.mid}}>{po.size}{product.unit||"cl"} • {fmt(po.price)}</div>
          </div>
          <button onClick={()=>startEdit(po)} style={{padding:"6px 9px",background:"white",border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:12}}>✏️</button>
          <button onClick={()=>del(po.id)} style={{padding:"6px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
        </div>
      ))}

      <div style={{background:T.bg,borderRadius:12,padding:14,marginTop:10}}>
        <div style={{fontWeight:700,fontSize:13,color:T.dark,marginBottom:8}}>{editingId?"✏️ Modifier la portion":"+ Nouvelle portion"}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
          <input placeholder="Nom (ex: Demi)" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}
            style={{padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}/>
          <input placeholder={`Taille (${product.unit||"cl"})`} type="number" value={form.size} onChange={e=>setForm({...form,size:e.target.value})}
            style={{padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13}}/>
        </div>
        <input placeholder="Prix" type="number" step="0.50" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}
          style={{width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,marginBottom:7}}/>
        <label style={{fontSize:12,fontWeight:600,color:T.mid,display:"block",marginBottom:4}}>Photo de cette portion</label>
        {form.photo&&<img src={form.photo} style={{width:50,height:50,borderRadius:8,objectFit:"cover",marginBottom:6,display:"block"}}/>}
        <input type="file" accept="image/*" onChange={handlePortionPhoto} style={{fontSize:12,color:T.mid,marginBottom:9}}/>
        <div style={{display:"flex",gap:8}}>
          {editingId&&<button onClick={resetForm} style={{flex:1,padding:"10px",background:"white",border:`1px solid ${T.border}`,borderRadius:9,cursor:"pointer",fontWeight:600}}>Annuler</button>}
          <button onClick={save} disabled={busy} style={{flex:2,padding:"10px",background:T.blue,color:"white",border:"none",borderRadius:9,cursor:busy?"default":"pointer",fontWeight:700}}>
            {busy?"⏳ Envoi...":editingId?"💾 Enregistrer":"+ Ajouter"}
          </button>
        </div>
      </div>

      <button onClick={onClose} style={{width:"100%",padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600,marginTop:14}}>Fermer</button>
    </div>
  </div>);
}
function CatsAdmin({categories,onSave,caisseUrl}){
  const [newName,setNewName]=useState("");
  const [editId,setEditId]=useState(null);const [editName,setEditName]=useState("");
  const add=async()=>{if(!newName.trim())return;const id="c"+uid();const arr=[...categories,{id,name:newName.trim()}];
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveCategory",id,name:newName.trim()});setNewName("");};
  const saveEdit=async()=>{const arr=categories.map(c=>c.id===editId?{...c,name:editName}:c);
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveCategory",id:editId,name:editName});setEditId(null);};
  const del=async(id)=>{if(!window.confirm("Supprimer cette catégorie ?"))return;
    onSave(categories.filter(c=>c.id!==id));if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteCategory",id});};
  return(<div style={{height:"100%",overflowY:"auto",padding:"14px"}}>
    <div style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>+ Nouvelle catégorie</div>
      <div style={{display:"flex",gap:8}}>
        <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nom de la catégorie"
          style={{flex:1,padding:"10px 12px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:14,outline:"none"}}/>
        <button onClick={add} style={{padding:"10px 16px",background:T.red,color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>+</button>
      </div>
    </div>
    {categories.map(c=><div key={c.id} style={{background:T.card,borderRadius:10,padding:"12px 14px",marginBottom:8,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
      {editId===c.id?<>
        <input value={editName} onChange={e=>setEditName(e.target.value)} style={{flex:1,padding:"8px 10px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:14,outline:"none"}}/>
        <button onClick={saveEdit} style={{padding:"8px 12px",background:T.green,color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>✓</button>
        <button onClick={()=>setEditId(null)} style={{padding:"8px 12px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,cursor:"pointer"}}>✕</button>
      </>:<>
        <div style={{flex:1,fontSize:14,fontWeight:600,color:T.dark}}>📂 {c.name}</div>
        <button onClick={()=>{setEditId(c.id);setEditName(c.name);}} style={{padding:"6px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:12}}>✏️</button>
        <button onClick={()=>del(c.id)} style={{padding:"6px 9px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
      </>}
    </div>)}
  </div>);
}

function SitesAdmin({sites,onSave,caisseUrl}){
  const [newS,setNewS]=useState({name:"",village:"",color:"#CC0000"});
  const [editS,setEditS]=useState(null);
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};
  const add=async()=>{if(!newS.name)return;const id="s"+uid().slice(-4);const arr=[...sites,{...newS,id}];
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveSite",id,...newS});setNewS({name:"",village:"",color:"#CC0000"});};
  const saveEdit=async()=>{const arr=sites.map(s=>s.id===editS.id?editS:s);
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveSite",id:editS.id,name:editS.name,village:editS.village,color:editS.color});setEditS(null);};
  const del=async(id)=>{if(!window.confirm("Supprimer ?"))return;onSave(sites.filter(s=>s.id!==id));if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteSite",id});};
  return(<div style={{height:"100%",overflowY:"auto",padding:"14px"}}>
    <div style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>+ Nouveau site</div>
      <input style={inp} placeholder="Nom de la buvette" value={newS.name} onChange={e=>setNewS({...newS,name:e.target.value})}/>
      <input style={inp} placeholder="Nom du village" value={newS.village} onChange={e=>setNewS({...newS,village:e.target.value})}/>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <label style={{fontSize:12,fontWeight:600,color:T.dark}}>Couleur</label>
        <input type="color" value={newS.color} onChange={e=>setNewS({...newS,color:e.target.value})} style={{width:44,height:32,border:`1px solid ${T.border}`,borderRadius:6,cursor:"pointer"}}/>
        <span style={{fontSize:12,color:T.mid}}>{newS.color}</span>
      </div>
      <button onClick={add} style={{width:"100%",padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Ajouter</button>
    </div>
    {sites.map(s=><div key={s.id} style={{background:T.card,borderRadius:10,padding:"11px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
      <span style={{width:14,height:14,borderRadius:"50%",background:s.color,display:"inline-block",flexShrink:0}}/>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:T.dark}}>{s.name}</div><div style={{fontSize:11,color:T.mid}}>{s.village}</div></div>
      <button onClick={()=>setEditS({...s})} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
      <button onClick={()=>del(s.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
    </div>)}
    {editS&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:340}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:14}}>✏️ {editS.name}</div>
        <input style={inp} value={editS.name} onChange={e=>setEditS({...editS,name:e.target.value})} placeholder="Nom"/>
        <input style={inp} value={editS.village} onChange={e=>setEditS({...editS,village:e.target.value})} placeholder="Village"/>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <label style={{fontSize:12,fontWeight:600}}>Couleur</label>
          <input type="color" value={editS.color} onChange={e=>setEditS({...editS,color:e.target.value})} style={{width:44,height:32,border:`1px solid ${T.border}`,borderRadius:6,cursor:"pointer"}}/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEditS(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={saveEdit} style={{flex:2,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Enregistrer</button>
        </div>
      </div>
    </div>}
  </div>);
}

function UsersAdmin({users,onSave,caisseUrl}){
  const [newU,setNewU]=useState({name:"",pin:"",role:"cashier"});
  const [editU,setEditU]=useState(null);
  const inp={width:"100%",padding:"9px 11px",border:`1px solid ${T.border}`,borderRadius:8,fontSize:13,outline:"none",marginBottom:7};
  const add=async()=>{if(!newU.name||!newU.pin)return;const id="u"+uid();const arr=[...users,{...newU,id}];
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveUser",id,...newU});setNewU({name:"",pin:"",role:"cashier"});};
  const saveEdit=async()=>{const arr=users.map(u=>u.id===editU.id?editU:u);
    onSave(arr);if(caisseUrl)await apiWrite(caisseUrl,{action:"saveUser",id:editU.id,name:editU.name,pin:editU.pin,role:editU.role});setEditU(null);};
  const del=async(id)=>{if(users.length<=1){alert("Impossible de supprimer le dernier utilisateur");return;}
    if(!window.confirm("Supprimer ?"))return;onSave(users.filter(u=>u.id!==id));if(caisseUrl)await apiWrite(caisseUrl,{action:"deleteUser",id});};
  const roleLabel={admin:"🔑 Admin",cashier:"💳 Caissier"};
  return(<div style={{height:"100%",overflowY:"auto",padding:"14px"}}>
    <div style={{background:"#E3F2FD",borderRadius:12,padding:12,marginBottom:14,fontSize:13,color:"#1565C0"}}>ℹ️ <strong>Admin</strong> : accès complet. <strong>Caissier</strong> : accès caisse uniquement. Si aucun utilisateur, connexion libre.</div>
    <div style={{background:T.card,borderRadius:12,padding:14,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:10}}>+ Nouvel utilisateur</div>
      <input style={inp} placeholder="Nom" value={newU.name} onChange={e=>setNewU({...newU,name:e.target.value})}/>
      <input style={inp} type="password" placeholder="PIN (chiffres)" value={newU.pin} onChange={e=>setNewU({...newU,pin:e.target.value})} maxLength={6}/>
      <select value={newU.role} onChange={e=>setNewU({...newU,role:e.target.value})} style={{...inp}}>
        <option value="admin">Admin (accès complet)</option><option value="cashier">Caissier (caisse uniquement)</option>
      </select>
      <button onClick={add} style={{width:"100%",padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Ajouter</button>
    </div>
    {users.map(u=><div key={u.id} style={{background:T.card,borderRadius:10,padding:"12px 14px",marginBottom:7,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,color:T.dark}}>{u.name}</div>
        <div style={{fontSize:12,color:T.mid}}>{roleLabel[u.role]||u.role} • PIN: {"●".repeat(u.pin?.length||4)}</div>
      </div>
      <button onClick={()=>setEditU({...u})} style={{padding:"5px 10px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:7,cursor:"pointer",fontSize:11}}>✏️</button>
      <button onClick={()=>del(u.id)} style={{padding:"5px 8px",background:"#FFF0F0",border:"none",borderRadius:7,cursor:"pointer",color:T.red}}>🗑</button>
    </div>)}
    {editU&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:T.card,borderRadius:18,padding:22,width:"100%",maxWidth:340}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:14}}>✏️ {editU.name}</div>
        <input style={inp} value={editU.name} onChange={e=>setEditU({...editU,name:e.target.value})} placeholder="Nom"/>
        <input style={inp} type="password" value={editU.pin} onChange={e=>setEditU({...editU,pin:e.target.value})} placeholder="PIN"/>
        <select value={editU.role} onChange={e=>setEditU({...editU,role:e.target.value})} style={{...inp}}>
          <option value="admin">Admin</option><option value="cashier">Caissier</option>
        </select>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEditU(null)} style={{flex:1,padding:"11px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,cursor:"pointer",fontWeight:600}}>Annuler</button>
          <button onClick={saveEdit} style={{flex:2,padding:"11px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>Enregistrer</button>
        </div>
      </div>
    </div>}
  </div>);
}

// ═══ SETTINGS ═══
function SettingsScreen({caisseUrl,boissonsUrl,onSync,onInit}){
  const [cu,setCu]=useState(caisseUrl);const [bu,setBu]=useState(boissonsUrl);const [msg,setMsg]=useState("");
  // Une URL Apps Script valide ressemble à https://script.google.com/macros/s/XXXX/exec
  // (souvent copiée-collée avec un espace ou un retour à la ligne en trop, ce qui casse
  // TOUS les appels réseau sans message clair -> on nettoie et on vérifie avant d'enregistrer).
  const urlOk=u=>/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(u.trim());
  const cuOk=!cu.trim()||urlOk(cu), buOk=!bu.trim()||urlOk(bu);
  const save=()=>{
    const cuT=cu.trim(), buT=bu.trim();
    LS.set("anf87_caisse_url",cuT);LS.set("anf87_url",buT);
    setCu(cuT);setBu(buT);
    setMsg("✅ URLs enregistrées, rechargement…");
    setTimeout(()=>window.location.reload(),900);
  };
  const initSheets=async()=>{
    setMsg("⏳ Initialisation...");
    const r=await onInit();
    setMsg(r?.ok?"✅ "+r.message:"❌ "+(r?.error||"Échec de connexion. Vérifiez l'URL du script Caisse ci-dessus (espaces, /exec en fin d'URL) et que le déploiement Apps Script est bien accessible en \"Anyone\"."));
    setTimeout(()=>setMsg(""),8000);
  };
  const inp=ok=>({width:"100%",padding:"11px 12px",border:`1px solid ${ok?T.border:T.red}`,borderRadius:8,fontSize:12,outline:"none",marginBottom:4,wordBreak:"break-all"});
  return(<div style={{height:"100%",overflowY:"auto",padding:"14px"}}>
    <div style={{fontWeight:800,fontSize:18,color:T.dark,marginBottom:16}}>⚙️ Configuration</div>
    <div style={{background:T.card,borderRadius:12,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:4}}>URL Script Caisse (Google Sheets produits/ventes)</div>
      <input style={inp(cuOk)} value={cu} onChange={e=>setCu(e.target.value)} onBlur={()=>setCu(c=>c.trim())} placeholder="https://script.google.com/macros/s/.../exec"/>
      {!cuOk&&<div style={{fontSize:11,color:T.red,marginBottom:6}}>⚠ Doit commencer par https://script.google.com/macros/s/ et finir par /exec (pas d'espace)</div>}
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:4,marginTop:8}}>URL Script Boissons Offertes</div>
      <input style={inp(buOk)} value={bu} onChange={e=>setBu(e.target.value)} onBlur={()=>setBu(b=>b.trim())} placeholder="https://script.google.com/macros/s/.../exec"/>
      {!buOk&&<div style={{fontSize:11,color:T.red,marginBottom:6}}>⚠ Doit commencer par https://script.google.com/macros/s/ et finir par /exec (pas d'espace)</div>}
      <button onClick={save} style={{width:"100%",padding:"12px",background:T.red,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,marginTop:4}}>Enregistrer</button>
      {msg&&<div style={{marginTop:8,fontSize:13,fontWeight:600,textAlign:"center",color:msg.startsWith("✅")?T.green:msg.startsWith("⏳")?T.orange:T.red}}>{msg}</div>}
    </div>
    <div style={{background:T.card,borderRadius:12,padding:16,border:`1px solid ${T.border}`,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:T.dark,marginBottom:12}}>Google Sheets</div>
      <button onClick={initSheets} style={{width:"100%",padding:"12px",background:"#1565C0",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700,marginBottom:8}}>🗄 Initialiser les feuilles (1ère utilisation)</button>
      <button onClick={onSync} style={{width:"100%",padding:"12px",background:T.dark,color:"white",border:"none",borderRadius:10,cursor:"pointer",fontWeight:700}}>↻ Synchroniser depuis Google Sheets</button>
    </div>
    <div style={{background:"#E8F5E9",borderRadius:12,padding:14,border:"1px solid #A5D6A7",marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:"#2E7D32",marginBottom:6}}>💳 SumUp TPE</div>
      <div style={{fontSize:12,color:"#2E7D32",lineHeight:1.6}}>Le bouton "Carte Bleue" envoie directement la commande au TPE via <code>sumupmerchant://pay</code>. L'app SumUp doit être installée sur l'appareil et le TPE associé.</div>
    </div>
  </div>);
}
